{y:212,t:'Édit de Caracalla — Juifs citoyens romains',d:'La Constitutio Antoniniana accorde la citoyenneté romaine à tous les hommes libres de l\'Empire, incluant les Juifs. Impact majeur : les Juifs sont désormais soumis au droit civil romain, mais bénéficient de protections théoriques.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Édit_de_Caracalla',i:2},
{y:240,t:'Shmuel et Shapur — "Dina de-Malkhuta Dina"',d:'Le sage Shmuel de Néhardée établit des relations cordiales avec le Shah Shapur Ier de Perse. Il formule le principe halakhique central : "Dina de-malkhuta dina" (la loi de l\'État est la loi). Les Juifs de Babylonie vivent dans une relative prospérité.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Samuel_de_Néhardée',i:2},
{y:438,t:'Code Théodosien — Statut juif codifié',d:'Théodose II codifie des décennies de législation : interdiction de nouvelles synagogues, d\'exercer des charges publiques, de contracter de nouveaux mariages mixtes. Les Juifs = "religio licita" tolérée mais marginalisée. Modèle du statut juif médiéval.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Code_théodosien',i:2},
{y:470,t:'Persécutions perses sous Péroz Ier',d:'Le roi sassanide Péroz Ier (459-484) interdit le Shabbat, ferme les académies et tue de nombreux Juifs de Babylonie. Son fils Kobad est plus tolérant. Les académies de Soura et Pumbedita résistent.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Péroz_Ier',i:2},
{y:553,t:'Novella 146 de Justinien — Ingérence liturgique',d:'L\'Emp. Justinien publie la Novella 146 qui s\'immisce dans les synagogues : obligation du grec pour la lecture biblique, interdiction du Deutérose (midrash). Premier exemple d\'ingérence impériale directe dans la liturgie juive.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Justinien_Ier',i:2},
{y:600,t:'Juifs d\'Arabie pré-islamique',d:'Présence juive significative en Arabie (Médine, Khaybar). Tribus juives Banu Qaynuqa, Banu Nadir, Banu Qurayza. Commerce actif, poésie hébraïque. L\'islam naissant se définira en partie en dialogue/tension avec elles.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Juifs_d%27Arabie',i:2},

// ══════════════════════════════════════════════════════════
// PROPHÈTES & SAGES (j_fig) — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:25,t:'Rabban Gamliel l\'Ancien',d:'Chef du Sanhédrin à Jérusalem. Petit-fils d\'Hillel. Cité dans les Actes des Apôtres (5:34) où il plaide pour la modération envers les chrétiens. Établit les règles du guet (divorce) pour protéger les femmes. Pharisien modéré éminent.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Gamliel_l%27Ancien',i:2},
{y:90,t:'Rabbi Éliézer ben Hyrcanus — Gardien de la tradition',d:'Tanna de la 2e génération, disciple de Raban Yohanan ben Zakkaï. Ultra-conservateur : "Je n\'ai jamais enseigné un enseignement que je n\'aie reçu de mon maître." Excommunié pour intransigeance (affaire du four d\'Akhnai). Figure tragique du judaïsme.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Eliezer_ben_Hyrcanus',i:2},
{y:110,t:'Rabbi Tarfon — "Ce n\'est pas à toi d\'achever"',d:'Tanna de la 2e génération, prêtre-sage. "Ce n\'est pas à toi d\'achever la tâche, mais tu n\'es pas libre de t\'en exonérer" (Pirqei Avot 2:16). Riche et généreux. Débats légendaires avec Rabbi Akiva sur l\'exégèse.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Tarfon',i:1},
{y:250,t:'Rav Huna — Pilier de l\'académie de Soura',d:'Rav Huna (d. 297), disciple direct de Rav. Dirige l\'académie de Soura pendant 40 ans. Des foules de 800 étudiants. Généreux envers les pauvres (12 caloumnes de vin pour la Pessah). Grande stature morale et intellectuelle.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rav_Huna',i:2},
{y:299,t:'Rava de Mahoza — Maître du Talmud',d:'Rava (299-352), chef de l\'académie de Mahoza (capitale sassanide). Rival d\'Abaye. "Les disputes d\'Abaye et Rava" structurent le cœur du Talmud Bavli. En cas de désaccord la loi suit Rava (sauf 6 exceptions — "YAL KGaM").',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rava',i:3},
{y:375,t:'Rav Papa — Brasseur et sage',d:'Rav Papa (d. 375), disciple de Rava et Abaye. Dirige l\'académie de Naresh. Riche brasseur de bière pour financer ses études. Les "proverbes de Rav Papa" : sentences populaires parmi les plus citées du Talmud.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rav_Papa',i:2},
{y:906,t:'Sherira Gaon — Chronique des académies',d:'Sherira ben Hanina Gaon (906-1006), Gaon de Pumbedita. Sa célèbre "Épître" (Iggéret Rav Sherira Gaon, 987) est une source historique irremplaçable sur la transmission de la Torah orale et la chronologie des académies babyloniennes.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Sherira_Gaon',i:2},
{y:939,t:'Hai Gaon — Dernier et plus grand des Gueonim',d:'Hai ben Sherira Gaon (939-1038). Dirige Pumbedita 40 ans. Plus de 1 000 responsa. Poésie liturgique hébraïque. Correspondant de toute la diaspora. Sa mort (1038) marque la fin de l\'ère des Gueonim de Babylonie — 400 ans d\'autorité.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Hai_Gaon',i:3},
{y:993,t:'Samuel HaNaguid — Vizir, général, poète',d:'Samuel ibn Nagrela Ha-Naguid (993-1056). Vizir du royaume de Grenade. Commande des armées. Poète hébraïque de génie. Talmudiste. Premier des grands séfarades médiévaux. "Ha-Naguid" = le Prince. Incarne l\'apogée de la convivencia.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Samuel_ibn_Nagrela',i:3},

// ══════════════════════════════════════════════════════════
// SECTES & COURANTS JUIFS (j_sects) — COMPLÉMENTS
// ══════════════════════════════════════════════════════════
{y:200,t:'Tannaim — École de transmission standardisée',d:'Les Tannaim (de "tanna" = répéter/enseigner) sont les sages cités dans la Mishna (70-220 EC). Cinq générations. Leurs débats forment la Mishna et les Baraïtot (sources talmudiques extérieures). Système d\'enseignement oral rigoureux et codifié.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Tannaim',i:2},
{y:220,t:'Amoraïm — Les interprètes du Talmud',d:'Les Amoraïm ("ceux qui interprètent") succèdent aux Tannaim. Actifs en Palestine (220-400) et Babylonie (220-500). Leur commentaire de la Mishna = le Talmud (Guemara). Cinq générations en Palestine, sept en Babylonie.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Amoraim',i:2},
{y:800,t:'Piyyout — Poésie liturgique hébraïque',d:'La Piyyout se développe en Palestine, Babylonie et Italie du Sud (VIe-IXe s.). Yossi ben Yossi, Yannai, Éléazar ha-Qallir — acrostiches virtuoses. Enrichit les liturgies des fêtes (Yom Kippour, Rosh Hashana, Pessah). Art poétique spécifiquement juif.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Piyyout',i:2},

// ══════════════════════════════════════════════════════════
// DIASPORA & COMMUNAUTÉS (j_diap) — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:38,t:'Pogrom d\'Alexandrie (38 EC) — Flaccus',d:'Le préfet d\'Égypte Flaccus laisse les Grecs attaquer les Juifs d\'Alexandrie. Synagogues profanées, quartier juif pillé, humiliations publiques. Philon mène une ambassade à Caligula. Premier pogrom pleinement documenté de l\'histoire.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Pogrom_d%27Alexandrie_(38)',i:2},
{y:300,t:'Juifs à Cologne — Premier document d\'Europe du Nord',d:'Rescrit de Constantin (321) accordant aux Juifs de Cologne (Colonia Agrippina) le droit d\'accéder à la curie municipale. Première mention documentée d\'une communauté juive en Europe du Nord. Berceau de la future communauté ashkénaze rhénane.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Allemagne',i:2},
{y:500,t:'Communautés juives en Gaule — Premières traces',d:'Juifs établis à Lyon (Lugdunum), Arles, Narbonne, Marseille et Paris. Commerçants, orfèvres, médecins. Chartes de protection mérovingiennes. Les Carolingiens les favoriseront. Futur berceau de l\'ashkénazisme occidental.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_France',i:1},
{y:600,t:'Juifs en Inde — Malabar et Cochin',d:'Tradition de présence juive au Kerala (Malabar) possiblement depuis l\'Antiquité. Les cuivre-plates de Joseph Rabban accordent des privilèges royaux à la communauté. Deux groupes distincts : "noirs" (Malabari) et "blancs" (Pardesi, séfarades tardifs).',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Juifs_de_Cochin',i:2},
{y:800,t:'Juifs de Kaifeng — Chine',d:'Communauté juive de Kaifeng (Chine) — tradition d\'arrivée sous les Tang ou antérieure. Synagogue documentée à partir du XIe s. Torah conservée. Intégration quasi totale dans la culture chinoise mais identité maintenue pendant 1 000 ans.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Juifs_de_Kaifeng',i:2},

// ══════════════════════════════════════════════════════════
// BYZANCE — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:330,t:'Fondation de Constantinople — Nouvelle Rome',d:'Constantin Ier fonde Constantinople (ancienne Byzance) le 11 mai 330. "Nouvelle Rome" dédiée à la Vierge Marie. Centre de la civilisation chrétienne orientale pendant 1 125 ans. Importante communauté juive dès la fondation.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Constantinople',i:3},
{y:381,t:'Concile de Constantinople — Credo définitif',d:'2e Concile œcuménique, complète le Credo de Nicée (ajout de l\'Esprit Saint). Arianisme définitivement condamné. Patriarcat de Constantinople "second après Rome." Base de l\'orthodoxie chrétienne que les Juifs de l\'Empire devront côtoyer.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Premier_concile_de_Constantinople',i:2},
{y:415,t:'Hypatie d\'Alexandrie assassinée',d:'Hypatie, philosophe néo-platonicienne et mathématicienne d\'Alexandrie. Conseillère du préfet Oreste (politique favorable aux Juifs). Assassinée par une foule chrétienne fanatique (415). Symbole du conflit entre raison antique et fanatisme.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Hypatie_d%27Alexandrie',i:3},
{y:527,t:'Justinien Ier — Corpus Juris Civilis',d:'Justinien Ier (527-565). Codifie le droit romain (Corpus Juris Civilis, 534). Reconquête de l\'Afrique, de l\'Italie, de l\'Espagne. Sainte-Sophie inaugurée (537). Ingérence dans les synagogues (Novella 146). Ferme l\'Académie platonicienne d\'Athènes.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Justinien_Ier',i:3},
{y:537,t:'Sainte-Sophie inaugurée',d:'"Salomon, je t\'ai vaincu !" Justinien inaugure Hagia Sophia. Dôme de 31 m de diamètre. Chef-d\'œuvre absolu de l\'architecture byzantine et de l\'humanité. Convertie en mosquée en 1453. Musée de 1934 à 2020.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Sainte-Sophie_de_Constantinople',i:3},
{y:610,t:'Héraclius — Reconquête et expulsion des Juifs',d:'Héraclius (610-641) contre-attaque contre les Sassanides qui avaient pris Jérusalem (614). Reconquiert la Vraie Croix (628). Mais trahit ses alliances avec les Juifs : les expulse de Jérusalem (629). Byzance s\'effondre face à l\'Islam 10 ans plus tard.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Héraclius',i:3},
{y:726,t:'Iconoclasme byzantin — Léon III',d:'Léon III l\'Isaurien interdit le culte des icônes (726). Pape Grégoire II s\'y oppose. Schisme culturel profond. L\'iconoclasme dure 100 ans. Querelle dans laquelle certains théologiens chrétiens invoquent l\'influence juive.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Iconoclasme_byzantin',i:3},
{y:800,t:'Basile Ier — Conversions forcées des Juifs',d:'L\'Emp. Basile Ier (867-886), fondateur de la dynastie macédonienne, ordonne la conversion forcée des Juifs de l\'Empire byzantin. Résistance passive. Son fils Léon VI annule la mesure. Cycle byzantin : tolérance / persécution selon les empereurs.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Basile_Ier_(empereur_byzantin)',i:2},

// ══════════════════════════════════════════════════════════
// ISLAM — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:661,t:'Ali ibn Abi Talib assassiné — Schisme fondateur',d:'Ali, cousin et gendre du Prophète, est assassiné à Kufa par un kharijite. Sa mort consomme la division. Ses partisans = "Chiites" (Shia Ali). Son fils Hussein sera martyrisé à Karbala (680). Ce schisme irréductible façonne encore le monde islamique.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Ali_ibn_Abi_Talib',i:3},
{y:688,t:'Abd al-Malik — Arabisation et dinar islamique',d:'Abd al-Malik (685-705). Réforme monétaire : premières pièces islamiques (dinar d\'or, dirham d\'argent) sans image. Arabisation de l\'administration. Construit le Dôme du Rocher (691). Rationalise le califat omeyyade.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Abd_al-Malik',i:2},
{y:813,t:'Al-Mamun — Mutazilisme et raison islamique',d:'Al-Mamun (813-833). Promeut le Mutazilisme (théologie rationnelle : le Coran est créé, non incréé). Maison de la Sagesse. Traduit le grec en arabe. Conflit avec les traditionalistes hanbalites (Ibn Hanbal emprisonné).',tr:'islam',w:'https://fr.wikipedia.org/wiki/Al-Ma%27mun',i:3},
{y:870,t:'Al-Bukhari — Hadith authentifiés',d:'Muhammad al-Bukhari (810-870) compile le Sahih al-Bukhari : 7 275 hadiths authentifiés parmi 600 000 examinés. Base de la jurisprudence sunnite avec le Sahih Muslim. Science rigoureuse des isnads (chaînes de transmission).',tr:'islam',w:'https://fr.wikipedia.org/wiki/Al-Bukhari',i:3},
{y:940,t:'Al-Farabi — "Deuxième maître" après Aristote',d:'Al-Farabi (872-950). Philosophie politique, logique, musicologie. "La Cité vertueuse." Théorie des intelligences séparées. Influence directe sur Avicenne et Maïmonide. Pont entre Aristote et la philosophie islamique puis judéo-médiévale.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Al-Farabi',i:3},

// ══════════════════════════════════════════════════════════
// LEVANT — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:200,t:'Galilée — Centre du judaïsme palestinien',d:'Après 135, le judaïsme palestinien se réfugie en Galilée : Tibériade, Sepphoris, Beit Shearim. Le Patriarcat (Nassi) y réside. La Mishna y est rédigée. Tibériade : académie et Sanhédrin reconstitué. La Galilée = dernier foyer juif autonome en Eretz Israël.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Galilée',i:2},
{y:629,t:'Héraclius expulse les Juifs de Jérusalem',d:'Après la reconquête byzantine, Héraclius entre triomphalement à Jérusalem (629). Influencé par moines et évêques, il brise ses promesses aux Juifs (qui avaient aidé les Perses) et les expulse à nouveau. 9 ans avant la conquête arabe.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Héraclius',i:2},
{y:691,t:'Dôme du Rocher — Construction sur l\'Esplanade',d:'Abd al-Malik fait construire le Dôme du Rocher (685-691) sur le rocher de l\'Akedah (sacrifice d\'Abraham) et de l\'Ascension du Prophète. Architecture byzantine réutilisée. Inscriptions anti-trinitaires. Premier grand monument islamique.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Dôme_du_Rocher',i:3},
{y:969,t:'Palestine sous les Fatimides chiites',d:'Les Fatimides (chiites ismaïliens d\'Égypte) prennent la Palestine. Instabilité politique. Juifs parfois bien traités. Mais le calife Hakim (996-1021) ordonnera des destructions (Saint-Sépulcre, 1009) et persécutera Juifs et chrétiens.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Califat_fatimide',i:1},

// ══════════════════════════════════════════════════════════
// MÉSOPOTAMIE & PERSE — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:226,t:'Ardashir Ier — Empire sassanide fondé',d:'Ardashir Ier renverse le dernier Arsacide (Artaban IV). Fonde la dynastiee sassanide. Perse zoroastrienne, Ctésiphon capitale. Les Juifs de Babylonie (~300 000) sous domination sassanide pour 400 ans — période de rédaction du Talmud Bavli.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Ardachir_Ier',i:2},
{y:260,t:'Shapur Ier capture Valérien — Protège les Juifs',d:'Shapur Ier bat et capture l\'Emp. romain Valérien à Édesse (unique capture d\'un Emp. romain). Relations cordiales avec le sage Shmuel. Les Juifs de Babylonie vivent dans une relative prospérité sous les premiers Sassanides.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Châpour_Ier',i:2},
{y:531,t:'Khosro Ier Anushirvan — Âge d\'or sassanide',d:'"Le juste" (Anushirvan). Réformes fiscales. Accueille les philosophes néo-platoniciens chassés d\'Athènes (529). Traduit Platon et Aristote en pehlevi. Les académies juives de Soura et Pumbedita prospèrent. Le Talmud s\'achève.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Khosro_Ier',i:3},
{y:869,t:'Al-Kindi — Premier philosophe arabe',d:'Al-Kindi (d. ~873), "Philosophe des Arabes." Synthèse aristotélisme-néoplatonisme-Islam. Mathématiques, optique, musique. Influence sur Ibn Rushd (Averroès). Pionnier de la tradition philosophique islamique héritée par Maïmonide.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Al-Kindi',i:2},

// ══════════════════════════════════════════════════════════
// EUROPE DE L'OUEST — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:360,t:'Julien l\'Apostat — Dernier Emp. romain non-chrétien',d:'Flavius Claudius Julianus (360-363). Tente de restaurer le paganisme. Interdit les chrétiens d\'enseigner. Favorable aux Juifs : veut reconstruire le Temple. Meurt à Ctésiphon lors de la campagne contre les Perses. Les chrétiens célèbrent sa mort.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Julien_(empereur)',i:3},
{y:480,t:'Boèce — "Consolation de la Philosophie"',d:'Anicius Manlius Boèce (480-524), philosophe et homme d\'État romain. Traduit Aristote en latin. Emprisonné par Théodoric, rédige la "Consolation de la Philosophie." Exécuté en 524. Pont entre Antiquité et Moyen Âge, lu pendant 1 000 ans.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Boèce',i:3},
{y:507,t:'Théodoric le Grand — Roi des Ostrogoths en Italie',d:'Théodoric l\'Ostrogoth (493-526), roi d\'Italie. Protège Juifs et Romains. Boèce et Cassiodore à sa cour. Sénat romain maintenu. Ravenne capitale avec chefs-d\'œuvre mosaïstes. Modèle de coexistence.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Théodoric_le_Grand',i:3},
{y:597,t:'Grégoire le Grand évangélise l\'Angleterre',d:'Grégoire Ier envoie Augustin de Cantorbéry en Angleterre. Conversion des Anglo-Saxons. "Non pas des Angles mais des Anges." Sa politique envers les Juifs : protège mais humilie (Sicut Judaeis) — pas de conversion forcée, mais restrictions.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Grégoire_Ier',i:2},
{y:711,t:'Reconquête — Pelayo et les Asturies',d:'Défaite de la garnison islamique à Covadonga par Don Pelayo (~718). Début symbolique de la Reconquista. Royaume des Asturies fondé. Ce sera le noyau de la future Espagne chrétienne. La Reconquista durera 770 ans.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Reconquista',i:2},
{y:844,t:'Normands saccagent Paris',d:'Les Vikings normands remontent la Seine et assiègent Paris (845). Charles le Chauve paie 7 000 livres d\'argent. Les raids normands dévastent l\'Europe carolingienne. S\'installent définitivement en Normandie (911, traité de Saint-Clair).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Siège_de_Paris_(845)',i:2},
{y:911,t:'Duché de Normandie — Vikings chrétiens',d:'Rollon reçoit la Normandie du roi Charles le Simple en échange du baptême. Les Normands se christianisent en une génération. Leurs descendants conquéreront l\'Angleterre (1066) — y amenant des marchands juifs de Rouen.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Duché_de_Normandie',i:2},

// ══════════════════════════════════════════════════════════
// EUROPE DE L'EST — COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:375,t:'Wisigoths traversent le Danube — Début des Grandes Invasions',d:'Poussés par les Huns, les Wisigoths franchissent le Danube (376). Mal traités par les Romains, ils se révoltent. Adrianople (378) : l\'Emp. Valens tué — choc majeur. Début du démantèlement de l\'Empire romain d\'Occident.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Wisigoths',i:2},
{y:630,t:'Khan Kubrat — Grande Bulgarie',d:'Khan Kubrat unifie les tribus bulgares en "Grande Bulgarie" (sur la mer d\'Azov). Allié de Byzance. Ses fils dispersés par les Khazars. L\'un (Asparuh) fonde le premier Empire bulgare sur le Danube (681).',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Grande_Bulgarie',i:1},
{y:896,t:'Arrivée des Magyars — Fondation de la Hongrie',d:'Árpád conduit les sept tribus magyares de la steppe en Pannonie (895-896). Raids en Europe centrale. Défaite à Lechfeld (955) par Otto Ier. Christianisation sous Étienne Ier couronné en 1000. Fondation de la Hongrie.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Conquête_de_la_Pannonie_par_les_Hongrois',i:2},

// ══════════════════════════════════════════════════════════
// MAGHREB — NOUVELLE PISTE (Antiquité au XVe s.)
// ══════════════════════════════════════════════════════════
{y:-814,t:'Carthage fondée — Reine Didon (Élissa)',d:'"Qart-Hadasht" (Nouvelle Cité). Fondée par des colons phéniciens de Tyr, selon la tradition par la reine Élissa (Didon). Devient la plus grande cité d\'Occident (~500 000 hab. à l\'apogée). Religion punique : Tanit, Baal Hammon. Contact permanent avec la Palestine.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Carthage',i:3},
{y:-200,t:'Premières communautés juives au Maghreb',d:'Des Juifs s\'établissent à Carthage et dans les villes côtières dès l\'époque hellénistique. Après 70 EC, leur nombre croît avec les déportés de Judée. Présence attestée à Carthage (textes chrétiens de Tertullien), Cyrène, Leptis Magna.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Afrique_du_Nord',i:2},
{y:429,t:'Vandales au Maghreb — Geiseric prend Carthage',d:'Geiseric conduit les Vandales de l\'Espagne à l\'Afrique du Nord. Conquête de Carthage (439). Royaume vandale (429-534). Impact sur les communautés juives et berbères. L\'Afrique romaine chrétienne est dévastée.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Royaume_vandale',i:2},
{y:430,t:'Augustin d\'Hippone — Théologie de la tolérance surveillée',d:'Saint Augustin (354-430), évêque d\'Hippone (Annaba, Algérie). Sa mère Monica est berbère. Écrit "La Cité de dieu" sous la pression des Vandales. Sa doctrine du "témoin" juif (humilié mais préservé) influence le traitement des Juifs en Occident pendant 1 000 ans.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Augustin_d%27Hippone',i:3},
{y:534,t:'Reconquête byzantine de l\'Afrique du Nord',d:'Bélisaire (général de Justinien) détruit le Royaume vandale en un été. Retour de l\'Afrique dans l\'Empire. Selon Procope, la Ménorah du Temple (prise à Rome en 455 par les Vandales) fut retrouvée à Carthage et envoyée à Constantinople.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Reconquête_de_l%27Afrique',i:2},
{y:647,t:'Conquête arabe du Maghreb — La Kahina résiste',d:'Uqba ibn Nafi entreprend la conquête du Maghreb. La Kahina — reine berbère (peut-être judaïsante) — résiste héroïquement mais est vaincue (702). Le Maghreb devient islamique. Uqba fonde Kairouan (670). Communautés juives berbères intégrées ou maintenues comme dhimmis.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Conquête_musulmane_du_Maghreb',i:3},
{y:670,t:'Kairouan fondée — Future capitale intellectuelle',d:'Uqba ibn Nafi fonde Kairouan (actuelle Tunisie, 670). Grande Mosquée = l\'une des premières d\'Afrique. Kairouan devient le centre de l\'islam en Afrique du Nord. Importante communauté juive. L\'académie de Rabbi Hananel (Xe s.) sera un phare mondial.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Kairouan',i:2},
{y:800,t:'Idrissides au Maroc — Fès fondée',d:'Idriss II fonde Fès (789). Première dynaste islamique indépendante au Maroc (Idrissides, 788-985). Communauté juive de Fès parmi les plus anciennes du Maroc. Centre intellectuel judéo-arabe.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Idrisside',i:2},
{y:972,t:'Rabbi Hananel de Kairouan — Grand talmudiste',d:'Rabbi Hananel ben Hushiel (990-1055), Kairouan. Son commentaire sur le Talmud (premier à couvrir la plupart des traités) est encore étudié. Avec Rabbi Nissim de Kairouan = zénith de la vie intellectuelle juive au Maghreb.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Hananel_ben_Hushiel',i:3},
{y:1000,t:'Rabbi Nissim de Kairouan — Contes et Talmud',d:'Rabbi Nissim ibn Shahin (~990-1062). Son "Hibbur Yapheh" (Délectables recueils) = plus ancien recueil de contes juifs médiévaux (en judéo-arabe). Talmudiste et médecin. Apogée de l\'académie de Kairouan.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Nissim_ben_Jacob',i:3},
{y:1055,t:'Almoravides conquièrent le Maroc et l\'Espagne',d:'Les Almoravides (Al-Murabitun), Berbères du Sahara, prennent Marrakech (1070) puis le Maghreb et l\'Espagne (1090). Orthodoxie sunnite stricte. Juifs du Maghreb sous pression. Fès reste un centre juif important.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Almoravides',i:2},
{y:1148,t:'Almohades — Conversion forcée ou exil',d:'Les Almohades (Al-Muwahhidun) imposent l\'Islam aux Juifs et chrétiens du Maghreb : "La mosquée ou l\'épée." Maïmonide fuit Cordoue. Synagogues détruites. Certains Juifs fuient vers l\'Égypte (Maïmonide), d\'autres vers Provence et Italie. Traumatisme majeur.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Almohades',i:3},
{y:1250,t:'Mérinides — Mellah de Fès',d:'Les Mérinides (Berbères du Maroc, 1244-1465) permettent aux Juifs de vivre dans des mellah (quartiers juifs). Premier mellah officiel : Fès (1276). Tolérance relative après l\'intransigeance almohade. Les communautés se reconstituent.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Mérinides',i:2},
{y:1391,t:'Réfugiés des pogroms espagnols au Maghreb',d:'Les pogroms d\'Espagne (1391) poussent des centaines de familles vers Tlemcen, Béjaïa, Tunis, Fès. Arrivée d\'une culture séfarade au Maghreb. Tensions parfois avec les Juifs berbères pré-établis ("Toshavim" vs "Megorashim").',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Juifs_du_Maghreb',i:2},
{y:1492,t:'Exil de 1492 — Vague séfarade au Maghreb',d:'L\'expulsion d\'Espagne (1492) amène ~50-100 000 Juifs séfarades au Maghreb : Fès, Tlemcen, Tunis, Alger, Marrakech. La communauté séfarade ("Megorashim") s\'installe souvent dans ses propres quartiers. Début d\'une ère nouvelle pour le judaïsme nord-africain.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_d%27Espagne',i:3},

// ══════════════════════════════════════════════════════════
// SELDJOUKIDES & EMPIRE OTTOMAN (ottoman)
// ══════════════════════════════════════════════════════════
{y:1037,t:'Seldjoukides — Grande puissance turque sunnite',d:'Toghrul Beg fonde l\'Empire seldjoukide en Perse et Mésopotamie. Prend Bagdad (1055). Bataille de Manzikert (1071) : Anatolie ouverte aux Turcs. Porte-parole du sunnisme face aux Fatimides chiites.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Seldjoukides',i:3},
{y:1071,t:'Bataille de Manzikert — Anatolie ouverte',d:'Les Seldjoukides capturent l\'Emp. Romain IV Diogène à Manzikert. L\'Anatolie s\'ouvre aux nomades turcs. Byzance perd son réservoir démographique. L\'urgence byzantine mène au Concile de Clermont (1095) et aux Croisades.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_de_Manzikert',i:3},
{y:1243,t:'Mongols battent les Seldjoukides à Köse Dağ',d:'Les Mongols de Baïdju écrasent les Seldjoukides de Rum à Köse Dağ (1243). Le sultanat devient vassal mongol. Les beyliks turcs profitent du vide. L\'un d\'eux — Osman — sera le fondateur de l\'Empire ottoman.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_de_Kösedağ',i:2},
{y:1299,t:'Osman Ier fonde la principauté ottomane',d:'Osman Gazi (~1258-1326) fonde la principauté ottomane en Anatolie nord-ouest. "Ottoman" = fils d\'Osman. Grandit aux dépens de Byzance. Son fils Orhan prend Bursa (1326), première capitale. La plus longue et grande dynastiee islamique commence.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Osman_Ier',i:3},
{y:1354,t:'Ottomans en Europe — Gallipoli',d:'Les Ottomans franchissent les Dardanelles et s\'installent en Europe (Gallipoli, 1354). Expansion en Thrace et Macédoine. Murad Ier fait d\'Andrinople (Édirne) sa capitale européenne (1365). L\'Europe orientale et les communautés juives des Balkans menacées.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Murad_Ier',i:3},
{y:1389,t:'Bataille de Kosovo — Mémoire serbe fondatrice',d:'Murad Ier bat les Serbes coalisés à Kosovo Polje (28 juin 1389). Murad assassiné après la bataille. La Serbie devient vassale ottomane. Kosovo = traumatisme fondateur de l\'identité serbe orthodoxe. La mémoire de cette bataille perdure jusqu\'à aujourd\'hui.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_de_Kosovo_(1389)',i:3},
{y:1402,t:'Timour bat les Ottomans à Ankara',d:'Timour Leng (Tamerlan) écrase le sultan ottoman Bajazet Ier à Ankara (1402). Bajazet fait prisonnier, meurt en captivité. Les Ottomans se fragmentent (interrègne 1402-1413). Mehmed Ier réunifie l\'Empire.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_d%27Ankara',i:3},
{y:1444,t:'Bataille de Varna — Croisade écrasée',d:'Murad II bat la dernière grande croisade (Jean Huniade, Władysław III de Pologne) à Varna. Fin des tentatives chrétiennes d\'expulser les Ottomans d\'Europe. La voie vers Constantinople est libre pour Mehmed II.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_de_Varna',i:2},
{y:1453,t:'Mehmed II "Fatih" — Chute de Constantinople',d:'Mehmed II prend Constantinople le 29 mai 1453 après 53 jours de siège. Constantin XI Paléologue meurt au combat. Hagia Sophia en mosquée. "Kayser-i Rum" (César des Romains). 70 000 Juifs accueillis dans la ville. Appel aux Juifs d\'Europe.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Mehmed_II',i:3},
{y:1461,t:'Système de millet ottoman — Autonomie des minorités',d:'Mehmed II organise le système de la millet : les communautés dhimmis (Juifs, chrétiens orthodoxes, arméniens) ont leurs institutions autonomes. Hakham Bachi (Grand Rabbin ottoman) reconnu à Constantinople. Contraste frappant avec l\'Inquisition espagnole.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Système_de_millet',i:2},
{y:1492,t:'Bajazet II accueille les Juifs expulsés d\'Espagne',d:'"Vous dites que Ferdinand est un roi sage. Il appauvrit son pays pour enrichir le nôtre." Bajazet II envoie des navires pour transporter les Juifs d\'Espagne. Salonique, Constantinople, Smyrne, Bursa. L\'Empire ottoman = principal refuge de la diaspora séfarade.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bajazet_II',i:3},

// ══════════════════════════════════════════════════════════
// JUDAÏSME — Histoire générale (j_main) 1000–1500
// ══════════════════════════════════════════════════════════
{y:1066,t:'Massacre de Grenade — Yusuf ibn Naghrella',d:'Yusuf ibn Naghrella, fils du vizir Samuel HaNaguid, est massacré avec une grande partie de la communauté juive de Grenade par une foule berbère (1066). Fin de l\'âge d\'or de Grenade. Signal avant-coureur de la violence à venir.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massacre_de_Grenade_(1066)',i:3},
{y:1090,t:'Almoravides envahissent al-Andalus',d:'Les Almoravides (Berbères du Maroc) prennent el-Andalus (1090) à la demande des rois de taïfas. Orthodoxie stricte. Puis les Almohades (1148) imposent la conversion ou l\'exil. Maïmonide et sa famille fuient Cordoue. Fin de la convivencia.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Almoravides',i:2},
{y:1096,t:'Première Croisade — Massacres rhénans (Gzerot Tatnu)',d:'"Gzerot Tatnu" (décrets de 4856). Des bandes croisées massacrent les Juifs de Rhénanie : Worms, Mayence, Cologne, Regensburg. Des milliers tués ou suicidés collectivement. Premier grand massacre de Juifs en Europe médiévale.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massacre_de_Juifs_lors_de_la_première_croisade',i:3},
{y:1099,t:'Prise de Jérusalem — Synagogue incendiée',d:'Les croisés prennent Jérusalem (15 juillet 1099). Les Juifs réfugiés dans leur synagogue sont brûlés vifs. Fin de la communauté juive de Jérusalem. Début d\'une absence forcée qui durera des décennies.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Siège_de_Jérusalem_(1099)',i:3},
{y:1144,t:'Première accusation de meurtre rituel — Norwich',d:'William de Norwich : première accusation documentée de meurtre rituel en Europe. Les Juifs accusés de tuer des enfants chrétiens pour Pessah. Topos de la haine médiévale. Se répand en France, Allemagne, Espagne tout au long du XIIe-XVe s.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/William_de_Norwich',i:3},
{y:1171,t:'Massacre de Blois — Première exécution collective en France',d:'À Blois, fausse accusation de meurtre rituel : 32 Juifs brûlés (20 Sivan 1171). Première mise à mort collective de Juifs en France. Rabbénou Tam et Rachi IIe génération en font un jour de deuil annuel.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massacre_de_Blois',i:3},
{y:1182,t:'Philippe Auguste expulse les Juifs de France',d:'Philippe II Auguste confisque les biens et dettes des Juifs (1180) puis les expulse de France (1182). Synagogues transformées en églises. Rappel partiel en 1198 pour leur utilité économique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_de_France_(1182)',i:3},
{y:1190,t:'Massacre de York — Clifford\'s Tower',d:'150 Juifs assiégés à Clifford\'s Tower (York) choisissent le suicide collectif (16 mars 1190). Leurs créanciers brûlent les registres de dettes dans la cathédrale. Traumatisme fondateur de la mémoire juive en Angleterre.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massacre_de_York',i:3},
{y:1215,t:'Concile de Latran IV — La Rouelle',d:'Le pape Innocent III impose aux Juifs le port d\'un signe distinctif (la "rouelle" — rond de tissu jaune). Interdiction d\'emplois publics. Séparation physique institutionnalisée. Prémices du ghetto.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Quatrième_concile_du_Latran',i:3},
{y:1240,t:'Dispute de Paris — Le Talmud condamné',d:'Nicolas Donin (Juif converti) accuse le Talmud de blasphème devant Louis IX. Les rabbins (dont Yehiel de Paris) défendent. Le Talmud condamné. Brûlement de 24 charretées de manuscrits à Paris (1242). Choc mondial pour le judaïsme.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Dispute_de_Paris',i:3},
{y:1263,t:'Dispute de Barcelone — Nahmanide vs Pablo Christiani',d:'Nahmanide (Ramban) défend le judaïsme contre le dominicain Pablo Christiani devant Jacques Ier d\'Aragon. Nahmanide "gagne" mais doit s\'exiler. Son compte-rendu = seul document juif d\'une dispute médiévale. Précédent de la défense intellectuelle.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Dispute_de_Barcelone',i:3},
{y:1264,t:'Statut de Kalisz — Protection des Juifs en Pologne',d:'Boleslav le Pieux de Pologne accorde la "Charte de Kalisz" aux Juifs : protection légale, liberté de commerce et de culte, tribunaux propres. Premier grand acte légal de tolérance en Europe de l\'Est. Attire les Juifs expulsés d\'Allemagne.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Statut_de_Kalisz',i:3},
{y:1290,t:'Expulsion des Juifs d\'Angleterre',d:'Édouard Ier expulse les Juifs d\'Angleterre (18 juillet 1290). ~2 000-3 000 Juifs partent. L\'Angleterre restera fermée aux Juifs jusqu\'à Cromwell (1656). Les Juifs expulsés s\'établissent en France, Flandres et dans l\'Empire.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_d%27Angleterre',i:3},
{y:1306,t:'Expulsion des Juifs de France — Philippe IV',d:'Philippe IV "le Bel" expulse les ~100 000 Juifs de France (juillet 1306), confisquant tous leurs biens. Rappelés par Louis X (1315), de nouveau expulsés (1322, 1394). La France médiévale = territoire à Juifs intermittents.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_de_France_(1306)',i:3},
{y:1348,t:'PESTE NOIRE — Pogroms et boucs émissaires',d:'La Peste Noire tue un tiers de l\'Europe. Les Juifs accusés d\'empoisonner les puits. Massacres systématiques : Strasbourg (1349, ~2 000 brûlés), Mayence, Bâle, etc. Le pape Clément VI condamne les massacres. Impact irréversible sur la démographie juive d\'Europe.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Persécutions_des_Juifs_lors_de_la_Peste_noire',i:3},
{y:1391,t:'Massacres d\'Espagne — Séville, Barcelone',d:'Pogroms en Espagne : Fernán Martínez prêche la haine à Séville. 4 000 Juifs tués, synagogues brûlées, conversions forcées massives. ~100 000 "Nouveaux Chrétiens" (conversos / marranes). Début du déclin irréversible du judaïsme ibérique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Pogroms_de_1391_en_Espagne',i:3},
{y:1394,t:'Expulsion définitive des Juifs de France',d:'Charles VI expulse définitivement les Juifs de France (17 sept. 1394). Fin de leur présence en France capétienne. Réfugies en Alsace (Empire), Provence, Savoie. La France sans Juifs pour 250 ans (jusqu\'à la Révolution).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_de_France_(1394)',i:3},
{y:1412,t:'Dispute de Tortosa — Conversions massives',d:'La Dispute de Tortosa (1413-1414) : Geronimo de Santa Fe vs représentants juifs devant l\'antipape Benoît XIII. 22 mois. Conversions massives. Les décrets de Valladolid (1412) interdisent aux Juifs professions libérales et commerce.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Dispute_de_Tortosa',i:3},
{y:1478,t:'Inquisition espagnole fondée',d:'Ferdinand et Isabelle fondent l\'Inquisition espagnole (bulle papale de Sixte IV, 1478). Torquemada, premier inquisiteur général (1483). Cible : les conversos suspectés de judaïsme secret. Autodafés. ~2 000 exécutés en 15 ans.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Inquisition_espagnole',i:3},
{y:1492,t:'EXPULSION DES JUIFS D\'ESPAGNE — 2 août 1492',d:'"El Gran Gerush" : Ferdinand et Isabelle signent le décret d\'expulsion (31 mars 1492). 150 000-300 000 Juifs quittent l\'Espagne avant le 2 août (9 Av). Vers l\'Empire ottoman, le Portugal, l\'Italie, le Maroc. Fin de 1 500 ans de présence juive en Ibérie. Tournant civilisationnel.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_d%27Espagne',i:3},
{y:1497,t:'Expulsion du Portugal — Baptêmes forcés',d:'Manuel Ier du Portugal force les Juifs au baptême en masse (1497) plutôt que de les expulser. Naissance de la communauté des "Nouveaux Chrétiens" portugais (crypto-juifs). La diaspora séfarade s\'étend vers Amsterdam, Hambourg, Bordeaux.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_au_Portugal',i:3},

// ══════════════════════════════════════════════════════════
// PROPHÈTES & SAGES (j_fig) 1000–1500
// ══════════════════════════════════════════════════════════
{y:1040,t:'Rachi — Commentateur par excellence',d:'Rabbi Salomon ben Isaac de Troyes (1040-1105). Son commentaire sur la Torah est publié dans toute édition du Pentateuque à ce jour. Son commentaire sur le Talmud en est la clé d\'accès indispensable. "Sans Rachi, le Talmud serait incompréhensible."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rachi',i:3},
{y:1075,t:'Judah Halevi — Poète et philosophe de la foi',d:'Judah Halevi (~1075-1141). Poète hébraïque de génie : Diwan, Zionides ("Tsion, halo tish\'ali..."). Le Kuzari : dialogue philosophique entre un roi khazar et un sage juif. Part pour la Terre d\'Israël et meurt à son arrivée (selon la légende). Maïmonide l\'admire.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Judah_Halevi',i:3},
{y:1089,t:'Abraham ibn Ezra — Grammairien, astronome, voyageur',d:'Abraham ben Meir ibn Ezra (1089-1167). Commentateur biblique (proto-critique : distingue les sources), grammairien, astrologue, mathématicien, poète. Vit à Babylone, Italie, France, Angleterre. "Selon ibn Ezra..." — cité par Spinoza (qui s\'inspire de sa critique biblique).',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Abraham_ibn_Ezra',i:3},
{y:1100,t:'Rabbénou Tam — Chef des Tosafistes',d:'Jacob ben Meir "Rabbénou Tam" (1100-1171), petit-fils de Rachi. Chef de l\'école des Tosafistes, qui critiquetn et approfondissent Rachi. Rescapé du pogrom de Ramerupt (1146). Organise des assemblées pan-ashkénazes. Autorité absolue en Europe du Nord.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Jacob_ben_Méïr',i:3},
{y:1135,t:'Maïmonide (Rambam) — Aigle de la Synagogue',d:'Moïse ben Maïmon (1135-1204), né à Cordoue. Philosophe (Guide des Égarés / Moreh Nevoukhim), codificateur (Michné Torah), médecin de Saladin. Ses 13 Principes de foi. "De Moïse à Moïse, il n\'y eut point de Moïse comme Moïse."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Maïmonide',i:3},
{y:1194,t:'Nahmanide (Ramban) — Mystique et légiste',d:'Moses ben Nahman / Nahmanide (1194-1270), Gérone. Commentaire biblique mêlant peshat et kabbale. Talmudiste immense. Défend le judaïsme à Barcelone (1263). S\'installe en Terre d\'Israël. Figure clé de la Kabbale géronaise.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Nahmanide',i:3},
{y:1235,t:'Rashba — Grand législateur de Barcelone',d:'Solomon ben Adret / Rashba (1235-1310), disciple de Nahmanide. Chef de la communauté de Barcelone pendant 40 ans. Des milliers de responsa. Interdit l\'étude de la philosophie avant 25 ans (polémique anti-maïmonidienne). Autorité halakhique d\'Espagne.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rashba',i:3},
{y:1250,t:'Rabbi Meir de Rothenburg — Martyr de la dignité',d:'Rabbi Meir de Rothenburg (~1215-1293), chef des Juifs d\'Allemagne. Tosafiste. Arrêté en 1286 par Rodolphe de Habsbourg. Refuse d\'être racheté pour ne pas encourager les prises d\'otages. Meurt en prison après 7 ans. Son cadavre libéré contre rançon 14 ans après.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Meir_de_Rothenburg',i:3},
{y:1280,t:'Moïse de Léon — Auteur du Zohar',d:'Moses ben Shem Tov de León (~1240-1305), kabbaliste de Castille. Diffuse le Zohar (attribué à R. Shimon bar Yochai mais rédigé par lui au XIIIe s. selon la plupart des chercheurs). Le Zohar devient le texte central de la mystique juive.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Moïse_de_León',i:3},
{y:1320,t:'Nissim Gerondi (Ran) — Juriste de Barcelone',d:'Rabbi Nissim ben Reuven Gerondi (Ran, ~1320-1380), Barcelone. Grand juriste. Son commentaire sur Alfasi et ses responsa. Maître de Hasdaï Crescas. Figure centrale de la dernière génération de savants séfarades avant les pogroms.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Nissim_ben_Reuven_Gerondi',i:2},
{y:1340,t:'Hasdaï Crescas — Critique d\'Aristote',d:'Hasdaï Crescas (1340-1410/11), rabbin de Barcelone. Deux fils tués en 1391. "Or Hachem" (Lumière du Seigneur) critique radicalement l\'aristotélisme maïmonidien. Influence directe sur Spinoza. Représente la résilience intellectuelle face au désastre.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Hasdai_Crescas',i:3},
{y:1360,t:'Maharil — Gardien des coutumes ashkénazes',d:'Jacob ben Moses Moellin ("Maharil", 1360-1427), rabbin de Mayence. Ses coutumes et responsa rassemblés dans le "Sefer HaMinhagim" fixent la liturgie ashkénaze jusqu\'à nos jours. Autorité musicale : chant synagogal codifié.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Maharil',i:2},
{y:1437,t:'Isaac Abravanel — Dernier grand d\'Espagne',d:'Isaac Abravanel (1437-1508), né à Lisbonne. Ministre des finances du Portugal puis de Castille. Refuse de signer le décret d\'expulsion (1492). Exil à Naples, puis Venise. Commentaires bibliques messianiquest. Dernier grand représentant du judaïsme ibérique médiéval.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Isaac_Abravanel',i:3},

// ══════════════════════════════════════════════════════════
// SECTES & COURANTS JUIFS (j_sects) 1000–1500
// ══════════════════════════════════════════════════════════
{y:1150,t:'Hassidei Ashkenaz — Piété mystique allemande',d:'Le mouvement des "Pieux d\'Allemagne" (XIIe-XIIIe s.) : Samuel le Pieux (Spire), son fils Juda le Pieux de Ratisbonne (Sefer Hassidim). Ascétisme, éthique rigoureuse, mystique pratique. Répond spirituellement à la violence des Croisades.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Hassidé_Ashkénaz',i:3},
{y:1200,t:'Controverse maïmonidienne — Raison vs tradition',d:'La publication du Guide des Égarés (traduit en hébreu par Samuel ibn Tibbon) déclenche une polémique 1200-1340. Anti-maïmonidiens (dirigés par le Rashba) vs défenseurs. Des livres maïmonidiens brûlés en France (1233). Schisme intellectuel majeur du judaïsme médiéval.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Controverse_maïmonidienne',i:3},
{y:1240,t:'Abraham Abulafia — Kabbale extatique',d:'Abraham Abulafia (~1240-1291?), kabbaliste espagnol. Kabbale "prophétique" basée sur la méditation des lettres hébraïques, la respiration et la visualisationdes Noms divins. Tente d\'aller voir le pape Nicolas III (1280). Fondateur d\'une tradition mystique unique.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Abraham_Aboulafia',i:2},
{y:1280,t:'ZOHAR — Révolution kabbalistique',d:'Le Zohar (Livre de la Splendeur) paraît en Castille ~1280-1285. Araméen mystique pseudo-archaïque. Doctrine des Sephirot, de l\'Adam Kadmon, du Tsimtsoum avant la lettre. Révolution spirituelle irréversible. Deviendra le texte central du Hassidisme.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Zohar',i:3},
{y:1391,t:'Marranes / Conversos — Crypto-judaïsme ibérique',d:'Les pogroms de 1391 créent une masse de convertis de force ("Anousim"). Les "Nouveaux Chrétiens" (conversos / marranes) maintiennent parfois des pratiques juives en secret. L\'Inquisition les traque. Phénomène social et théologique inédit.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Conversos',i:3},
// ══════════════════════════════════════════════════════════
// DIASPORA & COMMUNAUTÉS (j_diap) 1000–1500
// ══════════════════════════════════════════════════════════
{y:1000,t:'ShUM — Cœur de l\'ashkénazisme rhénan',d:'"ShUM" : Spire, Worms, Mayence — les trois grandes communautés rhénanes. Leurs décisions ("Takkanot ShuM") gouvernent le judaïsme ashkénaze. Rachi y étudie (Worms, Mayence). Synagogues de Worms (1034) = plus vieille synagogue d\'Europe du Nord encore visible.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/ShUM',i:3},
{y:1066,t:'Juifs en Angleterre — Arrivée normande',d:'Guillaume le Conquérant amène des marchands juifs de Rouen (1066). Communauté juive d\'Angleterre fondée sous protection royale. Aaron de Lincoln (~1125-1186) = l\'homme le plus riche d\'Angleterre. Situation précaire malgré la richesse.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Angleterre',i:2},
{y:1100,t:'Juifs en Palestine au temps des Croisades',d:'La prise de Jérusalem (1099) détruit la communauté locale. Des Juifs subsistent en Galilée (Tibériade, Safed, Acre). Les croisades déplacent des communautés vers Constantinople et l\'Italie. Un renouveau en Terre d\'Israël sous les Ayyoubides.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Palestine',i:2},
{y:1350,t:'Immigration vers la Pologne — Nouveau foyer de l\'Ashkénazisme',d:'Les persécutions de la Peste Noire poussent les Juifs d\'Allemagne et de France vers la Pologne et la Lituanie, plus accueillantes. Cracovie, Lwow, Poznan. Casimir III "le Grand" protège les Juifs (1364). "Po-Lin" (Hébreu : ici tu reposeras) = nom hébreu de la Pologne.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Pologne',i:3},
{y:1420,t:'Juifs de Prague et d\'Europe centrale',d:'Prague (quartier juif autour de la synagogue Vieille-Nouvelle, 1270) devient un centre intellectuel juif. Les Juifs d\'Empire — soumis aux taxes mais protégés théoriquement — développent une vie culturelle intense. Le Maharil à Mayence, Prague croissante.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Juifs_de_Prague',i:2},
{y:1492,t:'Salonique — Jerusalem des Balkans',d:'Après 1492, Salonique (Empire ottoman) accueille ~20 000 Juifs séfarades et devient majoritairement juive (60% de sa population). Grande ville juive. Imprimerie hébraïque. Talmud Torah. "Jerusalem des Balkans." Déportée par les nazis en 1943.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_à_Thessalonique',i:3},
// ══════════════════════════════════════════════════════════
// BYZANCE — 1000–1500
// ══════════════════════════════════════════════════════════
{y:1054,t:'GRAND SCHISME — Rome et Constantinople se séparent',d:'Le légat du pape dépose une bulle d\'excommunication sur l\'autel de Sainte-Sophie. Michel Cérulaire l\'excommunie en retour. Schisme entre catholicisme et orthodoxie — non résolu à ce jour. Les Juifs dans les deux sphères subissent des politiques différentes.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Grand_Schisme_de_1054',i:3},
{y:1071,t:'Manzikert — Byzance perd l\Anatolie',d:'La bataille de Manzikert (1071) : les Seldjoukides capturent Romain IV Diogène. L\'Anatolie s\'ouvre aux Turcs. Byzance perd sa base démographique. L\'urgence byzantine est un facteur de l\'appel aux Croisades (1095).',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Bataille_de_Manzikert',i:3},
{y:1182,t:'Massacre des Latins à Constantinople',d:'Les Byzantins massacrent les marchands latins (Vénitiens, Génois, Pisans) de Constantinople (1182). Représailles futures. Renforcement de la haine mutuelle qui mène au sac de 1204 par les croisés.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Massacre_des_Latins',i:2},
{y:1204,t:'Sac de Constantinople par les Croisés (4e Croisade)',d:'La 4e Croisade, détournée par Venise, s\'achève par le sac de Constantinople (3 jours). Empire latin de Constantinople (1204-1261). Byzance affaiblie de façon irréversible. Les précieux manuscrits grecs dispersés en Occident.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Sac_de_Constantinople_(1204)',i:3},
{y:1261,t:'Michel VIII Paléologue reconquiert Constantinople',d:'Michel VIII reconquiert Constantinople des Latins (25 juillet 1261). Dernière dynastie byzantine (Paléologue). Byzance réduite mais survit 200 ans. Contacts culturels intenses avec l\'Italie — prémices de la Renaissance.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Michel_VIII_Paléologue',i:2},
{y:1453,t:'CHUTE DE CONSTANTINOPLE — Fin de l\'Empire byzantin',d:'Mehmed II prend Constantinople le 29 mai 1453. Constantin XI Paléologue meurt au combat. Hagia Sophia en mosquée. Fin de l\'Empire romain d\'Orient (1 125 ans d\'existence). Les savants grecs fuient en Italie — accélèrent la Renaissance.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Prise_de_Constantinople',i:3},
// ══════════════════════════════════════════════════════════
// ISLAM — 1000–1500
// ══════════════════════════════════════════════════════════
{y:1058,t:'Al-Ghazali — Soufi contre les philosophes',d:'Al-Ghazali (1058-1111). "Incohérence des philosophes" (Tahafut al-Falasifa) critique Aristote et Avicenne. "Revivification des sciences religieuses" (Ihya). Mystique soufi. A-t-il "tué" la philosophie islamique ? Débat encore vif. Influence sur Maïmonide (qu\'il lit et critique).',tr:'islam',w:'https://fr.wikipedia.org/wiki/Al-Ghazali',i:3},
{y:1126,t:'Averroès (Ibn Rushd) — Commentateur d\'Aristote',d:'Ibn Rushd / Averroès (1126-1198), né à Cordoue. Grand commentateur d\'Aristote. "Incohérence de l\'incohérence" répond à Al-Ghazali. Traduit en latin, il transmet Aristote à l\'Europe scolastique (Thomas d\'Aquin). Influence directe sur Maïmonide.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Averroès',i:3},
{y:1187,t:'Saladin reprend Jérusalem — Hattin',d:'Saladin bat les croisés à Hattin (4 juillet 1187). Jérusalem prise le 2 octobre — sans massacre. Reconquête courtoise. Maïmonide est son médecin-chef au Caire. Saladin autorise les Juifs et chrétiens orientaux à revenir.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Saladin',i:3},
{y:1258,t:'Mongols détruisent Bagdad — Fin du Califat abbasside',d:'Hulagu Khan prend et saccage Bagdad (13-20 fév. 1258). Le calife al-Musta\'sim exécuté. Fin du Califat abbasside (750-1258). Les Mamelouks d\'Égypte arrêtent les Mongols à Aïn Djalout (1260) — tournant du monde islamique.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Siège_de_Bagdad_(1258)',i:3},
{y:1332,t:'Ibn Khaldoun — Philosophie de l\'histoire',d:'Ibn Khaldoun (1332-1406), né à Tunis. "Muqaddima" : première philosophie de l\'histoire, sociologie des civilisations. Concept d\'asabiyya (cohésion sociale). Précurseur de la sociologie moderne. Rencontre Timour Leng à Damas (1401).',tr:'islam',w:'https://fr.wikipedia.org/wiki/Ibn_Khaldoun',i:3},
{y:1453,t:'Mehmed II — Conquérant et protecteur des minorités',d:'Sultan Mehmed II "Fatih". Prend Constantinople. Installe le système de millet (autonomie des communautés non-musulmanes). Hakham Bachi des Juifs reconnu officiellement. L\'Empire ottoman = alternative humaine à l\'Inquisition.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Mehmed_II',i:3},
// ══════════════════════════════════════════════════════════
// EUROPE DE L'OUEST — 1000–1500
// ══════════════════════════════════════════════════════════
{y:1066,t:'Conquête normande de l\'Angleterre',d:'Guillaume le Conquérant bat Harold à Hastings (14 oct. 1066). Les Normands apportent des marchands juifs de Rouen. Communauté juive d\'Angleterre fondée. Période de relative protection sous Guillaume.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Conquête_normande_de_l%27Angleterre',i:3},
{y:1073,t:'Grégoire VII — Réforme grégorienne',d:'Grégoire VII (1073-1085). "Querelle des investitures" avec Henri IV d\'Allemagne. "Dictatus Papae" : suprématie papale absolue. Excommunication de Henri IV (1076). Marche de Canossa (1077). Fondement de la théocratie papale médiévale.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Grégoire_VII',i:3},
{y:1095,t:'Concile de Clermont — La Croisade prêchée',d:'Urbain II prêche la 1ère Croisade (27 nov. 1095). "dieu le veut !" Les premières victimes : les Juifs de Rhénanie. La Croisade transforme l\'Europe : naissance d\'une identité chrétienne militante.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Concile_de_Clermont',i:3},
{y:1147,t:'Bernard de Clairvaux — Mystique et croisé',d:'Bernard de Clairvaux (1090-1153). Mystique cistercien. Prêche la 2e Croisade. Intervient pour protéger les Juifs contre les massacres (lettre aux Francs : "les Juifs sont vivants pour nous rappeler la Passion"). Fondateur de l\'ordre cistercien.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Bernard_de_Clairvaux',i:3},
{y:1209,t:'Croisade des Albigeois — Inquisition médiévale',d:'Innocent III lance la croisade contre les Cathares du Sud de la France. "Tuez-les tous, dieu reconnaîtra les siens" (attribué à Arnaud Amaury). Fondation de l\'Inquisition médiévale. Les Juifs de Provence touchés.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Croisade_des_albigeois',i:3},
{y:1215,t:'Magna Carta — Fondement du droit constitutionnel',d:'Jean sans Terre signe la Grande Charte (15 juin 1215). Limite le pouvoir royal. Habeas corpus en germe. Les Juifs exclus des protections spécifiques. Fondement du constitutionnalisme anglais.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Magna_Carta',i:3},
{y:1225,t:'Thomas d\'Aquin — Synthèse chrétienne',d:'Thomas d\'Aquin (1225-1274). "Somme Théologique." Synthèse entre christianisme et aristotélisme (via Averroès et Maïmonide). "Cinq preuves de l\'existence de D." Fondateur de la scolastique. Sa théologie du "témoin" juif hérite d\'Augustin.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Thomas_d%27Aquin',i:3},
{y:1265,t:'Dante Alighieri — La Divine Comédie',d:'Dante Alighieri (1265-1321). La Comédie divine : Enfer, Purgatoire, Paradis. Somme de la culture chrétienne médiévale. Fonde la langue italienne. Certains commentateurs ont identifié des influences juives (kabbale, Maïmonide) dans sa cosmologie.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Dante_Alighieri',i:3},
{y:1309,t:'Papauté en Avignon — "Captivité babylonienne"',d:'Clément V transfère la papauté à Avignon (1309-1377). 7 papes français. Crise du prestige pontifical. Les Juifs de Provence sous autorité papale directe — parfois protégés (Clément VI condamne les massacres de 1349).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Papauté_d%27Avignon',i:3},
{y:1337,t:'Guerre de Cent Ans — France et Angleterre',d:'La Guerre de Cent Ans (1337-1453). Édouard III revendique le trône de France. Crécy (1346), Azincourt (1415), Jeanne d\'Arc (1429-1431). La France restructurée — sans Juifs (expulsés en 1394).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Guerre_de_Cent_Ans',i:3},
{y:1348,t:'Peste Noire — Bouleversement de l\'Europe médiévale',d:'La Peste Noire (1347-1351) tue 30-50% des Européens. Flagellants. Crise de la foi et de l\'ordre social. Fin du servage en Angleterre. La société médiévale est irrémédiablement ébranlée.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Peste_noire',i:3},
{y:1378,t:'Grand Schisme d\'Occident — Deux puis trois papes',d:'1378-1417 : deux papes rivaux (Rome et Avignon). Crise profonde. Conciliarisme. Jean Hus brûlé au Concile de Constance (1415). Concile de Constance clôt le schisme. La Réforme est en gestation.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Grand_Schisme_d%27Occident',i:3},
{y:1415,t:'Jan Hus brûlé — Préfigure la Réforme',d:'Jan Hus, théologien tchèque, condamné et brûlé vif (6 juillet 1415). Le hussitisme préfigure Luther. Guerres hussites en Bohême (1419-1434). La chrétienté occidentale se fissure. Les Juifs de Bohême observent inquiets.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Jan_Hus',i:3},
{y:1450,t:'Gutenberg — Imprimerie à caractères mobiles',d:'Johannes Gutenberg met au point l\'imprimerie (~1450). Bible de Gutenberg (1455). Révolution de l\'information. Impact sur le judaïsme : livres hébraïques imprimés à Rome (1469), en Espagne (1476). La Torah imprimée change le rapport aux textes.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Johannes_Gutenberg',i:3},
{y:1492,t:'Christophe Colomb — Découverte des Amériques',d:'Colomb part le 3 août 1492 — lendemain de l\'expulsion des Juifs d\'Espagne. Débarque à San Salvador le 12 octobre. Son interprète Luis de Torres (converso) serait le premier Européen à poser pied sur le sol américain. Nouveau Monde = futur refuge des Séfarades.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Christophe_Colomb',i:3},
// ══════════════════════════════════════════════════════════
// EUROPE DE L'EST — 1000–1500
// ══════════════════════════════════════════════════════════
{y:1025,t:'Basile II "Bulgaroctone" — Apogée byzantin',d:'Basile II (976-1025) écrase les Bulgares à Kleidion (1014). "Bulgaroctone." Byzance à son apogée territorial médiéval. Contacts avec les communautés juives de Grèce et de Thessalonique.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Basile_II_(empereur_byzantin)',i:2},
{y:1096,t:'Croisades — Juifs fuient vers la Pologne',d:'Les massacres de Rhénanie (1096) poussent des Juifs vers l\'est : Bohême, Pologne. Le roi Boleslas III les protège. La Pologne commence à devenir une terre de refuge relative pour les Juifs d\'Allemagne.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Massacre_de_Juifs_lors_de_la_première_croisade',i:2},
{y:1240,t:'Mongols dévastent la Russie et la Pologne',d:'Batu Khan et Subutai dévastent la Russie (Kiev brûlée 1240), envahissent la Pologne (Legnica 1241) et la Hongrie (Mohi 1241). Retrait subit à la mort d\'Ögedei. Les communautés juives souffrent comme les chrétiennes.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Invasion_mongole_de_la_Pologne',i:3},
{y:1264,t:'Casimir III de Pologne — Protecteur des Juifs',d:'Casimir III "le Grand" (1333-1370) confirme et élargit la Charte de Kalisz (1264). La Pologne = principale terre d\'accueil des Juifs d\'Europe. "Po-Lin" (hébreu : ici tu te reposeras). Cracovie, Lwow, Poznan : communautés florissantes.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Casimir_III_de_Pologne',i:3},
{y:1380,t:'Dmitri Donskoï — Russie défie les Mongols',d:'Dmitri Donskoï bat les Mongols à Koulikovo (1380). Première grande victoire russe sur les Tatars. Début de la libération de la Russie. La Moscovie s\'affirme comme puissance régionale.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Dmitri_Donskoï',i:2},
{y:1386,t:'Union polono-lituanienne — Jagellon',d:'Ladislas II Jagellon (grand-duc de Lituanie) épouse Hedwige de Pologne (1386). Se convertit au catholicisme. Grand Empire polono-lituanien accueillant. Les Juifs de Lituanie bénéficient d\'une relative protection.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Ladislas_II_Jagellon',i:2},
{y:1410,t:'Bataille de Grunwald — Fin de la menace teutonique',d:'Bataille de Grunwald / Tannenberg (15 juillet 1410). La Pologne-Lituanie écrase l\'Ordre Teutonique. Fin de la menace teutonique à l\'Est. Les Juifs de Pologne-Lituanie en bénéficient indirectement.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Bataille_de_Grunwald',i:2},
{y:1480,t:'Ivan III — Russie libérée du joug mongol',d:'Ivan III "le Grand" (1462-1505) unifie Moscou et met fin au joug mongol (1480). "Tsar de toutes les Russies." Moscou = "Troisième Rome." Les "judaïsants" (hérétiques inspirés du judaïsme) persécutés sous son règne.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Ivan_III_de_Russie',i:2},
// ══════════════════════════════════════════════════════════
// LEVANT & PROCHE-ORIENT (levant) — 1000–1500
// ══════════════════════════════════════════════════════════
{y:1009,t:'Al-Hakim détruit le Saint-Sépulcre',d:'Le calife fatimide Al-Hakim bi-Amr Allah ordonne la destruction du Saint-Sépulcre (1009) et persécute chrétiens et juifs. Cet acte devient un des facteurs déclenchants des Croisades 87 ans plus tard.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Al-Hakim_bi-Amr_Allah',i:2},
{y:1099,t:'Croisés prennent Jérusalem — Massacre général',d:'Les croisés prennent Jérusalem le 15 juillet 1099. Massacre de la population musulmane et juive. Les Juifs réfugiés dans leur synagogue brûlés vifs. Godefroy de Bouillon refuse le titre de roi. Fondation du Royaume de Jérusalem.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Siège_de_Jérusalem_(1099)',i:3},
{y:1187,t:'Saladin reprend Jérusalem — Bataille de Hattin',d:'Saladin écrase les croisés à Hattin (juillet 1187). Jérusalem capitule le 2 octobre sans massacre. Saladin autorise les Juifs et les chrétiens orientaux à revenir. Maïmonide, son médecin au Caire, salue la nouvelle.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_de_Hattin',i:3},
{y:1229,t:'Frédéric II négocie Jérusalem — Croisade diplomatique',d:'Frédéric II, excommunié, négocie directement avec le sultan Al-Kamil. Traité de Jaffa : Jérusalem rendue aux chrétiens pour 10 ans avec accès aux lieux saints musulmans. Scandale dans les deux camps.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Sixième_croisade',i:2},
{y:1244,t:'Jérusalem reprise par les Khouarzémiens',d:'Des mercenaires khouarzémiens (Turco-Mongols) s\'emparent de Jérusalem (1244). Fin définitive de la présence croisée dans la ville. Déclin accéléré du Royaume de Jérusalem.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_de_La_Forbie',i:2},
{y:1291,t:'Chute d\'Acre — Fin des États croisés',d:'Le sultan mamelouk Khalil prend Acre (18 mai 1291). Les croisés s\'embarquent. Fin de 200 ans de présence croisée en Terre Sainte. La Palestine entièrement sous contrôle mamelouk.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Siège_d%27Acre_(1291)',i:3},
{y:1400,t:'Timour Leng ravage Damas',d:'Timour (Tamerlan) prend et pille Damas (1400-1401). La cité dévastée, ses artisans déportés à Samarcande. Ibn Khaldoun rencontre Timour et en fait une description saisissante. L\'Empire mamelouk est ébranlé.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Timour',i:3},
{y:1492,t:'Séfarades arrivent en Palestine — Safed renaît',d:'Après l\'expulsion d\'Espagne, des dizaines de milliers de Séfarades arrivent au Levant ottoman. Safed devient le centre mondial de la Kabbale. Jérusalem retrouve une communauté juive significative.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_d%27Espagne',i:3},
{y:1516,t:'Sélim Ier conquiert la Syrie et la Palestine',d:'Le sultan ottoman Sélim Ier bat les Mamelouks à Marj Dabiq (1516). Damas, Jérusalem et toute la Palestine ottomane. Les Juifs passent sous la millet ottomane, relativement protectrice.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Sélim_Ier',i:3},
{y:1520,t:'Soliman le Magnifique reconstruit Jérusalem',d:'Soliman Ier (1520-1566) fait reconstruire les murailles de Jérusalem (1537-1541), toujours debout. Gouvernance ottomane stable. Les communautés juive, chrétienne et musulmane coexistent sous le millet.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Soliman_le_Magnifique',i:3},
{y:1561,t:'Joseph Nassi — Projet de Tibériade juive',d:'Joseph Nassi, duc de Naxos (favori de Sélim II), reçoit en concession Tibériade et ses environs (1561). Tente d\'y établir une colonie juive et une manufacture de laine. Projet partiellement réalisé, pionnier du proto-sionisme.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Joseph_Nassi',i:2},
{y:1660,t:'Druzes, Maronites et Juifs au Levant',d:'Le Levant ottoman du XVIIe s. mêle Druzes (Liban, Chouf), Maronites, Grecs orthodoxes, Juifs, Sunnites, Chiites. Les Fakhr-al-Din II (Druze, 1572-1635) correspondent avec les Médicis. Tissu communautaire complexe.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Fakhr-al-Din_II',i:1},
{y:1799,t:'Bonaparte assiège Acre — Les Juifs entre deux empires',d:'Bonaparte assiège Saint-Jean d\'Acre (mars-mai 1799). Echec face à Djezzar Pacha (soutenu par la flotte anglaise). Retrait français. Bonaparte aurait proclamé un État juif en Palestine — promesse jamais tenue.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Siège_de_Saint-Jean-d%27Acre_(1799)',i:2},
{y:1840,t:'Muhammad Ali d\'Égypte et la Palestine',d:'Muhammad Ali d\'Égypte occupe la Palestine et la Syrie (1831-1840). Les notables juifs locaux (famille Farhi) jouent un rôle politique. L\'Europe intervient (Affaire de Damas, 1840). La Palestine redevient ottomane.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Muhammad_Ali_d%27Égypte',i:2},
{y:1880,t:'Premières Aliyot — Immigration juive en Palestine ottomane',d:'La Première Aliya (1882-1903) : ~25 000 Juifs, surtout russes. Fondation de Rishon LeZion, Zikhron Yaakov, Rosh Pina. Edmond de Rothschild finance. Les fellahin arabes observent l\'arrivée des nouveaux colons.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Première_Aliyah',i:3},
// ══════════════════════════════════════════════════════════
// MÉSOPOTAMIE & PERSE (persia2) — 1000–1900
// ══════════════════════════════════════════════════════════
{y:1055,t:'Seldjoukides prennent Bagdad — Renaissance sunnite',d:'Le sultan seldjoukide Toghrul entre à Bagdad (1055) et libère le calife abbasside de la tutelle chiite bouyide. Renaissance du sunnisme. Avicenne (mort 1037), Al-Ghazali (1058-1111). Les communautés juives d\'Irak sous nouvelle administration.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Toghrul',i:3},
{y:1090,t:'Hassan-i Sabbah — Les Assassins d\'Alamout',d:'Hassan-i Sabbah fonde la secte nizarite ismaïlienne dans la forteresse d\'Alamout (Iran). Les "Assassins" (Hashshashin) terrorisent croisés et sunnites pendant 150 ans. Détruits par Hulagu Khan en 1256.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Hassan-i_Sabbah',i:2},
{y:1048,t:'Omar Khayyam — Rubaiyat et mathématiques',d:'Omar Khayyam (1048-1131) : poète (Rubaiyat), astronome, mathématicien (algèbre). Son calendrier jalali (1079) est plus précis que le grégorien. Ses vers sur la fugacité de la vie influencent la poésie mondiale. Né à Nishapur.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Omar_Khayyâm',i:3},
{y:1206,t:'Gengis Khan — La terreur mongole en marche',d:'Temüjin proclamé Gengis Khan (1206). Conquêtes de la Chine, puis expansion vers la Perse. Destruction de Khwarezm (1219-1221) : Boukhara, Samarcande, Nishapur rasées. Des millions de morts. Le monde islamique oriental est anéanti.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Gengis_Khan',i:3},
{y:1258,t:'Hulagu Khan détruit Bagdad — Fin du Califat',d:'Hulagu Khan assiège et saccage Bagdad (13-20 fév. 1258). Le calife Al-Musta\'sim exécuté. Des centaines de milliers de morts. Le Tigre rouge de sang selon les chroniqueurs. Fin du Califat abbasside (750-1258). Les Juifs de Mésopotamie décimés.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Siège_de_Bagdad_(1258)',i:3},
{y:1295,t:'Ghazan — Ilkhanat islamisé',d:'Ghazan, khan ilkhanide, se convertit à l\'Islam (1295). La Perse mongole adopte l\'Islam. Renaissance culturelle : Rachid al-Din rédige la Jami\' al-Tawarikh (histoire mondiale illustrée). Les Juifs de Perse sous double administration mongolo-islamique.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Ghazan',i:2},
{y:1370,t:'Timour Leng — Empire de Samarcande',d:'Timour (Tamerlan, 1336-1405) conquiert l\'Asie centrale, la Perse, l\'Inde (Delhi 1398), bat les Ottomans (Ankara 1402). Sa cour à Samarcande = grand centre culturel timuride. Ibn Khaldoun le rencontre à Damas. Mort en route pour la Chine.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Timour',i:3},
{y:1501,t:'Chah Ismaïl I — Safavides et chiisme d\'État',d:'Ismaïl Ier fonde la dynastie safavide et impose le chiisme duodécimain comme religion d\'État iranien. Rupture géopolitique majeure avec l\'Empire ottoman sunnite. Les Juifs de Perse sous nouveau régime — alternance de tolérance et persécution.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Ismaïl_Ier',i:3},
{y:1587,t:'Abbas Ier le Grand — Apogée safavide',d:'Chah Abbas Ier (1587-1629). Capitale : Isfahan "moitié du monde". Grandes mosquées, ponts, bazars. Allie Arméniens et Juifs dans le commerce de la soie. Mais impose parfois des conversions forcées. Le poète juif Babai ibn Lutf décrit les souffrances de sa communauté.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Abbas_Ier_le_Grand',i:3},
{y:1722,t:'Chute des Safavides — Afghans et chaos',d:'Les Afghans ghilzais (Mir Mahmoud) prennent Isfahan (1722). Les Safavides s\'effondrent. Période de chaos. Nader Shah reconquiert la Perse (1736-1747). Les Juifs souffrent des guerres successives mais maintiennent leurs communautés.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Nader_Chah',i:2},
{y:1796,t:'Qadjars — Persécutions des Juifs de Perse',d:'La dynastique qajare (1796-1925) maintient la discrimination des Juifs (najis = impurs selon le droit chiite). Grands persécutions à Tabriz, Hamadan. Massacre de Mashhad (1839) : toute la communauté juive forcée de se convertir (Jedid al-Islam).',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Jedid_al-Islam',i:3},
{y:1839,t:'Massacre de Mashhad — Conversions forcées',d:'En 1839, lors de la fête de l\'Achoura, la communauté juive de Mashhad (Iran) est attaquée. Plusieurs dizaines de tués. Le reste forcé de se convertir à l\'Islam. Les "Jedid al-Islam" (Nouveaux Musulmans) maintiennent un judaïsme secret pendant des générations.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Jedid_al-Islam',i:3},
{y:1860,t:'Alliance Israélite Universelle en Perse',d:'L\'AIU ouvre des écoles en Iran (Téhéran, 1898). Modernisation des Juifs iraniens : français, sciences. La communauté juive d\'Iran compte ~35 000 personnes à la fin du XIXe s., concentrées à Téhéran, Isfahan, Chiraz, Tabriz.',tr:'persia2',w:'https://fr.wikipedia.org/wiki/Alliance_israélite_universelle',i:1},
// ══════════════════════════════════════════════════════════
// ÉGYPTE (egypt) — 1000–1900
// ══════════════════════════════════════════════════════════
{y:1009,t:'Al-Hakim — Calife fou du Caire',d:'Al-Hakim bi-Amr Allah (996-1021), calife fatimide, alterne illuminations et cruautés. Détruit le Saint-Sépulcre (1009), interdit le vin, les femmes de sortir. Divinisé par les Druzes. Son règne déstabilise la Palestine et le Caire.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Al-Hakim_bi-Amr_Allah',i:2},
{y:1025,t:'Geniza du Caire — Trésor documentaire',d:'La Geniza (dépôt de textes usagés) de la synagogue Ben Ezra du Vieux-Caire accumule depuis le IXe s. des centaines de milliers de documents : lettres commerciales, textes religieux, actes juridiques. Découverts par Solomon Schechter (1896). Fenêtre unique sur la vie juive médiévale.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Geniza_du_Caire',i:3},
{y:1171,t:'Saladin met fin au califat fatimide chiite',d:'Saladin (Salah al-Din Yusuf) met fin à la dynasti fatimide chiite (1171). L\'Égypte revient au sunnisme. Saladin fonde la dynasti ayyoubide. Maïmonide, réfugié à Fustat depuis 1165, devient son médecin personnel.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Saladin',i:3},
{y:1204,t:'Maïmonide — Mort au Caire',d:'Maïmonide (1138-1204) meurt à Fustat (Vieux-Caire). Médecin de la cour, Naguid de la communauté juive d\'Égypte. Son Mishneh Torah et son Guide des Égarés définissent le judaïsme rationnel médiéval. Son corps transporté à Tibériade.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Maïmonide',i:3},
{y:1250,t:'Mamelouks — Sultans-esclaves d\'Égypte',d:'Les Mamelouks renversent les Ayyoubides (1250) et arrêtent les Mongols à Aïn Djalout (1260). Sultanat mamelouk (1250-1517). Constructions extraordinaires au Caire. Les Juifs = dhimmis avec variations selon les sultans.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Sultanat_mamelouk',i:3},
{y:1347,t:'Peste Noire dévaste l\'Égypte',d:'La Peste Noire arrive à Alexandrie (1347). Tue 30-40% de la population égyptienne. Crise économique profonde du sultanat mamelouk. Les communautés juives et coptes touchées comme les musulmans.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Peste_noire',i:3},
{y:1517,t:'Sélim Ier conquiert l\'Égypte',d:'Le sultan ottoman Sélim Ier bat les Mamelouks à Raydaniyya (1517). Le dernier sultan mamelouk pendu. L\'Égypte province ottomane. Les Juifs passent sous la millet ottomane. La Geniza continue à s\'enrichir.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Sélim_Ier',i:3},
{y:1798,t:'Expédition Bonaparte en Égypte',d:'Bonaparte conquiert l\'Égypte (1798-1801). Victoire aux Pyramides. Nelson coule la flotte française à Aboukir. La Commission des sciences et arts documente l\'Égypte ancienne (Description de l\'Égypte). Pierre de Rosette découverte. Réveil culturel arabe.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Campagne_d%27Égypte',i:3},
{y:1805,t:'Muhammad Ali — Modernisation de l\'Égypte',d:'Muhammad Ali (1805-1848), officier albanais, prend le pouvoir en Égypte. Modernise l\'armée, l\'éducation, l\'agriculture. Massacre les Mamelouks (1811). Conquiert la Syrie et la Palestine (1831-1840). Son règne est le début de l\'Égypte moderne.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Muhammad_Ali_d%27Égypte',i:3},
{y:1869,t:'Canal de Suez — Inauguration',d:'Le canal de Suez inauguré le 17 novembre 1869 sous Ismaïl Pacha. Long de 193 km. Révolutionne le commerce mondial. Ferdinand de Lesseps. Les Juifs d\'Égypte (dont beaucoup de Séfarades et de Karaïtes) participent au boom économique.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Canal_de_Suez',i:3},
{y:1882,t:'Occupation britannique de l\'Égypte',d:'La Grande-Bretagne occupe l\'Égypte (1882, suite à la révolte Urabi). Début du protectorat britannique. L\'Égypte reste nominalement ottomane jusqu\'en 1914. Les Juifs d\'Alexandrie (communauté cosmopolite) prospèrent sous protection britannique.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Occupation_britannique_de_l%27Égypte',i:3},
// ══════════════════════════════════════════════════════════
// JUDAÏSME GÉNÉRAL (j_main) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1516,t:'Ghetto de Venise — Premier de l\'Histoire',d:'Le Sénat de Venise crée le premier ghetto obligatoire (1516) sur l\'île du Ghetto Nuovo. Enfermement nocturne, signe distinctif. Mais aussi : grande activité intellectuelle. Daniel Bomberg imprime le Talmud complet à Venise (1519-1523), pagination encore utilisée aujourd\'hui.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Ghetto_de_Venise',i:3},
{y:1534,t:'Rabbi Joseph Caro commence le Beit Yossef',d:'Joseph Caro (1488-1575), réfugié séfarade installé à Safed, commence son Beit Yossef (1534). Commentaire exhaustif des codes de loi. Suivi du Shulhan Aroukh (1563). Nouveau centre du judaïsme mondial : Safed en Galilée.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Joseph_Caro',i:3},
{y:1553,t:'Brûlement du Talmud à Rome — Inquisition',d:'Le pape Jules III ordonne la saisie et le brûlement du Talmud à Rome (9 sept. 1553, Rosh Hashana). Répété dans toute l\'Italie. Tentative d\'anéantissement de la littérature rabbinique. La censure du Talmud durera deux siècles.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Brûlement_du_Talmud_à_Rome_(1553)',i:3},
{y:1563,t:'SHULHAN AROUKH — Code de loi universel',d:'Joseph Caro publie le Shulhan Aroukh ("Table Mise", Venise, 1563). Code halakhique synthétisant les traditions séfarades. Rabbi Moïse Isserles y ajoute la Mappah (nappe) pour les coutumes ashkénazes (1569). Devient le code normatif de référence mondial.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Choulhan_Aroukh',i:3},
{y:1648,t:'Massacres de Khmelnitski — Catastrophe des Juifs d\'Ukraine',d:'Bogdan Khmelnitski, hetman cosaque, se révolte contre la Pologne-Lituanie (1648-1649). Les Juifs — perçus comme agents des nobles polonais — massacrés en masse. 100 000 à 500 000 morts selon les estimations. Communautés d\'Ukraine dévastées. Choc comparable à la destruction du Temple.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massacres_de_Khmelnitski',i:3},
{y:1655,t:'Retour des Juifs en Angleterre — Cromwell',d:'Menasseh ben Israel plaide pour le retour des Juifs (bannis depuis 1290) devant Cromwell. Conférence de Whitehall (1655). Autorisation officieuse. Le retour formel sous Charles II (1664). Communauté séfarade de Londres se développe.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Menasseh_ben_Israel',i:2},
{y:1665,t:'SABBATAÏ TSEVI — Le Grand Faux Messie',d:'Sabbataï Tsevi (1626-1676), de Smyrne, proclamé Messie par Nathan de Gaza (1665). Hystérie messianique mondiale. Juifs d\'Europe, d\'Afrique du Nord, du Levant vendent leurs biens pour rejoindre la Terre Sainte. Arrêté par les Ottomans, se convertit à l\'Islam (1666). Traumatisme majeur du judaïsme.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Sabbataï_Tsevi',i:3},
{y:1700,t:'BAAL SHEM TOV — Naissance du Hassidisme',d:'Israël ben Eliezer, dit "Baal Shem Tov" (BeSHT, 1698-1760), né en Podolie. D. présent partout. Prière avec joie et ferveur (devekout). Histoires (sipourim). Le tsaddik comme guide spirituel. Révolution pour les masses juives d\'Europe de l\'Est.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Baal_Shem_Tov',i:3},
{y:1729,t:'Moïse Mendelssohn — Père de l\'Haskalah',d:'Moses Mendelssohn (1729-1786), "Socrate juif". Traduit la Bible en allemand (Biur). Jerusalem (1783) : séparation Église-État. Ami de Lessing (Nathan le Sage inspiré de lui). Ouvre la voie à l\'émancipation et aussi à l\'assimilation.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Moses_Mendelssohn',i:3},
{y:1791,t:'ÉMANCIPATION des Juifs de France',d:'L\'Assemblée nationale accorde la citoyenneté française aux Juifs (27 sept. 1791). Première émancipation légale complète en Europe. Napoléon étendra ce modèle. Rupture fondamentale : le Juif devient citoyen à part entière.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Émancipation_des_Juifs_de_France',i:3},
{y:1807,t:'Grand Sanhédrin de Napoléon',d:'Napoléon convoque le Grand Sanhédrin (1807). Les représentants juifs déclarent leur loyauté à la France. Napoléon reconnaît le judaïsme comme religion officielle. Modèle du Consistoire central. Question fondatrice : peut-on être juif et citoyen français ?',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Grand_Sanhédrin',i:3},
