{y:1903,t:'Affaire Dreyfus — Fin',d:'L\'Affaire Dreyfus (1894-1906) : capitaine Dreyfus innocenté et réhabilité en 1906. Impact sur Herzl et le sionisme. La France divisée. Victoire des Républicains laïcs. Naissance de l\'antisémitisme moderne politique.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Affaire_Dreyfus',i:3},
{y:1913,t:'Anti-Defamation League — ADL fondée',d:'L\'ADL (Anti-Defamation League) fondée à Chicago (1913) après le lynchage de Leo Frank, un Juif américain accusé à tort. Organisation de défense des droits civils juifs aux USA.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Anti-Defamation_League',i:2},
{y:1924,t:'Loi d\'immigration américaine — Fermeture des portes',d:'Immigration Act de 1924 : quotas sévères bloquant l\'immigration juive d\'Europe de l\'Est. Ferme les portes de l\'Amérique juste avant la montée du nazisme. Tragédie pour des millions de Juifs.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Immigration_Act_of_1924',i:3},
{y:1939,t:'Conférence d\'Évian — Abandon des Juifs',d:'Conférence d\'Évian (juillet 1938) : 32 nations refusent d\'accueillir les Juifs fuyant le nazisme. Seule la République Dominicaine (Trujillo) accepte. Honte internationale. Le monde abandonne les Juifs.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Conférence_d%27Évian',i:3},
{y:1945,t:'USA et la Shoah — Connaissance et inaction',d:'Les USA connaissaient l\'existence des camps dès 1942. Refus de bombarder les voies ferrées menant à Auschwitz (1944). Débat historique. La presse juive américaine alertait, peu écouté.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Conférence_de_Bermudes',i:2},
{y:1948,t:'USA reconnaissent Israël — 11 minutes',d:'Harry Truman reconnaît l\'État d\'Israël 11 minutes après sa proclamation (14 mai 1948). Contre l\'avis du Département d\'État. Influence de son conseiller juif Eddie Jacobson. Alliance stratégique fondatrice.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Relations_israélo-américaines',i:3},
{y:1967,t:'Guerre des Six Jours — Impact sur Diaspora',d:'La Guerre des Six Jours (1967) provoque un réveil identitaire massif chez les Juifs de la Diaspora. Peur de la destruction, puis fierté. Réaffiliation juive. Croissance des organisations sionistes.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Guerre_des_Six_Jours',i:2},
{y:1975,t:'Résolution sionisme = racisme — ONU',d:'L\'Assemblée générale de l\'ONU adopte la résolution 3379 (10 nov. 1975) : le sionisme est une forme de racisme. Choc mondial. Ambassadeur américain Moynihan : "La honte sera à vous." Révoquée en 1991.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Résolution_3379',i:3},
{y:1978,t:'Camp David — Carter, Sadate, Begin',d:'Accords de Camp David (sept. 1978) négociés par Jimmy Carter. Cadre de paix entre Israël et Égypte. Begin et Sadate Prix Nobel. Traité de paix signé en 1979. Premier accord israélo-arabe.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Accords_de_Camp_David',i:3},
{y:1993,t:'Oslo — Clinton, Rabin, Arafat',d:'Bill Clinton préside la poignée de mains Rabin-Arafat (13 sept. 1993). Accords d\'Oslo. Espoir de paix. Suivi par Taba et les négociations de Camp David II (2000) — échec.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Accords_d%27Oslo',i:3},
{y:2003,t:'Néoconservateurs et Guerre d\'Irak',d:'Les néoconservateurs américains (dont beaucoup de Juifs : Wolfowitz, Perle) promeuvent l\'invasion de l\'Irak. Accusés par certains de faire la guerre pour Israël. Débat sur la loyauté double. Catastrophe géopolitique.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Néoconservatisme',i:2},
{y:2017,t:'Trump reconnaît Jérusalem capitale d\'Israël',d:'Donald Trump reconnaît Jérusalem comme capitale d\'Israël (décembre 2017). Ambassade américaine transférée (mai 2018). Rupture avec la politique américaine depuis 1948. Réactions arabes limitées.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Reconnaissance_de_Jérusalem_comme_capitale_d%27Israël_par_les_États-Unis',i:3},
{y:2020,t:'Accords Abraham — Médiation Trump',d:'Les Accords Abraham (août-sept. 2020) normalisent les relations Israël-EAU, Bahreïn, Soudan, Maroc. Médiation Trump. Changement du paradigme géopolitique : l\'Iran, ennemi commun, réunit Israël et pays du Golfe.',tr:'usa_mod',w:'https://fr.wikipedia.org/wiki/Accords_Abraham',i:3},

{y:1919,t:'Traités de Paris — Minorités juives protégées',d:'Les traités de paix de 1919-1920 contiennent des clauses de protection des minorités juives en Europe de l\'Est. Peu appliquées. La SDN peu efficace dans leur défense.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Traités_de_paix_de_Paris_(1919-1920)',i:2},
{y:1922,t:'Mandat de la SDN sur la Palestine',d:'La SDN confie le Mandat sur la Palestine à la Grande-Bretagne (1922). Le texte incorpore la Déclaration Balfour. Obligation de faciliter l\'établissement d\'un foyer national juif.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Mandat_britannique_en_Palestine',i:3},
{y:1945,t:'Création de l\'ONU',d:'Fondation de l\'Organisation des Nations Unies (1945). La question juive/palestinienne sera au cœur des débats. L\'ONU joue un rôle crucial dans la création d\'Israël (1947-1948) et les guerres suivantes.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Organisation_des_Nations_unies',i:3},
{y:1948,t:'Déclaration Universelle des Droits de l\'Homme',d:'La DUDH adoptée par l\'ONU (10 déc. 1948), trois ans après la Shoah. René Cassin (juriste juif français) en est le co-rédacteur principal. Prix Nobel de la Paix 1968. Fondement du droit international.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Déclaration_universelle_des_droits_de_l%27homme',i:3},
{y:1965,t:'Nostra Aetate — Vatican et les Juifs',d:'Le Concile Vatican II publie Nostra Aetate (28 oct. 1965). Le Vatican reconnaît que les Juifs collectivement ne sont pas responsables de la mort de Jésus. Révolution dans les relations judéo-chrétiennes. Jean-Paul II à Yad Vashem (2000).',tr:'intl',w:'https://fr.wikipedia.org/wiki/Nostra_aetate',i:3},
{y:1975,t:'Résolution 3379 — Sionisme = racisme',d:'Résolution 3379 de l\'ONU (1975) : le sionisme est une forme de racisme. Portée par le bloc arabe et soviétique. Choc pour Israël et la Diaspora. Révoquée en 1991 par la résolution 46/86.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Résolution_3379',i:2},
{y:1979,t:'Traité de paix israélo-égyptien',d:'Premier traité de paix entre Israël et un État arabe. Signé à Washington (26 mars 1979). Sadate et Begin. Retour du Sinaï à l\'Égypte. Sadate assassiné par des islamistes en 1981.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Traité_de_paix_israélo-égyptien',i:3},
{y:1993,t:'Reconnaissance mutuelle OLP-Israël',d:'L\'OLP reconnaît Israël (9 sept. 1993). Israël reconnaît l\'OLP. Lettres de Rabin et Arafat. Fondement des Accords d\'Oslo. Début du processus de paix — puis assassinat de Rabin et deuxième Intifada.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Reconnaissance_d%27Israël_par_l%27OLP',i:3},
{y:2002,t:'Initiative de Paix arabe',d:'Initiative de Paix arabe (Ligue arabe, mars 2002) : normalisation avec Israël en échange d\'un retrait aux frontières de 1967 et solution juste pour les réfugiés. Israël refuse. Plan toujours sur la table.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Initiative_de_paix_arabe',i:2},
{y:2016,t:'Résolution 2334 — Colonies illégales',d:'Résolution 2334 du Conseil de Sécurité (2016) : déclare les colonies israéliennes en Cisjordanie illégales au regard du droit international. USA s\'abstiennent sous Obama. Israël furieux.',tr:'intl',w:'https://fr.wikipedia.org/wiki/Résolution_2334_du_Conseil_de_sécurité_des_Nations_unies',i:2},

// ════════════════════════════════════════════════════════
// ÉTAT ET CONFIGURATION
// ════════════════════════════════════════════════════════
const START = -2250, END = 2025;
const SPAN  = END - START;
const BASE_PX_PER_YEAR = 1.8; // zoom ×1 → ~4250px

let zoom        = 1;
let showLabels  = true;
let showEras    = true;
let visibility  = {};
TRACKS.forEach(t => visibility[t.id] = true);

function totalWidth(){ return SPAN * BASE_PX_PER_YEAR * zoom; }
function yearToX(y)  { return ((y - START) / SPAN) * totalWidth(); }
function formatYear(y){
  if(y < 0) return `${Math.abs(y)} av. J.-C.`;
  if(y === 0) return 'An 0';
  return `${y} ap. J.-C.`;
}
function trackById(id){ return TRACKS.find(t => t.id === id); }

// ════════════════════════════════════════════════════════
// RENDU — SIDEBAR
// ════════════════════════════════════════════════════════
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  
  const groups = [
    { label:'✡ Judaïsme', ids: TRACKS.filter(t=>t.group==='j').map(t=>t.id) },
    { label:'🌍 Régions & Civilisations', ids: TRACKS.filter(t=>t.group==='r').map(t=>t.id) },
  ];
  
  groups.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'sbs';
    sec.innerHTML = `<h3>${g.label}</h3>`;
    g.ids.forEach(id => {
      const tr = trackById(id);
      const div = document.createElement('div');
      div.className = `tog${visibility[id]?' on':''}`;
      div.dataset.id = id;
      div.innerHTML = `<div class="tog-cb">${visibility[id]?'✓':''}</div>
        <div class="tog-dot" style="background:${tr.color}"></div>
        <div class="tog-name">${tr.emoji} ${tr.name}</div>`;
      div.addEventListener('click', () => {
        visibility[id] = !visibility[id];
        renderAll();
      });
      sec.appendChild(div);
    });
    sb.appendChild(sec);
  });
  
  // Legend
  const leg = document.createElement('div');
  leg.className = 'sbs sbs-legend';
  leg.innerHTML = `<h4>Importance</h4>
    <div class="leg-item"><div style="width:15px;height:15px;border-radius:50%;background:#888;border:2px solid rgba(255,255,255,.35);flex-shrink:0"></div>&nbsp;Majeur</div>
    <div class="leg-item"><div style="width:11px;height:11px;border-radius:50%;background:#888;border:1.5px solid rgba(255,255,255,.25);flex-shrink:0"></div>&nbsp;Important</div>
    <div class="leg-item"><div style="width:7px;height:7px;border-radius:50%;background:#888;border:1px solid rgba(255,255,255,.2);flex-shrink:0"></div>&nbsp;Notable</div>`;
  sb.appendChild(leg);
  
  const note = document.createElement('div');
  note.id = 'sideNote';
  note.innerHTML = `<strong style="color:var(--gold3)">Utilisation</strong><br />
    • Clic sur un événement → détails<br />
    • Zoom pour plus de précision<br />
    • Survol → info-bulle<br />
    • Recherche en haut à droite<br />
    <br /><em>Origines (~2000 AEC) → 1900 EC · 781 événements</em>`;
  sb.appendChild(note);
}

// ════════════════════════════════════════════════════════
// RENDU — RÈGLE CHRONOLOGIQUE
// ════════════════════════════════════════════════════════
function buildRuler(){
  const ruler = document.getElementById('ruler');
  const w = totalWidth();
  ruler.style.width = w + 'px';
  ruler.innerHTML = '';
  
  // Centuries
  for(let y = Math.ceil(START/100)*100; y <= END; y += 100){
    const x = yearToX(y);
    const tick = document.createElement('div');
    tick.className = 'rtick cent';
    tick.style.left = x + 'px';
    tick.innerHTML = `<div class="rline"></div><div class="rlbl">${formatYear(y)}</div>`;
    ruler.appendChild(tick);
  }
  // 50-year
  if(zoom >= 1.5){
    for(let y = Math.ceil(START/50)*50; y <= END; y += 50){
      if(y % 100 !== 0){
        const x = yearToX(y);
        const tick = document.createElement('div');
        tick.className = 'rtick half';
        tick.style.left = x + 'px';
        tick.innerHTML = `<div class="rline"></div><div class="rlbl">${formatYear(y)}</div>`;
        ruler.appendChild(tick);
      }
    }
  }
  // 10-year
  if(zoom >= 3.5){
    for(let y = Math.ceil(START/10)*10; y <= END; y += 10){
      if(y % 50 !== 0){
        const x = yearToX(y);
        const tick = document.createElement('div');
        tick.className = 'rtick dec';
        tick.style.left = x + 'px';
        tick.innerHTML = `<div class="rline"></div><div class="rlbl rlbl-decade">${formatYear(y)}</div>`;
        ruler.appendChild(tick);
      }
    }
  }
}

// ════════════════════════════════════════════════════════
// RENDU — BANDES D'ÈRES
// ════════════════════════════════════════════════════════
function buildEras(){
  const container = document.getElementById('eras');
  container.style.width = totalWidth() + 'px';
  container.innerHTML = '';
  if(!showEras) return;
  ERAS.forEach(era => {
    const x1 = yearToX(era.s), x2 = yearToX(era.e);
    const band = document.createElement('div');
    band.className = 'era-band';
    band.style.cssText = `left:${x1}px;width:${x2-x1}px;background:${era.color}`;
    container.appendChild(band);
    const lbl = document.createElement('div');
    lbl.className = 'era-lbl';
    lbl.style.left = ((x1+x2)/2) + 'px';
    lbl.textContent = era.label;
    container.appendChild(lbl);
  });
}

// ════════════════════════════════════════════════════════
// RENDU — PISTES ET ÉVÉNEMENTS
// ════════════════════════════════════════════════════════
function buildTracks(){
  const container = document.getElementById('tracks');
  container.style.width = totalWidth() + 'px';
  container.innerHTML = '';
  
  const visibleTracks = TRACKS.filter(t => visibility[t.id]);
  
  // separator between jewish/regional
  const hadJ = new Set(), hadR = new Set();
  
  visibleTracks.forEach((tr, idx) => {
    // Insert divider between jewish and regional tracks
    if(idx > 0 && tr.group === 'r' && visibleTracks[idx-1].group === 'j'){
      const div = document.createElement('div');
      div.className = 'track-divider';
      container.appendChild(div);
    }
    
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.track = tr.id;
    container.appendChild(row);
    
    // Compute staggered positions for this track
    const evs = EVENTS.filter(e => e.tr === tr.id).sort((a,b) => a.y - b.y);
    
    // Stagger logic: assign y offsets to avoid overlap
    let placed = []; // {x, row}
    
    evs.forEach(ev => {
      const x = yearToX(ev.y);
      // Determine size
      const size = ev.i === 3 ? 'large' : ev.i === 2 ? 'medium' : 'small';
      const dotSize = ev.i === 3 ? 15 : ev.i === 2 ? 11 : 7;
      const minGap = dotSize + 2;
      
      // Find row
      let row0 = 0;
      // Simple: alternate between 0 and 1 if close to previous
      if(placed.length > 0){
        const last = placed[placed.length-1];
        if(Math.abs(x - last.x) < minGap){
          row0 = 1 - last.row;
        }
      }
      placed.push({x, row: row0});
      
      // Y position within track (50px high track, center=25)
      const yBase = 25;
      const yOff  = row0 === 0 ? -5 : 5;
      const yPos  = yBase + yOff;
      
      const marker = document.createElement('div');
      marker.className = `ev s${ev.i}`;
      marker.style.cssText = `left:${x}px;top:${yPos}px;transform:translate(-50%,-50%)`;
      
      const dot = document.createElement('div');
      dot.className = 'ev-dot';
      dot.style.cssText = `width:${dotSize}px;height:${dotSize}px;background:${tr.color}`;
      marker.appendChild(dot);
      
      if(showLabels && ev.i === 3){
        const lbl = document.createElement('div');
        lbl.className = 'ev-lbl';
        lbl.textContent = ev.t.length > 22 ? ev.t.substring(0,20)+'…' : ev.t;
        lbl.style.color = tr.color;
        marker.appendChild(lbl);
      }
      
      // Interactions
      marker.addEventListener('mouseenter', e => showTooltip(ev, tr, e));
      marker.addEventListener('mouseleave', hideTooltip);
      marker.addEventListener('mousemove', moveTooltip);
      marker.addEventListener('click', () => openPanel(ev, tr));
      
      row.appendChild(marker);
    });
  });
}

// ════════════════════════════════════════════════════════
// TOOLTIP
// ════════════════════════════════════════════════════════
let _tooltipEvent = null;
function showTooltip(ev, tr, e){
  _tooltipEvent = ev;
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `<div class="tt-yr">${formatYear(ev.y)}</div>
    <div class="tt-tit">${ev.t}</div>
    <div class="tt-dsc">${ev.d.substring(0,180)}${ev.d.length>180?'…':''}</div>
    <div class="tt-hint">📖 Cliquer pour plus de détails</div>`;
  tt.style.display = 'block';
  moveTooltip(e);
}
function hideTooltip(){
  document.getElementById('tooltip').style.display = 'none';
  _tooltipEvent = null;
}
function moveTooltip(e){
  const tt = document.getElementById('tooltip');
  const x = e.clientX + 14, y = e.clientY + 14;
  const maxX = window.innerWidth - tt.offsetWidth - 10;
  const maxY = window.innerHeight - tt.offsetHeight - 10;
  tt.style.left = Math.min(x, maxX) + 'px';
  tt.style.top  = Math.min(y, maxY) + 'px';
}

// ════════════════════════════════════════════════════════
// PANEL DÉTAIL
// ════════════════════════════════════════════════════════
function openPanel(ev, tr){
  document.getElementById('panel-yr').textContent = formatYear(ev.y);
  document.getElementById('panel-tit').textContent = ev.t;
  document.getElementById('panel-track-badge').innerHTML =
    `<div class="pd-dot" style="background:${tr.color}"></div>${tr.emoji} ${tr.name}`;
  document.getElementById('panel-desc').textContent = ev.d;
  const wikiBtn = document.getElementById('panel-wiki');
  if(ev.w){
    wikiBtn.href = ev.w;
    wikiBtn.style.display = 'inline-flex';
  } else {
    wikiBtn.style.display = 'none';
  }
  document.getElementById('panel').classList.add('open');
}
document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
});

// ════════════════════════════════════════════════════════
// RECHERCHE
// ════════════════════════════════════════════════════════
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 2){ searchResults.style.display = 'none'; return; }
  const matches = EVENTS.filter(e =>
    e.t.toLowerCase().includes(q) || e.d.toLowerCase().includes(q)
  ).slice(0, 12);
  if(matches.length === 0){ searchResults.style.display = 'none'; return; }
  searchResults.innerHTML = matches.map(e => {
    const tr = trackById(e.tr);
    return `<div class="sri" data-id="${e.y}_${e.tr}">
      <div class="sri-yr">${formatYear(e.y)}</div>
      <div class="sri-title">${e.t}</div>
      <div class="sri-track" style="color:${tr.color}">${tr.emoji} ${tr.name}</div>
    </div>`;
  }).join('');
  searchResults.style.display = 'block';
  
  searchResults.querySelectorAll('.sri').forEach(el => {
    el.addEventListener('click', () => {
      const [yStr, trId] = el.dataset.id.split('_');
      const ev  = EVENTS.find(e => e.y == yStr && e.tr === trId);
      const tr  = trackById(trId);
      if(!ev) return;
      searchResults.style.display = 'none';
      searchInput.value = '';
      // Scroll to event
      const x = yearToX(ev.y);
      document.getElementById('timeArea').scrollLeft = Math.max(0, x - 400);
      // Ensure track is visible
      if(!visibility[trId]){ visibility[trId] = true; renderAll(); }
      openPanel(ev, tr);
      // Flash
      setTimeout(() => {
        const allEvs = document.querySelectorAll('.ev');
        allEvs.forEach(el2 => {
          const left = parseFloat(el2.style.left);
          const targetX = yearToX(ev.y);
          if(Math.abs(left - targetX) < 5 && el2.closest('.track-row').dataset.track === trId){
            el2.style.transition = 'transform .05s';
            el2.style.transform = 'translate(-50%,-50%) scale(2.5)';
            setTimeout(() => { el2.style.transform = 'translate(-50%,-50%) scale(1)'; }, 300);
          }
        });
      }, 100);
    });
  });
});

document.addEventListener('click', e => {
  if(!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
});

// ════════════════════════════════════════════════════════
// ZOOM
// ════════════════════════════════════════════════════════
document.getElementById('zoomRange').addEventListener('input', function(){
  zoom = parseFloat(this.value);
  document.getElementById('zoomVal').textContent = `×${zoom.toFixed(zoom%1===0?0:2)}`;
  renderAll();
});

// ════════════════════════════════════════════════════════
// BOUTONS
// ════════════════════════════════════════════════════════
document.getElementById('btnLabels').addEventListener('click', function(){
  showLabels = !showLabels;
  this.classList.toggle('active', showLabels);
  buildTracks();
});
document.getElementById('btnEras').addEventListener('click', function(){
  showEras = !showEras;
  this.classList.toggle('active', showEras);
  buildEras();
});
document.getElementById('btnLabels').classList.add('active');
document.getElementById('btnEras').classList.add('active');

// ════════════════════════════════════════════════════════
// RENDU PRINCIPAL
// ════════════════════════════════════════════════════════
function renderAll(){
  const w = totalWidth();
  document.getElementById('canvas').style.width = w + 'px';
  buildRuler();
  buildEras();
  buildTracks();
  buildSidebar();
}
