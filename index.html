<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✡ Chronologie de l'Histoire Juive — Des origines à nos jours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050f;
  --bg2:#0a0a1e;
  --bg3:#0f0f28;
  --bg4:#141430;
  --border:#1a1a38;
  --border2:#252550;
  --text:#c2c6e0;
  --dim:#585870;
  --dim2:#787898;
  --gold:#d4af37;
  --gold2:#f0c848;
  --gold3:#b8962a;
  --accent:#e8963a;
  --blue:#4a88d8;
  --green:#48c8a0;
  --purple:#a860e8;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Source Sans 3',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;
  font-size:14px;
}

/* ══ HEADER ══════════════════════════════════════ */
#hdr{
  flex-shrink:0;
  background:var(--bg3);
  border-bottom:2px solid var(--gold3);
  padding:9px 16px;
  display:flex;align-items:center;gap:16px;
  position:relative;z-index:50;
}
#hdr::after{
  content:'';position:absolute;bottom:-3px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.4;
}
.hdr-logo{font-size:1.5em;line-height:1}
.hdr-titles h1{
  font-family:'Crimson Pro',serif;font-size:1.1em;font-weight:600;
  color:var(--gold2);letter-spacing:.04em;white-space:nowrap;
}
.hdr-titles .sub{font-size:.68em;color:var(--dim2);margin-top:1px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}

.btn{
  background:var(--bg4);border:1px solid var(--border2);
  color:var(--text);padding:5px 10px;border-radius:5px;
  cursor:pointer;font-size:.72em;transition:all .15s;
  font-family:'Source Sans 3',sans-serif;white-space:nowrap;
}
.btn:hover{background:var(--bg3);border-color:var(--gold3);color:var(--gold2)}
.btn.active{background:var(--bg2);border-color:var(--gold);color:var(--gold)}

.zoom-wrap{display:flex;align-items:center;gap:7px;font-size:.72em;color:var(--dim2);white-space:nowrap}
#zoomRange{width:100px;accent-color:var(--gold);cursor:pointer;vertical-align:middle}
#zoomVal{min-width:30px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold);font-size:.9em}

.search-wrap{position:relative}
#searchInput{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);
  padding:5px 10px;font-size:.72em;width:190px;outline:none;
  font-family:'Source Sans 3',sans-serif;
}
#searchInput:focus{border-color:var(--gold3)}
#searchResults{
  position:absolute;top:calc(100% + 4px);right:0;
  width:290px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:7px;
  max-height:260px;overflow-y:auto;display:none;
  z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.8);
}
.sri{
  padding:7px 11px;cursor:pointer;
  border-bottom:1px solid var(--border);
  font-size:.72em;
  transition:background .1s;
}
.sri:last-child{border-bottom:none}
.sri:hover{background:var(--bg4)}
.sri-yr{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-weight:600;font-size:.9em}
.sri-title{color:var(--text);margin:1px 0}
.sri-track{color:var(--dim2);font-size:.88em}

/* ══ LAYOUT ═══════════════════════════════════════ */
#layout{display:flex;flex:1;overflow:hidden;min-height:0}

/* ══ SIDEBAR ══════════════════════════════════════ */
#sidebar{
  width:202px;flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  overflow-y:auto;
  display:flex;flex-direction:column;
}
.sbs{padding:8px 10px;border-bottom:1px solid var(--border)}
.sbs h3{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6em;text-transform:uppercase;letter-spacing:.14em;
  color:var(--gold3);margin-bottom:7px;
}
.tog{
  display:flex;align-items:center;gap:7px;
  padding:3px 1px;cursor:pointer;user-select:none;
  border-radius:3px;
}
.tog:hover .tog-name{color:#fff}
.tog-cb{
  width:13px;height:13px;border:1px solid var(--border2);
  border-radius:3px;background:var(--bg);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;transition:all .12s;
}
.tog.on .tog-cb{background:var(--gold3);border-color:var(--gold)}
.tog-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tog-name{font-size:.7em;color:var(--dim);transition:color .12s;line-height:1.4}
.tog.on .tog-name{color:var(--text)}
.sbs-legend{padding-top:8px;border-top:1px solid var(--border);margin-top:5px}
.sbs-legend h4{font-size:.6em;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin-bottom:5px}
.leg-item{display:flex;align-items:center;gap:5px;margin:3px 0;font-size:.65em;color:var(--dim2)}

#sideNote{
  margin-top:auto;padding:8px 10px;font-size:.62em;
  color:var(--dim);line-height:1.6;border-top:1px solid var(--border);
}

/* ══ TIMELINE AREA ════════════════════════════════ */
#timeArea{flex:1;overflow:auto;position:relative;min-width:0}
#canvas{position:relative;/*width set by JS*/}

/* ══ RULER ════════════════════════════════════════ */
#ruler{
  position:sticky;top:0;
  height:40px;background:var(--bg3);
  border-bottom:1px solid var(--gold3);
  z-index:30;overflow:hidden;
}
.rtick{
  position:absolute;bottom:0;
  transform:translateX(-50%);
  display:flex;flex-direction:column-reverse;align-items:center;
}
.rline{width:1px}
.rtick.cent .rline{height:24px;background:var(--gold3)}
.rtick.half .rline{height:14px;background:rgba(212,175,55,.25)}
.rtick.dec  .rline{height:8px; background:rgba(80,80,150,.22)}
.rlbl{font-family:'IBM Plex Mono',monospace;font-size:.58em;padding:0 2px 2px;white-space:nowrap;color:var(--gold2)}
.rtick.half .rlbl{color:var(--dim2);font-size:.52em}
.rtick.dec  .rlbl{display:none}
.rlbl-decade{display:none}
.zoom-dec .rtick.dec .rlbl-decade{display:block!important;color:var(--dim);font-size:.5em}

/* ══ ERA BANDS ════════════════════════════════════ */
#eras{position:relative;z-index:1;}
.era-band{position:absolute;top:40px;bottom:0;z-index:0;pointer-events:none;transition:background .25s,box-shadow .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.era-lbl{
  position:absolute;top:12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.68em;text-transform:uppercase;letter-spacing:.14em;
  color:#f5f7ff;white-space:nowrap;
  transform:translateX(-50%);
  pointer-events:none;z-index:3;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(4,8,24,.88);
  border:1px solid rgba(255,255,255,.08);
  text-shadow:0 0 8px rgba(0,0,0,.35);
}

/* ══ TRACKS ═══════════════════════════════════════ */
#tracks{position:relative;z-index:2;padding-top:46px;}
.track-row{
  position:relative;
  height:50px;
  border-bottom:1px solid rgba(255,255,255,.028);
  transition:background .15s;
}
.track-row:nth-child(even){background:rgba(255,255,255,.008)}
.track-row:hover{background:rgba(255,255,255,.015)}
.track-row-label{
  position:sticky;left:0;width:0;z-index:20;
}
.trl-inner{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  background:rgba(10,10,30,.85);border:1px solid var(--border);
  font-size:.6em;color:var(--dim);white-space:nowrap;
  padding:1px 5px;border-radius:3px;
  pointer-events:none;display:none;
}
/* divider line separating j tracks from regional tracks */
.track-divider{height:3px;background:linear-gradient(90deg,var(--bg),var(--border),var(--bg));z-index:2;position:relative}

/* ══ EVENT MARKERS ════════════════════════════════ */
.ev{
  position:absolute;cursor:pointer;
  z-index:10;transition:transform .1s;
  display:flex;flex-direction:column;align-items:center;
}
.ev:hover{transform:translate(-50%,-50%) scale(1.7)!important;z-index:20}
.ev-dot{border-radius:50%;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.ev.s3 .ev-dot{width:15px;height:15px;border-width:2px;border-color:rgba(255,255,255,.38)}
.ev.s2 .ev-dot{width:11px;height:11px}
.ev.s1 .ev-dot{width:7px; height:7px;border-width:1px}
.ev.s3{z-index:12}

.ev-lbl{
  position:absolute;bottom:calc(100% + 2px);
  left:50%;transform:translateX(-50%);
  font-size:.52em;white-space:nowrap;
  color:rgba(200,200,220,.55);pointer-events:none;
  display:none;line-height:1.2;
}
.ev.s3 .ev-lbl{display:block}

/* ══ TOOLTIP ══════════════════════════════════════ */
#tooltip{
  position:fixed;background:var(--bg3);
  border:1px solid var(--gold3);border-radius:8px;
  padding:11px 14px;font-size:.75em;
  pointer-events:none;z-index:999;max-width:280px;
  display:none;box-shadow:0 8px 28px rgba(0,0,0,.8);
}
.tt-yr{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:.85em;font-weight:600;margin-bottom:3px}
.tt-tit{font-family:'Crimson Pro',serif;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:5px}
.tt-dsc{color:var(--dim2);line-height:1.55;font-size:.95em}
.tt-hint{color:var(--blue);margin-top:5px;font-size:.85em}

/* ══ DETAIL PANEL ═════════════════════════════════ */
#panel{
  position:fixed;right:0;top:0;bottom:0;width:320px;
  background:linear-gradient(180deg,var(--bg3),var(--bg2));
  border-left:1px solid var(--border2);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:200;padding:18px 16px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
#panel.open{transform:none;box-shadow:-12px 0 40px rgba(0,0,0,.7)}
#panel-close{
  position:absolute;top:12px;right:12px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:50%;color:var(--dim2);
  width:26px;height:26px;cursor:pointer;
  font-size:.78em;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
#panel-close:hover{border-color:var(--gold3);color:var(--gold)}
#panel-yr{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:.82em;font-weight:600}
#panel-tit{font-family:'Crimson Pro',serif;font-size:1.35em;color:#fff;padding-right:28px;line-height:1.3}
#panel-track-badge{font-size:.68em;color:var(--dim2);display:flex;align-items:center;gap:5px}
.pd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#panel-div{height:1px;background:var(--border2)}
#panel-desc{font-size:.82em;line-height:1.75;color:var(--text);font-family:'Crimson Pro',serif;font-size:.95em}
#panel-wiki{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(40,60,120,.4);border:1px solid rgba(60,90,160,.5);
  color:var(--blue);padding:8px 13px;border-radius:6px;
  text-decoration:none;font-size:.75em;transition:all .15s;
  align-self:flex-start;margin-top:4px;
}
#panel-wiki:hover{background:rgba(50,80,160,.5);color:#80b0f0}

/* ══ SCROLLBARS ═══════════════════════════════════ */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#2a2a50}
</style>
</head>
<body>

{y:-1800,t:'Avraham (Abraham)',d:'Premier patriarche. Quitte Our en Chaldée (Ur des Chaldéens) sur ordre divin : "Lekh Lekha" (Va pour toi). Alliance (Brit) avec D. Institution de la circoncision (Brit Milah). Akeda — ligature d\'Isaac. Figure fondatrice du monothéisme.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Abraham',i:3},
{y:-1760,t:'Yitzhak (Isaac)',d:'Fils d\'Abraham et Sara, né selon la promesse divine. Deuxième patriarche. Mariage avec Rivka (Rébecca). Père de Yaakov (Jacob) et Ésaü. Signe de la continuité de l\'alliance divine.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Isaac',i:3},
{y:-1720,t:'Yaakov (Jacob) — reçoit le nom "Israël"',d:'Troisième patriarche. Lutte avec l\'ange toute la nuit et reçoit le nom "Israël" (Celui qui a lutté avec D.). Songe de l\'Échelle de Béthel. Père des douze tribus d\'Israël. Épouses : Léa, Rachel, Bilha, Zilpah.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jacob_(patriarche)',i:3},
{y:-1700,t:'Yossef (Joseph) en Égypte',d:'Fils préféré de Jacob, vendu comme esclave en Égypte par ses frères jaloux. Interprète les rêves de Pharaon (7 vaches grasses, 7 maigres). Devient vice-roi d\'Égypte (Mishneh laMelech). Sauve la région de la famine. Réconciliation fraternelle.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Joseph_(patriarche)',i:3},
{y:-1680,t:'Descente des 70 en Égypte',d:'Jacob et ses 70 descendants descendent en Égypte (Goshen). Les Hébreux prospèrent d\'abord, puis un nouveau pharaon "qui n\'avait pas connu Joseph" les réduit en esclavage.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Exode',i:2},
{y:-1600,t:'Esclavage en Égypte (Avdout Mitsraïm)',d:'Les Hébreux sont soumis à des travaux forcés (construction de Pitom et Ramsès). Pharaon ordonne de tuer les nouveau-nés mâles hébreux. Oppression intensifiée.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Exode',i:2},
{y:-1393,t:'Naissance de Moïse (Moshe)',d:'Moshe Rabbeinu (Moïse notre Maître) né dans la tribu de Lévi. Sa mère Yokheved le cache 3 mois, puis le confie au Nil dans un panier de roseaux. Recueilli par la fille de Pharaon, il est élevé à la cour royale égyptienne.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Mo%C3%AFse',i:3},
{y:-1360,t:'Buisson ardent — Révélation du Nom',d:'Au mont Horeb (Sinaï), D. se révèle à Moïse dans un buisson qui brûle sans se consumer. Révélation du Nom divin : "Ehyeh Asher Ehyeh" (Je suis Celui qui suis). Mission : libérer les Hébreux.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Buisson_ardent',i:3},
{y:-1313,t:'LES DIX PLAIES D\'ÉGYPTE',d:'Dix fléaux divins s\'abattent sur l\'Égypte : sang, grenouilles, poux, mouches, épizootie, ulcères, grêle, criquets, ténèbres, mort des premiers-nés. La dixième est précédée du premier Seder de Pessah (Pâque).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Plaies_d%27%C3%89gypte',i:3},
{y:-1313,t:'EXODE D\'ÉGYPTE — Yetsiat Mitsraïm',d:'Sortie des Hébreux d\'Égypte sous la conduite de Moïse et Aaron. La mer des Roseaux (Yam Souf) se sépare, permettant le passage. L\'armée de Pharaon est engloutie. Événement fondateur du judaïsme. Céléré à Pessah.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Exode',i:3},
{y:-1313,t:'MATAN TORAH — Révélation du Sinaï',d:'D. donne la Torah à Moïse au mont Sinaï devant tout le peuple. Dix Commandements (Aseret HaDibrot). Alliance du Sinaï. Fête de Shavouot commémore cet événement. Fondement de toute la loi juive.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Torah',i:3},
{y:-1312,t:'Le Veau d\'Or (Egel HaZahav)',d:'Pendant la longue absence de Moïse au Sinaï (40 jours), le peuple fabrique un veau d\'or. Moïse brise les Tables en découvrant la scène. Intercession auprès de D. Nouvelles Tables gravées.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Veau_d%27or',i:2},
{y:-1312,t:'Le Tabernacle (Mishkan)',d:'Construction du Sanctuaire portable selon instructions divines précises. Chaque détail symbolique. Présence divine (Shekhinah) investit le Mishkan. Aaron et ses fils officiants. Fêtes instituées.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Tabernacle_(Bible)',i:2},
{y:-1273,t:'Mort de Moïse — Josué (Yehoshua) succède',d:'Moïse monte sur le mont Nébo et contemple Canaan de loin, sans pouvoir y entrer. Mort à 120 ans. "Sa vue n\'avait pas faibli." Josué (Yehoshua ben Noun) lui succède. Fin de la Torah.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Mo%C3%AFse',i:3},
{y:-1250,t:'Josué conquiert Canaan',d:'Traversée miraculeuse du Jourdain. Chute de Jéricho (7 tours, shofar). Campagnes militaires progressives. Distribution des terres aux 12 tribus. Renouvellement de l\'alliance à Sichem.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Livre_de_Josu%C3%A9',i:3},
{y:-1220,t:'Période des Juges (Shoftim)',d:'Gouvernance par des "juges" (chefs militaires/spirituels) en l\'absence de roi central. Cycle récurrent : fidélité-apostasie-punition-repentance-délivrance. Othniel, Ehoud, Shamgar...',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Livre_des_Juges',i:2},
{y:-1150,t:'Débora (Devorah) — Prophétesse-Juge',d:'Seule femme juge d\'Israël. Siège sous un palmier. Dirige Barak contre le général cananéen Sisera. Victoire à la bataille du torrent du Kishon. Cantique de Débora : un des plus anciens poèmes hébraïques.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/D%C3%A9borah',i:2},
{y:-1120,t:'Gédéon (Guidon)',d:'Juge de Manassé. Bat les Madianites avec seulement 300 hommes (lampes, jarres, shofar). Refuse la royauté : "D. est votre roi." Éphod de Guidon. Fils Avimelekh tente d\'usurper le pouvoir.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Gédéon',i:1},
{y:-1110,t:'Yiphtah (Jephté)',d:'Juge de Galaad, fils d\'une prostituée. Victoire contre les Ammonites. Vœu tragique : sa fille unique comme offrande. Guerre civile avec Éphraïm — "Shiboleth" ou "Siboleth".',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jephté',i:1},
{y:-1090,t:'Samson (Shimshon)',d:'Juge nazir de grande force physique (Esprit de D.). Combats contre les Philistins. Dalila le séduit et lui coupe les cheveux. Captif à Gaza. Détruit le temple de Dagon en mourant. "Que mon âme meure avec les Philistins."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Samson',i:2},
{y:-1070,t:'Défaite d\'Eben-Ezer — Arche capturée',d:'Défaite catastrophique d\'Israël face aux Philistins. L\'Arche de l\'Alliance est capturée. Mort des fils d\'Éli. Éli tombe en arrière et meurt à la nouvelle. Ichabod : "La gloire s\'est exilée d\'Israël."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Arche_de_l%27Alliance',i:2},
{y:-1040,t:'Samuel — Dernier Juge, premier Prophète',d:'Shmuel HaNavi : pivot entre l\'ère des juges et la monarchie. Dernière grande figure prophétique avant Élie. Consacre Saül puis David rois d\'Israël. Institutionnalise la prophétie.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Samuel_(prophète)',i:3},
{y:-1025,t:'Saül (Shaoul) — Premier roi d\'Israël',d:'De la tribu de Benjamin. Oint par Samuel à la demande du peuple. Victorieux contre Ammon, Philistins et Amalécites. Désobéit à D. deux fois. L\'Esprit divin le quitte. Succès puis tragédie.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Sa%C3%BCl',i:3},
{y:-1010,t:'David (David HaMelech) — Roi',d:'Berger de Bethléem, vainqueur de Goliath, poète des Psaumes. Roi de Juda (Hébron) puis roi d\'Israël uni. Établit Jérusalem comme capitale éternelle. Modèle messianique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/David',i:3},
{y:-1003,t:'Jérusalem — Capitale d\'Israël',d:'David conquiert Jérusalem (Ir David) aux Jébusites et en fait la capitale politique et religieuse. "Cité de David." Centre de l\'identité juive pour toujours.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/J%C3%A9rusalem',i:3},
{y:-998,t:'Arche amenée à Jérusalem',d:'David ramène l\'Arche de l\'Alliance à Jérusalem avec 30 000 hommes. Il danse devant l\'Arche en toile de lin. Mical le méprise. Première tentative de bâtir le Temple refusée (guerre).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Arche_de_l%27Alliance',i:2},
{y:-970,t:'Salomon (Shlomo) — Roi sage',d:'Fils de David et Bethsabée. Don de sagesse divine (rêve à Gabaon). Juge les deux femmes se disputant l\'enfant. Alliance commerciale avec Hiram de Tyr. Reine de Saba. Auteur attribué : Cantique, Proverbes, Qohéleth.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Salomon',i:3},
{y:-966,t:'Construction du Premier Temple',d:'Salomon commence la construction du Beit HaMikdash sur le mont Moriah (mont du Temple, futur mont du Temple). Artisans phéniciens (Hiram de Tyr). Cèdres du Liban. 7 ans de construction.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Temple_de_J%C3%A9rusalem_(Salomon)',i:3},
{y:-959,t:'Dédicace du Premier Temple',d:'Inauguration du Temple de Salomon. La Gloire de D. (Shekhinah) remplit le Temple comme une nuée. Prière inaugurale de Salomon. 14 jours de fêtes. L\'Arche placée dans le Saint des Saints.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Temple_de_J%C3%A9rusalem_(Salomon)',i:3},
{y:-930,t:'Mort de Salomon — Scission du Royaume',d:'Mort de Salomon après 40 ans de règne. Son fils Roboam refuse d\'alléger le joug fiscal. Jéroboam et les 10 tribus du Nord font sécession. Naissance du Royaume d\'Israël (Nord) et du Royaume de Juda (Sud).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Royaume_d%27Isra%C3%ABl',i:3},
{y:-927,t:'Jéroboam Ier — Veaux d\'or à Béthel et Dan',d:'Pour empêcher ses sujets d\'aller au Temple de Jérusalem (royaume rival), Jéroboam Ier érige des veaux d\'or à Béthel et Dan : "Voici tes dieux, Israël !" Schisme religieux majeur.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/J%C3%A9roboam_Ier',i:2},
{y:-884,t:'Omri fonde Samarie',d:'Omri, roi d\'Israël, achète la colline de Shamrôn et y fonde la ville de Samarie, nouvelle capitale du Royaume du Nord. Avènement de la maison d\'Omri, mentionnée dans les sources assyriennes.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Omri',i:2},
{y:-869,t:'Achab et Jézabel — Culte de Baal',d:'Roi Achab épouse la princesse phénicienne Jézabel. Introduction du culte de Baal en Israël. Assassinat de Naboth pour son vignoble. Persécution des prophètes de D. Conflit avec Élie.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Achab',i:2},
{y:-855,t:'Élie sur le Mont Carmel',d:'Élie affronte 450 prophètes de Baal sur le mont Carmel : "Jusqu\'à quand cloperez-vous des deux côtés ?" L\'autel de D. est consumé par le feu. Les prophètes de Baal sont tués. Élie fuit dans le désert.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/%C3%89lie',i:3},
{y:-840,t:'Jéhu — Purge du baalisme',d:'Oint roi par un disciple d\'Élisée. Élimine Joram, Achazias, Jézabel (dévorée par les chiens). Massacre de la famille d\'Achab et des prêtres de Baal. Mais maintient les veaux d\'or.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/J%C3%A9hu',i:1},
{y:-785,t:'Amos — Premier prophète écrivant',d:'Berger et cultivateur de sycomores de Téqoa. Prophétise en Israël du Nord. Dénonce les injustices sociales et l\'hypocrisie religieuse. "Que le droit coule comme l\'eau, et la justice comme un torrent intarissable."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Amos_(prophète)',i:2},
{y:-760,t:'Osée (Hoshea) — Prophète de l\'amour',d:'Prophète du Royaume du Nord. Mariage avec Gomer l\'infidèle : métaphore de la relation D./Israël. "Je veux la fidélité (hessed), non les sacrifices." Premiers à parler d\'amour divin.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Os%C3%A9e',i:2},
{y:-740,t:'Isaïe (Yeshayahu) commence à prophétiser',d:'Vision de la gloire divine au Temple : "Kadosh kadosh kadosh" (Saint, Saint, Saint). Prophète de Jérusalem, conseiller royal. Prophéties messianiques ("Voici, une vierge concevra"). Deutéro-Isaïe plus tardif.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Isa%C3%AFe_(prophète)',i:3},
{y:-736,t:'Michée (Micha) — Prophète',d:'De Morèsheth, dans le Shefelah. Critique l\'injustice et les faux prophètes. "Il t\'a déclaré, ô homme, ce qui est bon : pratiquer la justice, aimer la miséricorde, marcher humblement avec ton D." Prophétie sur Bethléem.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Mich%C3%A9e_(prophète)',i:1},
{y:-722,t:'CHUTE DE SAMARIE — Exile des 10 Tribus',d:'Sargon II d\'Assyrie prend Samarie après un siège de 3 ans. Déportation de 27 290 Israélites en Mésopotamie et Médie. Peuplement de la région par des étrangers. Fin du Royaume d\'Israël du Nord. "Dix Tribus Perdues".',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Samarie_(ville)',i:3},
{y:-715,t:'Ézéchias (Hizkiyahou) — Réformes',d:'Roi pieux de Juda. Détruit les hauts-lieux, brise le Nékhoushtân (serpent d\'airain de Moïse devenu objet de culte). Creuse le Tunnel de Siloé (conservé). Résiste à Sennachérib (701).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/%C3%89z%C3%A9chias',i:2},
{y:-701,t:'Siège de Jérusalem par Sennachérib',d:'Sennachérib envahit Juda, dévaste 46 villes, assiège Jérusalem. Selon 2 Rois et le prisme de Sennachérib. Intervention miraculeuse : 185 000 soldats assyriens meurent (ange destructeur ? Épidémie ?). Jérusalem épargnée.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Siège_de_Jérusalem_(701_av._J.-C.)',i:3},
{y:-696,t:'Manassé — Long règne idolâtre',d:'Fils d\'Ézéchias. Plus long règne de Juda (55 ans). Réintroduit idolâtrie, cultes astraux, sacrifice d\'enfants dans le Tofet. Tradition : fit scier Isaïe. Captivité à Babylone puis repentance (Prière de Manassé).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Manass%C3%A9_(roi_de_Juda)',i:1},
{y:-627,t:'Jérémie (Yirmiyahou) commence à prophétiser',d:'"Avant de te former dans le sein maternel, je te connaissais." Prophète de Juda pendant 40 ans. Annonce la destruction du Temple. Nouvelle Alliance inscrite dans les cœurs. Auteur des Lamentations.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/J%C3%A9r%C3%A9mie',i:3},
{y:-621,t:'Découverte du Livre de la Torah — Réforme de Josias',d:'Grand prêtre Hilqiyahou trouve le "Livre de la Torah" (Deutéronome) dans le Temple. Réforme radicale de Josias : centralisation du culte, destruction des autels extérieurs. Grand Pessah célébré. "Shéma" institutionnalisé.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Josias',i:3},
{y:-614,t:'Habacuc (Havaquouq)',d:'"Le juste vivra par sa foi (emunatho)." Dialogue avec D. sur l\'injustice : pourquoi les méchants triomphent-ils ? Préfigure les questionnements de la théologie de la souffrance.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Habacuc',i:1},
{y:-609,t:'Mort de Josias à Megiddo',d:'Josias, roi pieux, affronte Néko II d\'Égypte à Megiddo sans raison claire. Mort tragique. Lamentation nationale. Jérémie pleure Josias. Fin de la grande réforme deutéronomique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Josias',i:2},
{y:-597,t:'Première déportation babylonienne',d:'Nabuchodonosor prend Jérusalem une première fois. Roi Joiaqin déporté avec 10 000 notables, artisans, soldats. Ézéchiel est parmi les déportés. Sédécias placé comme roi vassal.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Exil_%C3%A0_Babylone',i:3},
{y:-593,t:'Ézéchiel prophétise en Babylonie',d:'Yehezkel prophétise parmi les exilés à Tel-Aviv (Tèl Abib, bord du Kébar en Babylonie). Vision de la Merkabah (char divin). Gardien du peuple. Vision de la vallée des ossements desséchés. Temple futur détaillé.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/%C3%89z%C3%A9chiel',i:2},
{y:-586,t:'DESTRUCTION DU PREMIER TEMPLE — Tisha BeAv',d:'Nabuchodonosor brise le siège de 18 mois. Le Temple de Salomon est détruit et incendié le 9 Av. Murs de Jérusalem démolis. Déportation massive. Fin de la monarchie davidique. Gedaliahou gouverneur.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Temple_de_J%C3%A9rusalem_(Salomon)',i:3},
{y:-586,t:'Exil babylonien — Galout Bavel',d:'Les Juifs en exil à Babylone inventent la synagogue comme alternative au Temple. "Comment chanter le cantique de D. en terre étrangère ?" Psaume 137. Développement de la loi orale. Compilation de textes sacrés.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Exil_%C3%A0_Babylone',i:3},
{y:-550,t:'Deutéro-Isaïe (Isaïe 40-55)',d:'"Consolez, consolez mon peuple." Prophète anonyme de l\'exil. Cy(rus annoncé comme "messie" de D. Chants du Serviteur souffrant. Retour d\'exil comme nouvel Exode. Universalisme divin.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Deut%C3%A9ro-Isa%C3%AFe',i:2},
{y:-539,t:'Édit de Cyrus — Permission de retour',d:'Cyrus le Grand, après avoir pris Babylone, rend la liberté aux peuples déportés (Cylindre de Cyrus). Autorisation de reconstruire le Temple à Jérusalem. Restitution des vases sacrés.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Cylindre_de_Cyrus',i:3},
{y:-537,t:'Premier retour d\'exil — Zorobabel',d:'Zorobabel (Zeroubbavel) et le Grand Prêtre Yéshoua ben Yotsadak mènent le premier groupe. Construction d\'un autel. Fondations du Second Temple posées. Premiers opposants (Samaritains).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Zorobabel',i:2},
{y:-520,t:'Haggaï & Zacharie — Prophètes post-exiliques',d:'Haggaï exhorte le peuple à reprendre la construction (arrêtée depuis 16 ans). Zacharie : visions nocturnes, ange interprète, prophéties messianiques ("Voici vient l\'homme dont le nom est Germe").',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Haggaï',i:1},
{y:-516,t:'Dédicace du Second Temple',d:'Le Second Temple est achevé et inauguré sous Darius Ier, 70 ans après la destruction du Premier (accompli). Moins glorieux — pas d\'Arche, pas de Shekhinah visible. Mais centre de vie juive pour 586 ans.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Second_Temple',i:3},
{y:-486,t:'Esther et Mardochée — Pourim',d:'En Perse, Haman, favori du roi Assuérus (Xerxès), complote exterminer tous les Juifs. Esther, reine juive, intercède au péril de sa vie. Haman est pendu. Fête de Pourim instituée (14-15 Adar).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Esther',i:2},
{y:-458,t:'Esdras (Ezra HaSofer) lit la Torah',d:'Esdras le Scribe revient de Babylone avec un groupe de rapatriés. Sur la place de Jérusalem (1er Tishri), lit la Torah du matin jusqu\'à midi. Réforme des mariages mixtes. Knesset HaGedolah fondée.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Esdras',i:3},
{y:-445,t:'Néhémie reconstruit les murailles',d:'Néhémie, échanson du roi Artaxerxès Ier, nommé gouverneur de Judée. Reconstruit les murailles de Jérusalem en 52 jours malgré l\'opposition de Sanballat. Réformes sociales (annulation des dettes).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/N%C3%A9h%C3%A9mie',i:2},
{y:-440,t:'Réformes d\'Esdras — Prohibition des mariages mixtes',d:'Esdras convoque une assemblée et ordonne aux hommes de répudier leurs épouses étrangères. Mesure drastique mais controversée. Définition de l\'identité juive par la naissance maternelle.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Esdras',i:1},
{y:-400,t:'Knesset HaGedolah — Grande Assemblée',d:'Institution de 120 sages, fondée par Esdras. "Soyez mesurés dans vos jugements, formez de nombreux disciples, faites une haie autour de la Torah." Compilation et canonisation des Écritures hébraïques. Clôture de la prophétie.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Grande_Assembl%C3%A9e',i:2},
{y:-400,t:'Malachie — Dernier prophète canonique',d:'"Je vous enverrai Élie le prophète avant que vienne le Jour de D., grand et terrible." Fin du canon prophétique. Les Sages diront : "La prophétie a été enlevée aux prophètes et donnée aux fous."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Malachie_(prophète)',i:2},
{y:-380,t:'Temple samaritain sur le mont Garizim',d:'Les Samaritains construisent un temple rival sur le mont Garizim (près de Naplouse). Rupture définitive avec le judaïsme officiel centré sur Jérusalem. Canon samaritain = seul Pentateuque.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Samaritains',i:2},
{y:-350,t:'Ère des Soferim (Scribes)',d:'Les Soferim (scribes) succèdent à la Knesset HaGedolah. Ils preservent et transmettent méticuleusement la Torah écrite. Début des activités massorétiques avant la lettre. Standardisation du texte.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Sof%C3%A9rim',i:1},
{y:-332,t:'Alexandre le Grand visite Jérusalem',d:'Selon le Talmud (Yoma 69a), Alexandre rencontre le Grand Prêtre Shimon HaTzaddik et se prosterne, voyant son propre visage. Judée passe sous domination macédonienne/hellénistique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Alexandre_le_Grand',i:2},
{y:-285,t:'LA SEPTANTE (LXX) — Traduction de la Torah',d:'Ptolémée II Philadelphe fait traduire la Torah en grec par 72 savants juifs à Alexandrie (d\'après la Lettre d\'Aristée). Chacun traduit identiquement — miracle. Première traduction biblique majeure. Base de la Bible chrétienne.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Septante',i:3},
{y:-250,t:'Simon le Juste (Shimon HaTzaddik)',d:'Grand Prêtre de Jérusalem. Dernière figure de la Grande Assemblée. Accueillit Alexandre le Grand selon la tradition. "Sur trois choses le monde repose : la Torah, le service divin (Avodah), et les œuvres de charité (Guemilout Hassadim)."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Simon_le_Juste',i:2},
{y:-200,t:'Ben Sira (Siracide / Ecclésiastique)',d:'Sagesse de Jésus ben Sira de Jérusalem. Livre de sagesse en hébreu. Éloge des ancêtres (Halelou Avot). Inclus dans la Bible catholique, apocryphe dans le canon juif. Retrouvé en hébreu à Qoumrân et au Caire (Geniza).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Siracide',i:1},
{y:-175,t:'Antiochus IV Épiphane — Hellénisation forcée',d:'Roi séleucide prend le surnom "Épiphane" (dieu manifesté). Interdit la Torah, la circoncision, le shabbat, les fêtes. Exige le culte de Zeus/lui-même. Révolte maccabéenne en réponse.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Antiochos_IV_%C3%89piphane',i:3},
{y:-172,t:'Jason et Ménélaos — Corruption du Grand Sacerdoce',d:'Jason achète la charge de Grand Prêtre à Antiochus. Ménélaos surenchérit. Les deux soutiennent l\'hellénisation. Profanation de la charge sacrée. Jérusalem transformée en polis grecque.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jason_(Grand_Prêtre)',i:1},
{y:-168,t:'Profanation du Temple (Abomination de la désolation)',d:'Antiochus IV entre dans le Saint des Saints, pille le trésor. Sacrifice d\'un porc sur l\'autel. Idole de Zeus Olympien installée. Interdiction absolue du judaïsme sous peine de mort.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Antiochos_IV_%C3%89piphane',i:3},
{y:-167,t:'Révolte Maccabéenne — Mattathias de Modiin',d:'"Quiconque est pour la Loi et maintient l\'Alliance, qu\'il me suive !" Mattathias prêtre tue un officier grec et un apostat à Modiin. Ses cinq fils : Jean, Simon, Judas, Éléazar, Jonathan commencent la guérilla.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Mattathias',i:3},
{y:-165,t:'Judas Maccabée libère et purifie le Temple',d:'Yehuda HaMaccabi (Judas le Marteau) écrase plusieurs armées séleucides. Prend Jérusalem (sauf l\'Acra). Purifie et re-dédie le Temple. Miracle : une cruche d\'huile pour 1 jour brûle 8 jours.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Judas_Maccab%C3%A9e',i:3},
{y:-165,t:'HANOUKKAH — Fête des Lumières instituée',d:'Judas Maccabée institue la fête de Hanoukkah (25 Kislev, 8 jours) pour commémorer la re-dédicace du Temple et le miracle de l\'huile. Allumage de la Hanoukkyah. Fête de la liberté religieuse.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Hanoukka',i:3},
{y:-161,t:'Alliance de Judas Maccabée avec Rome',d:'Judas envoie une ambassade à Rome. Premier traité d\'amitié entre le peuple juif et Rome. Précédent important. Rome comme contrepoids contre les Séleucides.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Judas_Maccab%C3%A9e',i:1},
{y:-160,t:'Mort de Judas Maccabée',d:'Judas Maccabée tué à la bataille d\'Elasa face à une armée séleucide supérieure. Son frère Jonathan prend la tête de la résistance. La guerrilla continue.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Judas_Maccab%C3%A9e',i:2},
{y:-152,t:'Jonathan Maccabée — Grand Prêtre-Prince',d:'Jonathan accepte la nomination de Grand Prêtre par le prétendant séleucide Alexandre Balas. Cumul du pouvoir religieux et politique. Début de la théocratie hasmonéenne. Scandaleux pour les esséniens et autres pieux.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jonathan_Maccab%C3%A9e',i:2},
{y:-142,t:'Simon Maccabée — Indépendance totale de Judée',d:'"Le joug des nations fut ôté d\'Israël." Simon expulse la garnison séleucide de la citadelle Acra à Jérusalem (Sivan 142 AEC). Première vraie indépendance depuis 440 ans. Fête nationale. Simon = ethnarque et Grand Prêtre héréditaire.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Simon_Maccab%C3%A9e',i:3},
{y:-134,t:'Jean Hyrcan Ier (Yohanan Hyrqanos)',d:'Grand Prêtre et souverain après l\'assassinat de Simon. Conquête de l\'Idumée (conversion forcée), Samarie (détruit le temple du Garizim 128), Galilée. Rompt avec les Pharisiens. Fins des Soferim (paires de sages).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jean_Hyrcan_Ier',i:2},
{y:-110,t:'Jean Hyrcan détruit le temple samaritain',d:'Jean Hyrcan Ier détruit le temple samaritain du mont Garizim, rival du Temple de Jérusalem. Rupture définitive et violente avec les Samaritains.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jean_Hyrcan_Ier',i:1},
{y:-104,t:'Aristobule Ier — Premier roi hasmonéen',d:'Premier Hasmonéen à porter le titre de "Roi" (Melekh). Conquête de l\'Iturée (nord de Galilée). Emprisonne ses frères, fait mourir sa mère. Règne court (1 an).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Aristobule_Ier',i:2},
{y:-103,t:'Alexandre Jannée (Alexandre Yannai) — Roi',d:'Frère d\'Aristobule. Grand Prêtre et roi. Expansions territoriales majeures. Règne de 27 ans marqué par la violence. Crucifie 800 Pharisiens tout en festoyant. Guerre civile. Alliance finale avec les Sadducéens.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Alexandre_Jann%C3%A9e',i:2},
{y:-98,t:'Crucifixion de 800 pharisiens par Alexandre Jannée',d:'Jannée fait crucifier 800 pharisiens devant lui pendant un banquet. Les gorges de leurs épouses et enfants sont tranchées devant leurs yeux agonisants. Traumatisme dans la mémoire pharisienne.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Alexandre_Jann%C3%A9e',i:2},
{y:-76,t:'Salomé Alexandra (Shlomit) — Reine',d:'Veuve d\'Alexandre Jannée. Unique reine juive d\'Israël indépendant. Alliance avec les Pharisiens qui dominent la politique. Paix et prospérité. Expansion du réseau éducatif. "En ses jours les blés poussaient comme des palmiers."',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Salom%C3%A9_Alexandra',i:2},
{y:-67,t:'Guerre civile hasmonéenne',d:'Conflict entre Hyrcan II (soutenu par les Pharisiens et l\'Iduméen Antipater) et Aristobule II (Sadducéens). Les deux font appel à Rome. Fin de facto de l\'indépendance juive.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Guerre_civile_hasmon%C3%A9enne',i:2},
{y:-63,t:'Pompée conquiert Jérusalem — Fin de l\'indépendance',d:'Pompée met fin à la guerre civile. Siège de 3 mois. Entre dans le Saint des Saints un jour de Yom Kippour (ne prend pas le trésor). 12 000 Juifs tués. Judée sous protectorat romain. Hyrcan II Grand Prêtre sans titre royal.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Siège_de_Jérusalem_(63_av._J.-C.)',i:3},
{y:-47,t:'Jules César favorable aux Juifs',d:'César accorde des privilèges majeurs aux communautés juives : liberté de culte, exemption du service militaire le shabbat, droit de s\'assembler, exonérations fiscales partielles. Les Juifs pleurent sur sa tombe.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jules_César',i:1},
{y:-40,t:'Invasion parthe — Antigone, dernier Hasmonéen',d:'Les Parthes envahissent et placent Antigone (fils d\'Aristobule II) sur le trône. Hyrcan II est mutilé (oreilles coupées, inéligible à la Grand Prêtrise). Hérode fuit vers Rome.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Antigone_(Hasmon%C3%A9en)',i:1},
{y:-37,t:'Hérode le Grand — Début du règne',d:'Iduméen converti au judaïsme. Soutenu par Rome (désigné "roi des Juifs" par le Sénat). Conquiert Jérusalem après 3 ans. Exécute le Sanhédrin hasmonéen et les derniers Hasmonéens. Début d\'un règne de 33 ans.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/H%C3%A9rode_Ier',i:3},
{y:-20,t:'Hérode agrandit et embellit le Temple',d:'Hérode entreprend la reconstruction spectaculaire du Temple de Jérusalem. Travaux qui durent 46 ans. Esplanade considérablement étendue. Mur occidental (Mur des Lamentations) construit. Merveille de l\'Antiquité.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Temple_d%27H%C3%A9rode',i:3},
{y:-10,t:'Hillel l\'Ancien et Shammaï — Deux grandes écoles',d:'Hillel HaZaqen (Beth Hillel, libéral et accueillant) et Shammaï HaZaqen (Beth Shammaï, strict et conservateur) fondent les deux grandes académies pharisiennes. Centaines de débats qui fondent la Mishna.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Hillel_l%27Ancien',i:3},
{y:-4,t:'Mort d\'Hérode le Grand',d:'Mort d\'Hérode à Jéricho après une longue maladie, peut-être entouré d\'un complot familial. Son royaume divisé entre ses fils (Archélaüs, Antipas, Philippe). Révoltes populaires. Fin d\'une ère.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/H%C3%A9rode_Ier',i:2},

// ══════════════════════════════════════════
// PROPHÈTES & SAGES (j_fig)
// ══════════════════════════════════════════
{y:-1393,t:'Moïse (Moshe Rabbeinu)',d:'"Notre Maître Moïse." Prophète suprême auquel D. parle "face à face." Libérateur, législateur. Reçoit la Torah (écrite et orale selon la tradition). Guide 40 ans dans le désert. Meurt sans entrer en Canaan.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Mo%C3%AFse',i:3},
{y:-1350,t:'Aaron (Aharon) — Premier Grand Prêtre',d:'Frère et porte-parole de Moïse. Premier Cohen Gadol (Grand Prêtre). Fondateur de la lignée sacerdotale (Kohanim). Épisode du Veau d\'or. Mort sur le mont Hor. Pleuré 30 jours.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Aaron_(patriarche)',i:2},
{y:-1350,t:'Miriam (Myriam) — Prophétesse',d:'Sœur de Moïse et Aaron. Prophétesse. Chante le Cantique de la mer Rouge avec son tambourin. Rôle de chef féminin. Punition de la lèpre pour avoir critiqué Moïse. Mort à Qadesh.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Miryam',i:2},
{y:-1250,t:'Josué (Yehoshua ben Noun)',d:'Disciple fidèle de Moïse. Caleb et lui seuls des explorateurs conseillent d\'entrer en Canaan. Successeur de Moïse. Conquiert Canaan. Distribue les terres. Renouvelle l\'alliance à Sichem avant sa mort.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Josu%C3%A9',i:2},
{y:-1040,t:'Samuel (Shmuel HaNavi)',d:'Prophète et juge né de la prière fervente de Hanna. Élevé par Éli. Sa vocation nocturne ("Parle, D., ton serviteur écoute"). Institue la royauté, oint Saül puis David. Intercède pour Israël jusqu\'à sa mort.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Samuel_(prophète)',i:2},
{y:-1010,t:'Natan (Nathan) — Prophète de la cour',d:'Prophète à la cour de David. Parabole de la brebis pour confronter David après l\'affaire Bethsabée-Urie. Soutient Salomon (et non Adoniyahou) pour succéder à David. Figure du prophète comme "conscience du roi".',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Nathan_(prophète)',i:1},
{y:-860,t:'Élie (Eliyahu HaNavi)',d:'Prophète de feu. Combat le baalisme. Fuit dans le désert après Carmel. Vent, tremblement de terre, feu... puis "la voix du calme suave." Monté au ciel dans un char de feu. Attendu chaque Seder de Pessah.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/%C3%89lie',i:3},
{y:-850,t:'Élisée (Elisha ben Shafat)',d:'Disciple d\'Élie, hérite de "double part de son esprit." Miracles nombreux : eau guérie, huile multipliée, résurrection d\'un enfant, guérison de Naamân le lépreux, visions célestes d\'armées de feu.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/%C3%89lis%C3%A9e',i:2},
{y:-800,t:'Jonas (Yona)',d:'Prophète envoyé à Ninive. Fuit par bateau. Tempête. Jeté à la mer, avalé par un "grand poisson" pendant 3 jours. Prêche à Ninive qui se repent. D. épargne la ville. Jonas boude. Lu le Yom Kippour (après-midi).',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Jonas_(prophète)',i:2},
{y:-593,t:'Ézéchiel (Yehezkel)',d:'Prophète-prêtre en exil. Vision de la Merkabah (char divin à 4 faces) — fondement de la mystique juive (Ma\'assé Merkavah). Gardien d\'Israël. Temple futur en détail (chap. 40-48). Vallée des ossements desséchés.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/%C3%89z%C3%A9chiel',i:3},
{y:-458,t:'Esdras (Ezra HaSofer) — Le Scribe',d:'Prêtre et scribe. "La main de D. était sur lui." Revient de Babylone avec autorisation royale perse. Lit la Torah publiquement en Tishri 458. Réforme radicale. Fondateur du judaïsme "normativist".',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Esdras',i:3},
{y:-480,t:'Malachie — Dernier prophète du canon',d:'"Rendez-moi les dîmes... éprouvez-moi donc en cela." "Voici, je vous enverrai Élie le prophète." Les Sages diront ensuite : "Depuis la mort des derniers prophètes, l\'Esprit Saint s\'est retiré d\'Israël."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Malachie_(prophète)',i:2},
{y:-300,t:'Antigone de Socho',d:'Sage de la Knesset HaGedolah. Disciple de Siméon le Juste. Sa maxime : "Ne soyez pas comme des serviteurs qui servent leur maître pour recevoir une récompense, mais soyez comme des serviteurs qui le servent sans y attendre de récompense."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Antigone_de_Socho',i:1},
{y:-250,t:'José ben Joèzer et José ben Yohanan — 1ère Zougot',d:'Première paire (Zougot) de sages. Fondent l\'institution des pairs de savants (Nassi/Av Beit Din). Institutionnalisent l\'étude Torah par paires. Transmettent la tradition orale du mont Sinaï.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Zugot',i:1},
{y:-100,t:'Shimon ben Shétah',d:'Frère de la reine Salomé Alexandra. Pharisien influent. Institue l\'obligation d\'éducation pour tous les garçons (premières "écoles élémentaires"). Président du Sanhédrin. Combat la sorcellerie (80 femmes à Ashqelon).',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Shimon_ben_Sh%C3%A9tah',i:1},
{y:-70,t:'Hillel l\'Ancien (Hillel HaZaqen)',d:'Né en Babylonie. Venu étudier à Jérusalem sans argent. Fondateur de Beth Hillel. Règle d\'or : "Ce qui t\'est odieux, ne le fais pas à ton prochain — c\'est toute la Torah, le reste est commentaire. Va et apprends." Proselytes accueillis.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Hillel_l%27Ancien',i:3},
{y:-70,t:'Shammaï (Shammaï HaZaqen)',d:'Maçon de profession. Fondateur de Beth Shammaï. Réponses strictes et conservatrices. "Accueille tout homme avec un visage aimable." Débats avec Hillel légendaires : 18 décrets, conversion, divorce.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Shamma%C3%AF',i:2},
{y:-50,t:'Philon d\'Alexandrie (Philo) — naissance ~20 AEC',d:'Philosophe juif hellénophone d\'Alexandrie. Synthèse entre Torah et philosophie platonicienne. Concept du Logos (Parole divine). Apologète du judaïsme. Ambassade à Caligula (38-41 EC). Influence sur la théologie chrétienne.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Philon_d%27Alexandrie',i:3},

// ══════════════════════════════════════════
// SECTES & COURANTS JUIFS (j_sects)
// ══════════════════════════════════════════
{y:-380,t:'Samaritains (Shomronim) — Schisme définitif',d:'Population mélangée après la déportation assyrienne (722 AEC). Canon = Pentateuque samaritain uniquement. Temple du mont Garizim (construit ~380, détruit 110 AEC). Adversaires persistants des Juifs de retour d\'exil. Encore ~800 fidèles aujourd\'hui.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Samaritains',i:3},
{y:-167,t:'Hassidéens (Hasidim) — Premiers pieux',d:'Mouvement de piété intransigeant. Résistance à l\'hellénisation par la mort plutôt que de profaner le shabbat. Alliés des Maccabées au début. Précurseurs des Pharisiens et des Esséniens.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Hassid%C3%A9ens',i:2},
{y:-152,t:'Sadducéens (Tsédukim) — Aristocratie sacerdotale',d:'Courant sacerdotal et aristocratique. Torah écrite uniquement (pas de Torah Orale). Nient la résurrection, les anges, la providence. Contrôlent le Temple. Disparaissent après 70 EC avec la destruction du Temple.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Sadd%C3%BCC%C3%A9ens',i:3},
{y:-150,t:'Pharisiens (Perushim) — Torah Orale',d:'Courant majoritaire du judaïsme populaire. Torah écrite ET orale. Résurrection des morts. Anges. Providence divine. Synagogues comme centres. Ancêtres directs du judaïsme rabbinique. Jésus débat avec eux.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Pharisiens',i:3},
{y:-140,t:'Esséniens (Issiïm) — Ascètes du désert',d:'Communauté(s) ascétique(s), souvent célibataires. Bains rituels quotidiens. Calendrier solaire (vs luni-solaire officiel). Vie communautaire. Probable auteurs des Manuscrits de la mer Morte. Attendaient deux Messies.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Ess%C3%A9niens',i:3},
{y:-135,t:'Communauté de Qoumrân — Manuscrits de la mer Morte',d:'Communauté installée au bord de la mer Morte (probablement essénienne). "Maître de Justice" vs "Prêtre impie." Cache une bibliothèque de 900 manuscrits (découverts 1947). Textes bibliques les plus anciens connus.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Manuscrits_de_la_mer_Morte',i:3},
{y:-100,t:'Boéthusiens',d:'Courant lié à Simon ben Boethos, beau-père d\'Hérode le Grand. Proches des Sadducéens. Grand Prêtrise liée à la famille. Disparaissent avec la chute du Temple.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Bo%C3%A9thusiens',i:1},
{y:-75,t:'Thérapeutes (Therapeutai) — Ascètes d\'Égypte',d:'Communauté juive contemplative au bord du lac Maréotis (Alexandrie). Décrite par Philon dans "De Vita Contemplativa". Hommes et femmes. Étude, prière, jeûne. Ancêtres des moines chrétiens ?',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Th%C3%A9rapeutes_d%27Alexandrie',i:2},
{y:-30,t:'École de Beth Hillel vs Beth Shammaï',d:'Les deux grandes académies pharisiennes débattent pendant 3 générations. Beth Hillel est généralement plus libérale et l\'emporte finalement ("Les deux sont paroles du D. vivant, mais la halakha suit Beth Hillel").',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Beth_Hillel_et_Beth_Shammai',i:2},
{y:-30,t:'Hérodiens',d:'Parti politique soutenant la dynastie hérodienne. Acceptaient la domination romaine comme moindre mal. Proches des Sadducéens. Mentionnés dans les Évangiles comme alliés des Pharisiens contre Jésus.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/H%C3%A9rodiens',i:1},

// ══════════════════════════════════════════
// DIASPORA & COMMUNAUTÉS (j_diap)
// ══════════════════════════════════════════
{y:-586,t:'Communauté juive de Babylone',d:'Première grande diaspora institutionnalisée. Invention de la synagogue (Beit Knesset). Étude Torah sans Temple. Développement de la prière comme substitut aux sacrifices. Futur siège du judaïsme pendant 1000 ans.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Exil_%C3%A0_Babylone',i:3},
{y:-586,t:'Communauté juive d\'Éléphantine (Égypte)',d:'Colonie militaire juive araméophone sur l\'île d\'Éléphantine (Nil, Haute-Égypte). Temple juif (dédié à "Yaho"). Papyrus araméens préservés (découverts 1903). Pratiques syncrétistes. Correspond avec Jérusalem et Samarie.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/%C3%89l%C3%A9phantine',i:2},
{y:-320,t:'Diaspora juive d\'Alexandrie',d:'Grande communauté juive dans la nouvelle capitale ptolémaïque. Juifs hellénophones. Synagogues. Septuagint traduite pour eux. Deux des cinq quartiers d\'Alexandrie sont juifs. Centre intellectuel majeur.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Juifs_d%27Alexandrie',i:2},
{y:-300,t:'Diaspora juive dans les cités hellénistiques',d:'Présence juive dans toutes les grandes métropoles hellénistiques : Antioche (importante), Cyrène, Rhodes, Éphèse. Intégration culturelle partielle. Politeumate (statut communautaire) dans plusieurs villes.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Diaspora_juive',i:1},
{y:-163,t:'Temple d\'Onias — Léontopolis (Égypte)',d:'Onias IV, fils du Grand Prêtre Onias III assassiné, construit un temple juif à Léontopolis (Égypte) avec permission de Ptolémée VI. Rival du Temple de Jérusalem pendant ~230 ans (détruit par Rome 74 EC).',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Temple_d%27Onias',i:2},
{y:-100,t:'Juifs à Rome — Premières communautés',d:'Présence juive à Rome depuis le IIe siècle AEC (ambassades hasmonéennes). Prisonniers de guerre de Pompée (63). Synagogues à Trastevere. César les favorise. Communauté de plusieurs dizaines de milliers sous Auguste.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_%C3%A0_Rome',i:2},
{y:-100,t:'Juifs en Babylonie/Perse (diaspora orientale)',d:'Après le retour (538), de nombreux Juifs restent à Babylone. Exilarque (Resh Galuta). Académies naissantes. Communautés prospères. Futur lieu de rédaction du Talmud babylonien.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Babylone_dans_la_culture_juive',i:1},
{y:-50,t:'Diaspora juive partout en Méditerranée',d:'Strabon (vers 80 AEC): "Il est difficile de trouver sur terre un endroit qui n\'a pas accueilli cette race et ne soit pas possédé par elle." Estimé 4-6 millions de Juifs dans l\'Empire romain = 7-10% de la population.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Diaspora_juive',i:2},

// ══════════════════════════════════════════
// LEVANT & PROCHE-ORIENT (levant)
// ══════════════════════════════════════════
{y:-3500,t:'Cités-États cananéennes',d:'Premières grandes cités en Canaan : Mégiddo, Jéricho (plus ancienne ville fortifiée), Hazor, Lakish. Civilisation cananéenne polythéiste : Baal, El, Anat, Asherah. Commerce avec Égypte et Mésopotamie.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Canaan',i:2},
{y:-2300,t:'Ebla — Premier grand État syrien',d:'Cité-État syrienne (Tell Mardikh). Archives de 17 000 tablettes cunéiformes. Commerce intense avec toute la région. Langue éblaïte (proto-sémitique). Détruite par Sargon d\'Akkad vers 2300.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Ebla',i:2},
{y:-1500,t:'Ugarit — Textes mythologiques, alphabet',d:'Grand port syrien. Textes littéraires et mythologiques (épopée de Baal, cycle d\'Anat). Écriture alphabétique cunéiforme. Langue ougaritique proche de l\'hébreu. Détruite par les Peuples de la Mer ~1185 AEC.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Ougarit',i:2},
{y:-1400,t:'Lettres d\'Amarna',d:'Correspondance diplomatique en akkadien entre les pharaons Amenhotep III/IV et les rois de Canaan. Mention des "Hapiru" (liés aux Hébreux ?). Instabilité politique en Canaan. Précieux pour la compréhension du contexte de l\'Exode.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Lettres_d%27Amarna',i:1},
{y:-1285,t:'Bataille de Qadesh — Premier traité de paix',d:'Ramsès II vs Hittites de Mouwatalli II. Résultat indécis. Traité de paix (1259) : premier traité international conservé, en deux versions (égyptien et hittite). Précédent diplomatique mondial.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_de_Qadesh',i:2},
{y:-1200,t:'Peuples de la Mer — Effondrement de l\'Âge du Bronze',d:'Invasion/migration des "Peuples de la Mer" (Philistins, Pélasges, Tjeker...). Destruction d\'Ugarit, des Hittites, des palais mycéniens. Les Philistins s\'installent sur la côte de Canaan (5 cités).',tr:'levant',w:'https://fr.wikipedia.org/wiki/Peuples_de_la_Mer',i:3},
{y:-1050,t:'Phéniciens — Commerce et alphabet',d:'Les Phéniciens (Tyr, Sidon, Byblos) dominent le commerce méditerranéen. Créent l\'alphabet phonétique de 22 consonnes, ancêtre direct de tous les alphabets modernes (hébreu, grec, latin, arabe...).',tr:'levant',w:'https://fr.wikipedia.org/wiki/Ph%C3%A9niciens',i:3},
{y:-900,t:'États araméens — Damas, Hamath',d:'Les Araméens contrôlent la Syrie. Damas est la principale puissance, rivale d\'Israël. L\'araméen devient la lingua franca du Proche-Orient (puis la langue des Juifs en Babylonie). Alliances et guerres avec Israël.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Aram%C3%A9ens',i:2},
{y:-853,t:'Bataille de Qarqar — Israël vs Assyrie',d:'Salmanazar III affronte une coalition anti-assyrienne. "2 000 chars et 10 000 fantassins d\'Achab l\'Israélite" selon les annales assyriennes. Première mention d\'Israël dans des sources assyriennes contemporaines.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_de_Qarqar',i:2},
{y:-814,t:'Carthage fondée par les Phéniciens',d:'Fondation de Qart-Hadasht ("Nouvelle cité" en phénicien) par des colons de Tyr, selon la tradition par la reine Didon (Élissa). Premières colonies phéniciennes en Méditerranée occidentale.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Carthage',i:2},
{y:-732,t:'Damas tombe face à Tiglath-Pileser III',d:'Fin du Royaume araméen de Damas. La Syrie devient province assyrienne. La Résistance araméenne prend fin. Tiglath-Pileser (= Poul dans la Bible) reçoit tribut d\'Israël.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Tiglath-Pileser_III',i:2},
{y:-332,t:'Alexandre conquiert le Levant',d:'Alexandre prend Tyr (siège de 7 mois, construit une digue — toujours visible) et Gaza. Toute la côte levantine sous domination macédonienne. Début de l\'hellénisation du Proche-Orient.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAtes_d%27Alexandre_le_Grand',i:3},
{y:-301,t:'Levant sous contrôle ptolémaïque (après Ipsos)',d:'Après la bataille d\'Ipsos (301), la Palestine et la Phénicie passent aux Ptolémées d\'Égypte. Judée prospère sous les Lagides. Liberté religieuse. Grand développement de la diaspora alexandrine.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_d%27Ipsos',i:1},
{y:-198,t:'Antiochus III prend le Levant (Panion)',d:'Antiochus III le Grand défait Ptolémée V à la bataille de Panion. Le Levant passe aux Séleucides. Les Juifs accueillent d\'abord favorablement les Séleucides. Charte de droits accordée.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Bataille_de_Panion',i:2},
{y:-141,t:'Indépendance juive sous Simon Maccabée',d:'Simon expulse la dernière garnison séleucide (Acra de Jérusalem). 23 Iyar 141 : premier jour de l\'ère d\'indépendance hasmonéenne. Première vraie souveraineté depuis Nabuchodonosor (440 ans).',tr:'levant',w:'https://fr.wikipedia.org/wiki/Simon_Maccab%C3%A9e',i:3},
{y:-63,t:'Rome conquiert le Levant — Province de Syrie',d:'Pompée crée la province romaine de Syrie. Met fin à l\'Empire séleucide (déjà moribond). Le Levant entre dans l\'orbite romaine pour les 5 siècles suivants. Judée en protectorat.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Prov._romaine_de_Syrie',i:3},

// ══════════════════════════════════════════
// MÉSOPOTAMIE & PERSE (meso)
// ══════════════════════════════════════════
{y:-3500,t:'Civilisation sumérienne — Écriture cunéiforme',d:'Sumériens en Mésopotamie du Sud. Invention de l\'écriture cunéiforme (~3200 AEC). Premières villes-États : Ur, Uruk, Lagash, Nippur. Ziggurats. Épopée de Gilgamesh (déluge). Calendrier, mathématiques.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Sum%C3%A9rie',i:3},
{y:-2350,t:'Sargon d\'Akkad — Premier empire mondial',d:'Sargon crée le premier empire unifié de l\'histoire en conquérant les cités sumériennes. Langue akkadienne dominante. Empire s\'étend de la Méditerranée au Golfe persique. Précède Abraham de quelques siècles.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Sargon_d%27Akkad',i:2},
{y:-2100,t:'IIIe Dynastie d\'Ur — Renaissance sumérienne',d:'Ur-Nammu bâtit la grande Ziggurat d\'Ur. Premier code de lois connu (avant Hammurabi). Administration centralisée. Apogée de la culture sumérienne. Contexte probable du départ d\'Abraham "d\'Ur en Chaldée".',tr:'meso',w:'https://fr.wikipedia.org/wiki/Troisi%C3%A8me_Dynastie_d%27Our',i:2},
{y:-1792,t:'Hammurabi — Code de lois (282 articles)',d:'Roi de Babylone. Son célèbre code de lois gravé sur une stèle de diorite (Musée du Louvre). 282 lois. Principe du talion. Nombreux parallèles avec les lois de la Torah. Stèle découverte à Suse en 1901.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Code_de_Hammurabi',i:3},
{y:-1595,t:'Hittites saccagent Babylone',d:'Les Hittites d\'Ourili sous Mursili Ier pillent Babylone, mettant fin à la première Babylone. Début de la période kassite. Redistribution du pouvoir en Mésopotamie.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Cassites',i:1},
{y:-1600,t:'Épopée de Gilgamesh — Version standard',d:'Texte akkadien standardisé. Récit du déluge babylonien (Uta-Napishtim) parallèle à Noé. Thèmes : amitié, mort, immortalité. Tablette XI = déluge. Découverte 1872 provoque une révolution biblique.',tr:'meso',w:'https://fr.wikipedia.org/wiki/%C3%89pop%C3%A9e_de_Gilgamesh',i:2},
{y:-745,t:'Tiglath-Pileser III — Déportations systématiques',d:'Réforme militaire assyrienne. Politique de déportation massive des populations conquises. Annexe des territoires d\'Israël du Nord. Prend tribut d\'Achaz de Juda. Mentionné dans la Bible comme "Poul".',tr:'meso',w:'https://fr.wikipedia.org/wiki/Tiglath-Pileser_III',i:3},
{y:-722,t:'Sargon II — Conquête de Samarie',d:'Prend Samarie après un siège de 3 ans (commencé par Salmanazar V). Déporte 27 290 Israélites. Repeuple la région avec des étrangers. Mentionne explicitement "la ville de Samarie" dans ses annales.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Sargon_II',i:3},
{y:-705,t:'Sennachérib — Siège de Jérusalem',d:'"Je l\'enfermai comme un oiseau en cage." Sennachérib assiège Jérusalem mais ne la prend pas. Son prisme (British Museum) et 2 Rois donnent deux récits divergents. 46 villes de Juda dévastées. Mystérieux départ assyrien.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Sennach%C3%A9rib',i:3},
{y:-668,t:'Assurbanipal — Bibliothèque de Ninive',d:'Dernier grand roi assyrien. Constitue la première grande bibliothèque systématique : 30 000 tablettes. Comprend l\'épopée de Gilgamesh, les omens, la médecine. Découverte en 1849 révolutionne l\'histoire ancienne.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Assurbanipal',i:2},
{y:-626,t:'Nabopolassar — Empire néo-babylonien',d:'Nabopolassar se révolte contre l\'Assyrie avec l\'aide des Mèdes. Fonde l\'Empire néo-babylonien (chaldéen). Père de Nabuchodonosor. Prend Ninive en 612 avec Kyaxare mède.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Nabopolassar',i:2},
{y:-612,t:'Chute de Ninive — Fin de l\'Empire assyrien',d:'Coalition babylono-mède détruit Ninive. La puissante capitale assyrienne disparaît. "Malheur à Ninive !" (Nahum). Réjouissance en Israël et Juda. Fin de l\'oppression assyrienne de 150 ans.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Ninive',i:3},
{y:-605,t:'Nabuchodonosor II — Roi de Babylone',d:'Grand roi néo-babylonien. Jardins suspendus de Babylone (une des 7 merveilles). Détruit Jérusalem (586). Daniel à sa cour. "N\'est-ce pas là Babylone la grande que j\'ai bâtie ?" Reconnaît D. après 7 ans de folie.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Nabuchodonosor_II',i:3},
{y:-550,t:'Cyrus II le Grand — Empire perse achéménide',d:'Fonde l\'Empire perse. Conquiert Médie, Lydie (bat Crésus 546), puis Babylone (539). Politique de tolérance religieuse. "Roi juste" dans les textes juifs. Cylindre de Cyrus = première déclaration des droits de l\'homme ?',tr:'meso',w:'https://fr.wikipedia.org/wiki/Cyrus_le_Grand',i:3},
{y:-522,t:'Darius Ier — Organisation de l\'Empire',d:'Grand organisateur. Divise l\'empire en 20 satrapies. Routes royales avec courriers rapides. Palais de Persépolis. Monnaie (darique). Autorise la reconstruction du Temple de Jérusalem (décret de 520).',tr:'meso',w:'https://fr.wikipedia.org/wiki/Darius_Ier',i:2},
{y:-486,t:'Xerxès Ier (Assuérus) — Invasion de la Grèce',d:'Fils de Darius. Immense armée (peut-être exagérée) traverse l\'Hellespont sur un pont de bateaux. Brûle Athènes. Défaite décisive à Salamine (480). Probable "Assuérus" du Livre d\'Esther.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Xerx%C3%A8s_Ier',i:3},
{y:-465,t:'Artaxerxès Ier — Favorable aux Juifs',d:'Roi perse favorable aux Juifs. Envoie Esdras à Jérusalem (458). Puis Néhémie (445). Les Juifs bien intégrés à la cour perse. Esther et Mardochée (selon tradition).',tr:'meso',w:'https://fr.wikipedia.org/wiki/Artaxerx%C3%A8s_Ier',i:2},
{y:-336,t:'Darius III — Dernier Achéménide',d:'Darius III Codoman, dernier roi de la dynastie achéménide. Défait par Alexandre à Issos (333) et Gaugamèles (331). Fuit. Assassiné par son satrape Bessos. Fin de 220 ans d\'Empire perse.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Darius_III',i:2},
{y:-312,t:'Séleucus Ier — Empire séleucide',d:'Général d\'Alexandre. Fonde l\'Empire séleucide après les guerres des Diadoques. Capitale : Antioche. Empire s\'étend de la Méditerranée à l\'Inde. Hellénisation de l\'Orient. Domination sur les Juifs.',tr:'meso',w:'https://fr.wikipedia.org/wiki/S%C3%A9leucos_Ier',i:2},
{y:-247,t:'Empire parthe (Arsacides)',d:'Arsace Ier fonde l\'Empire parthe en Iran oriental. Résiste aux Séleucides. Empire iranien hellénisé. Conquerra la Mésopotamie en 141 AEC. Barrier durable entre Rome et l\'Orient.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Empire_parthe',i:2},
{y:-141,t:'Parthes reprennent la Mésopotamie',d:'Mithridate Ier parthe conquiert la Babylonie aux Séleucides. Fin de la domination grecque en Mésopotamie. Communautés juives désormais sous domination parthe — importante pour l\'histoire du judaïsme.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Mithridate_Ier_(roi_des_Parthes)',i:2},

// ══════════════════════════════════════════
// ÉGYPTE (egypt)
// ══════════════════════════════════════════
{y:-3100,t:'Unification de l\'Égypte — Narmer/Ménès',d:'Narmer unifie la Haute et Basse Égypte. Naissance de la civilisation pharaonique. Hiéroglyphes. Palette de Narmer (premier document narratif historique). Début des dynasties pharaoniques.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Narmer',i:3},
{y:-2686,t:'Ancien Empire — Pyramides de Gizeh',d:'IIIe-VIe dynasties. Djoser (Saqqarah, première pyramide). Khéops, Khéphren, Mykérinos (Grande Pyramide). Apogée du pouvoir pharaonique. Textes des Pyramides. Religion osirienne.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Pyramides_de_Gizeh',i:2},
{y:-2055,t:'Moyen Empire — Renaissance culturelle',d:'XIe-XIIe dynasties. Amenemhat Ier, Sésostris III. Reconquête de la Nubie. Grande littérature classique (Sinouhé, Conte du Naufragé). Essor de la classe moyenne. dieu Amon prépondérant.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Moyen_Empire_%C3%A9gyptien',i:1},
{y:-1650,t:'Invasion des Hyksos',d:'Peuple sémitique (Hyksos = "chefs des pays étrangers") domine le Delta (XVe-XVIe dynasties). Chars et chevaux introduits en Égypte. Capitale Avaris. Contexte possible de Joseph et de l\'esclavage hébreu.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Hyksos',i:3},
{y:-1550,t:'Nouvel Empire — Ahmosis expulse les Hyksos',d:'Ahmosis Ier chasse les Hyksos. Début du Nouvel Empire (XVIIIe-XXe dynasties). Âge d\'or : Thoutmosis III, Amenhotep III, Hatchepsout. Expansion jusqu\'à l\'Euphrate. Richesses de Nubie.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Nouvel_Empire_%C3%A9gyptien',i:2},
{y:-1479,t:'Thoutmosis III — Empire maximal',d:'Conquêtes en Asie (17 campagnes militaires). Bataille de Megiddo (1457). "Napoléon de l\'Antiquité." Contrôle du Levant jusqu\'à l\'Euphrate. Tribut de Canaan. Époque de la domination égyptienne sur Canaan.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Thoutmosis_III',i:2},
{y:-1353,t:'Akhenaton — Révolution monothéiste',d:'Amenhotep IV / Akhenaton. Révolution religieuse : un seul dieu Aton (disque solaire). Capitale Akhetaton (Amarna). Hymne à Aton (parallèles frappants avec le Psaume 104). Effacé après sa mort.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Akhenaton',i:3},
{y:-1336,t:'Toutankhamon — Restauration',d:'Fils présumé d\'Akhenaton. Restaure les anciens dieux. Retour à Thèbes. Mort à 18 ans. Sa tombe (découverte 1922 par Carter) révèle les splendeurs de l\'art égyptien.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Toutankhamon',i:2},
{y:-1279,t:'Ramsès II — Contexte de l\'Exode',d:'67 ans de règne. Bataille de Qadesh (traité de paix). Abou Simbel. Pithom et Ramsès (nommées dans l\'Exode). Principal candidat au "Pharaon de l\'Exode" selon nombreux chercheurs.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Ramses_II',i:3},
{y:-1213,t:'Stèle de Mérneptah — Première mention d\'Israël',d:'"Israël est dévasté, sa semence n\'est plus." Première mention extra-biblique d\'Israël dans n\'importe quel document ancien. Fils de Ramsès II. La stèle (1208 AEC) est au Musée du Caire.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/St%C3%A8le_de_M%C3%A9rn%C3%A9ptah',i:3},
{y:-945,t:'Sheshonq Ier (Shishak) — Raid en Judée',d:'Pharaon libyen. Envahit Juda et Israël sous Roboam. Pille Jérusalem et le Temple de Salomon. Mentionné dans 1 Rois 14:25 comme "Shishak." Sa liste de villes conquises est visible à Karnak.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Ch%C3%A9chonq_Ier',i:2},
{y:-664,t:'Période saïte (26e Dynastie)',d:'Dernière grande renaissance égyptienne indigène. Psammétique Ier (soutenu par mercenaires grecs). Retour aux modèles de l\'Ancien Empire. Alliance avec la Grèce. Mercenaires juifs à Éléphantine.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Vingt-sixième_Dynastiei_égyptienne',i:1},
{y:-525,t:'Conquête perse de l\'Égypte — Cambyse II',d:'Cambyse II bat le pharaon Psammétique III à Péluse. L\'Égypte devient satrapie perse. Darius Ier complète l\'organisation. Communautés juives d\'Éléphantine florissantes sous la Perse.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Cambyse_II',i:2},
{y:-332,t:'Alexandre conquiert l\'Égypte — Alexandrie fondée',d:'Alexandre accueilli comme libérateur. Oracle d\'Amon à Siwa le déclare fils de dieu. Fonde Alexandrie (331). L\'Égypte entre dans le monde grec. Fin de la Perse. Début de la période ptolémaïque.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Alexandre_le_Grand_en_%C3%89gypte',i:3},
{y:-305,t:'Ptolémée Ier — Fondation de la Dynstie Lagide',d:'Ptolémée Ier Sôter (Sauveur) fonde la dernière grande dynastie égyptienne. Alexandrie = capitale intellectuelle du monde méditerranéen. Musée, Bibliothèque d\'Alexandrie. Commence la Septuaginta.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Ptolémée_Ier',i:2},
{y:-285,t:'Ptolémée II — Bibliothèque, Septuante',d:'Ptolémée II Philadelphe : apogée culturelle d\'Alexandrie. Bibliothèque d\'Alexandrie (500 000 rouleaux ?). Commande la traduction de la Torah (Septuaginta / LXX). Phare d\'Alexandrie.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Ptolémée_II',i:2},
{y:-170,t:'Antiochus IV envahit l\'Égypte deux fois',d:'Antiochus IV envahit l\'Égypte (170 et 168). En 168, Rome (via l\'ambassadeur Gaius Popilius) lui ordonne de se retirer en traçant un cercle autour de lui. Humilié, Antiochus tourne sa rage contre les Juifs.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Antiochos_IV_%C3%89piphane',i:2},
{y:-51,t:'Cléopâtre VII — Dernière reine lagide',d:'Dernière souveraine de la longue lignée ptolémaïque. Alliance avec César (fils Césarion). Puis avec Marc Antoine. Suicide à l\'arrivée d\'Octavien Auguste (30 AEC). Fin de la civilisation pharaonique indépendante.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Cl%C3%A9op%C3%A2tre_VII',i:3},
{y:-30,t:'Rome conquiert l\'Égypte',d:'Octavien (futur Auguste) conquiert l\'Égypte après la mort de Cléopâtre. L\'Égypte devient province romaine — grenier de Rome. Fin de 3000 ans de civilisation pharaonique indépendante. Grande communauté juive d\'Alexandrie sous Rome.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Province_romaine_d%27%C3%89gypte',i:3},

// ══════════════════════════════════════════
// GRÈCE ANTIQUE (greece)
// ══════════════════════════════════════════
{y:-1600,t:'Civilisation mycénienne',d:'Premières grandes cités forifiées grecques : Mycènes, Tirynthe, Pylos. Écriture linéaire B (grec archaïque). Agamemnon, Achille, etc. La guerre de Troie (~1200) est probablement liée à cette période.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Civilisation_myc%C3%A9nienne',i:2},
{y:-800,t:'Homère — Iliade et Odyssée',d:'Composition des deux grandes épopées fondatrices de la culture grecque. Iliade : guerre de Troie et colère d\'Achille. Odyssée : retour d\'Ulysse. Base de l\'éducation grecque. Influence mondiale inestimable.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Hom%C3%A8re',i:3},
{y:-776,t:'Premiers Jeux olympiques',d:'Institution des Jeux panhelléniques à Olympie en l\'honneur de Zeus. Trêve sacrée (Ékécheiria). Unification symbolique des cités. Calendrier grec compté par "olympiades" (4 ans). 293 éditions jusqu\'en 393 EC.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Jeux_olympiques_antiques',i:2},
{y:-700,t:'Hésiode — Théogonie et Travaux',d:'Poète béotien. Théogonie : généalogie des dieux grecs. Les Travaux et les Jours : éthique du travail paysan. Mythe de Prométhée. Âges de l\'humanité (or, argent, bronze, héros, fer).',tr:'greece',w:'https://fr.wikipedia.org/wiki/H%C3%A9siode',i:1},
{y:-621,t:'Lois de Dracon — Code draconien',d:'Premier code de lois écrit d\'Athènes. Réputées si sévères que la mort était la peine pour presque tous les crimes. "Les lois de Dracon sont écrites en sang, non en encre" (Démade). Étape vers le droit écrit.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Dracon_(législateur)',i:1},
{y:-594,t:'Solon — Réformes d\'Athènes',d:'Solon archonte. "Séisachthéia" : abolit l\'esclavage pour dettes, annule les hypothèques. Réforme constitutionnelle. Quatre classes censitaires. Ancêtre direct de la démocratie. Rédige lois plus humaines que celles de Dracon.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Solon',i:2},
{y:-570,t:'Pythagore de Samos',d:'Mathématicien et philosophe mystique. Théorème de Pythagore. Mysticisme des nombres. Métempsycose (transmigration des âmes). Végétarisme. Communauté pythagoricienne à Crotone. Influence sur Platon.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Pythagore',i:2},
{y:-508,t:'Clisthène — Démocratie athénienne',d:'Réformes de Clisthène créent la démocratie (demos + kratos = pouvoir du peuple). Assemblée des citoyens (Ekklesia). Division en 10 tribus artificielles (géographiques). Ostracisme. Modèle politique mondial.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Clist%C3%A8ne_d%27Ath%C3%A8nes',i:3},
{y:-500,t:'Héraclite d\'Éphèse — Le logos',d:'"On ne se baigne pas deux fois dans le même fleuve." Logos comme principe universel d\'ordre et de raison. Dialectique des contraires. Feu comme élément primordial. Influence sur le Stoïcisme, Hegel, et la philosophie du logos johannique.',tr:'greece',w:'https://fr.wikipedia.org/wiki/H%C3%A9raclite',i:2},
{y:-490,t:'Bataille de Marathon — Victoire grecque',d:'10 000 Athéniens défont 25 000 Perses de Darius Ier. Pheidippides court 42 km pour annoncer la victoire (naissance du marathon). Charnière : la liberté grecque sauvée.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Bataille_de_Marathon',i:3},
{y:-480,t:'Thermopyles, Salamine, Platée',d:'300 Spartiates (Leonidas) tiennent les Thermopyles. Victoire navale de Thémistocle à Salamine. Victoire terrestre à Platée (479). Grèce sauve sa liberté et sa culture de l\'Empire perse. Point tournant de la civilisation.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Bataille_des_Thermopyles',i:3},
{y:-461,t:'Âge de Périclès — Athènes dorée',d:'Périclès dirige Athènes ~30 ans. Parthénon, Acropole. Sophocle, Euripide, Aristophane. Hérodote, Thucydide. Socrate. Démocratie accomplie. Archê athénienne (empire maritime). Modèle de "démocratie".',tr:'greece',w:'https://fr.wikipedia.org/wiki/P%C3%A9ricl%C3%A8s',i:3},
{y:-447,t:'Construction du Parthénon',d:'Ictinos et Callicrate sous Phidias construisent le Parthénon à l\'Acropole d\'Athènes. Statue d\'Athéna Parthénos (chryséléphantine). Symbole absolu de la civilisation gréco-occidentale.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Parth%C3%A9non',i:2},
{y:-431,t:'Guerre du Péloponnèse',d:'Athènes vs Sparte (431-404). Thucydide l\'historise avec rigueur scientifique. Peste d\'Athènes. Défaite d\'Athènes. Fin de l\'hégémonie athénienne. Déclin des cités grecques.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Guerre_du_P%C3%A9loponn%C3%A8se',i:3},
{y:-399,t:'Mort de Socrate — Père de la philosophie morale',d:'Socrate condamné à mort pour impiété et corruption de la jeunesse. Boit la ciguë. Refuse de fuir. Son courage et sa philosophie du dialogue (maïeutique) influencent tout l\'Occident. "Connais-toi toi-même."',tr:'greece',w:'https://fr.wikipedia.org/wiki/Socrate',i:3},
{y:-387,t:'Platon — L\'Académie et les Idées',d:'Platon fonde l\'Académie (première institution d\'enseignement supérieur, ouverte ~900 ans). La République, allégorie de la caverne. Monde des Idées. Influence directe sur Philon d\'Alexandrie et la pensée chrétienne.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Platon',i:3},
{y:-343,t:'Aristote — Précepteur d\'Alexandre',d:'Aristote, disciple de Platon, devient le précepteur du jeune Alexandre (13 ans). Biologie, logique (syllogisme), éthique, politique, métaphysique, poétique. "Père de la philosophie occidentale." Fondateur du Lycée.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Aristote',i:3},
{y:-338,t:'Philippe II bat les Grecs à Chéronée',d:'Philippe II de Macédoine écrase la Ligue corinthienne (Athènes, Thèbes, Démosthène). La Macédoine domine la Grèce. Fin de l\'indépendance des cités grecques. Son fils Alexandre va conquérir le monde.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Philippe_II_de_Mac%C3%A9doine',i:3},
{y:-336,t:'Alexandre le Grand — Conquête du monde',d:'Alexandre III de Macédoine. 13 ans de conquêtes : Perse (Gaugamèles 331), Égypte (332), Inde (326). Fondation de 20 Alexandries. Mort à Babylone à 32 ans. Diffuse la culture grecque (hellénisme) en Orient.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Alexandre_le_Grand',i:3},
{y:-323,t:'Mort d\'Alexandre — Ère hellénistique',d:'Mort d\'Alexandre à Babylone. Ses généraux (Diadoques) se disputent l\'empire pendant 40 ans. Début de l\'ère hellénistique. Culture grecque mêlée aux cultures locales. Judée parmi les territoires disputés.',tr:'greece',w:'https://fr.wikipedia.org/wiki/P%C3%A9riode_hell%C3%A9nistique',i:3},
{y:-300,t:'Stoïcisme — Zénon de Citium',d:'Zénon de Citium (de Chypre, peut-être d\'origine phénicienne) fonde le Stoïcisme à l\'Agora d\'Athènes. Raison, vertu, indifférence aux passions. Cosmopolitisme. Influence profonde sur le judaïsme hellénistique et Paul de Tarse.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Sto%C3%AFcisme',i:3},
{y:-300,t:'Épicure — L\'Épicurisme',d:'"Au Jardin." Bonheur (ataraxie) = absence de douleur. Amitié. Éviter la politique. Pas de peur des dieux. "Apiqoros" en hébreu = terme désignant un hérétique ou libre-penseur (connotation péjorative).',tr:'greece',w:'https://fr.wikipedia.org/wiki/%C3%89picure',i:2},
{y:-168,t:'Rome bat la Macédoine à Pydna',d:'Lucius Aemilius Paullus écrase Persée de Macédoine. Fin du Royaume de Macédoine indépendant. Début de la domination romaine sur la Grèce.',tr:'greece',w:'https://fr.wikipedia.org/wiki/Bataille_de_Pydna',i:2},
{y:-146,t:'Rome détruit Corinthe — Grèce province romaine',d:'Lucius Mummius rase Corinthe. La Grèce devient province romaine (Achaïe). Fin de l\'indépendance politique grecque. Mais : la culture grecque "conquiert" Rome (Horace : "Graecia capta ferum victorem cepit").',tr:'greece',w:'https://fr.wikipedia.org/wiki/Destruction_de_Corinthe',i:2},

// ══════════════════════════════════════════
// ROME (rome)
// ══════════════════════════════════════════
{y:-753,t:'Fondation de Rome (tradition)',d:'Romulus et Rémus, jumeaux allaités par une louve, fondent Rome le 21 avril sur le Palatin. Enlèvement des Sabines. Sept rois légendaires. Origine de la fête du Parilia. En réalité, villages latins depuis ~1000 AEC.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Fondation_de_Rome',i:3},
{y:-509,t:'République romaine — SPQR',d:'Expulsion du roi Tarquin le Superbe après le viol de Lucrèce. Fondation de la République. Deux consuls élus chaque année. Sénat. Tribuns de la plèbe. "SPQR" (Senatus PopulusQue Romanus). Début de l\'expansion.',tr:'rome',w:'https://fr.wikipedia.org/wiki/R%C3%A9publique_romaine',i:3},
{y:-450,t:'Loi des Douze Tables',d:'Premier code de lois romain écrit. Accessible à tous. Base du droit romain (et occidental). Étape vers l\'égalité patriciens/plébéiens. Précurseur du concept de "loi écrite" universelle.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Loi_des_Douze_Tables',i:2},
