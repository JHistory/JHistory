// ══════════════════════════════════════════════════════════
{y:1516,t:'Juifs à Venise — Ghetto et imprimerie',d:'Ghetto de Venise (1516). Mais grande activité intellectuelle : Daniel Bomberg imprime le Talmud complet (1519-1523), pagination encore utilisée. Venise = capitale de l\'édition hébraïque mondiale au XVIe s.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Ghetto_de_Venise',i:3},
{y:1550,t:'Amsterdam — Jérusalem du Nord',d:'Après 1597, des Marranes portugais s\'installent à Amsterdam. Liberté relative. Grande synagogue portugaise (Esnoga, 1675). Spinoza, Menasseh ben Israel. Presses hébraïques. Amsterdam = "Jérusalem du Nord". Communauté très cultivée.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Juifs_d%27Amsterdam',i:3},
{y:1648,t:'Conseil des Quatre Pays — Autonomie juive polonaise',d:'Le Va\'ad Arba\'ah Aratsot (Conseil des Quatre Pays) régit les communautés juives de Pologne-Lituanie depuis ~1580. Fiscalité, justice, éducation. Supprimé en 1764. La Pologne abrite 750 000 Juifs en 1650 — la moitié du judaïsme mondial.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Conseil_des_Quatre_Pays',i:2},
{y:1654,t:'Premiers Juifs à New Amsterdam (New York)',d:'23 Juifs séfarades de Recife arrivent à Nouvelle Amsterdam (1654). Peter Stuyvesant les veut expulser. La WIC les protège. Congregation Shearith Israel fondée (1655, encore active). Début de la plus grande communauté juive du monde.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Congregation_Shearith_Israel',i:3},
{y:1700,t:'Pologne-Lituanie — 1 million de Juifs',d:'Vers 1700, la Pologne-Lituanie compte ~750 000 Juifs, bientôt 1 million. Kehilot autonomes, yeshivot, culture yiddish florissante. Centre absolu du judaïsme mondial malgré les traumatismes (Khmelnitski, invasions suédoises).',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Pologne',i:3},
{y:1780,t:'Édit de Tolérance de Joseph II — Autriche',d:'Joseph II d\'Autriche publie l\'Édit de Tolérance (1782) : les Juifs peuvent accéder aux universités et à davantage de métiers. Frédéric II de Prusse maintient des restrictions mais tolère les Juifs "utiles". Prémices de l\'émancipation.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Édit_de_tolérance_de_Joseph_II',i:2},
{y:1791,t:'Zone de Résidence — Russie tsariste',d:'Catherine II crée la Zone de Résidence (Tcherta Osedlosti, 1791). Les Juifs confinés dans les gouvernements occidentaux (Pologne, Lituanie, Ukraine, Bessarabie). Interdiction de vivre dans la Russie intérieure. En vigueur jusqu\'en 1917.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Zone_de_résidence',i:3},
{y:1820,t:'Communautés juives dans les Amériques',d:'Les communautés juives se développent : États-Unis (New York, Charleston, Philadelphia), Brésil, Argentine. L\'immigration ashkénaze de Russie commence dans les années 1880. New York sera la plus grande ville juive du monde.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_aux_États-Unis',i:2},
{y:1840,t:'Juifs de Russie — Pogroms et émancipation impossible',d:'Nicolas Ier de Russie (1825-1855) maintient la Zone de Résidence, force des enfants juifs dans l\'armée (Cantonistes) pour les convertir. Alexandre II libéralise partiellement (1856-1881). L\'assassinat d\'Alexandre II déclenche les pogroms.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Cantonistes',i:2},
{y:1881,t:'Grande émigration juive — 2 millions vers l\'Amérique',d:'À partir de 1881, les pogroms russes déclenchent la grande migration. 2 millions de Juifs quittent l\'Empire russe pour les États-Unis entre 1881 et 1914. Ellis Island. New York, Chicago, Philadelphie. Transformation du judaïsme mondial.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Immigration_juive_aux_États-Unis',i:3},
{y:1858,t:'Affaire Mortara — Enlèvement d\'un enfant juif',d:'Edgardo Mortara, enfant juif de Bologne baptisé en secret, enlevé par les autorités pontificales (1858). Pie IX refuse de le rendre. Indignation mondiale. Catalyseur de la cause libérale et anticléricale en Italie. Fondation de l\'AIU deux ans plus tard.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Affaire_Mortara',i:2},
// ══════════════════════════════════════════════════════════
// JUDAÏSME SÉFARADE POST-1492 (j_seph)
// ══════════════════════════════════════════════════════════
{y:1492,t:'EXPULSION D\'ESPAGNE — Naissance de la diaspora séfarade',d:'Ferdinand et Isabelle signent l\'Édit d\'Alhambra (31 mars 1492). Entre 150 000 et 300 000 Juifs quittent l\'Espagne. Portugal, Italie, Balkans ottomans, Afrique du Nord. Fin d\'une présence millénaire. Le ladino (judéo-espagnol) survivra cinq siècles.',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_d%27Espagne',i:3},
{y:1497,t:'Expulsion du Portugal — Marranes forcés',d:'Manuel Ier refuse de laisser les Juifs partir. Conversions forcées en masse (1497). Naissance des Cristãos-Novos (Nouveaux Chrétiens / Marranes). Leur diaspora : Amsterdam, Brésil, Bordeaux. Maintiennent parfois le judaïsme en secret pendant des générations.',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Expulsion_des_Juifs_du_Portugal',i:3},
{y:1555,t:'Salonique — Capitale mondiale séfarade',d:'Salonique (Empire ottoman) majoritairement juive au XVIe s. (60% de la population). Presses hébraïques. Talmud Torah. Communautés organisées par ville d\'origine espagnole. Langue ladino. Commerce méditerranéen florissant. "Jérusalem des Balkans".',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_à_Thessalonique',i:3},
{y:1553,t:'Doña Gracia Mendes Nasi — Grande mécène',d:'Gracia Mendes Nasi (1510-1569) organise un réseau secret d\'aide aux Marranes à travers l\'Europe. Sa "route souterraine" protège des milliers de fuyards. À Constantinople, négocie avec Soliman le Magnifique. Symbole de la résistance séfarade.',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Gracia_Mendes_Nasi',i:3},
{y:1648,t:'Juifs du Maghreb — Entre Maroc et Ottomans',d:'Les communautés juives du Maroc (sous les Saadiens puis les Alaouites), d\'Algérie et de Tunisie mêlent réfugiés espagnols (Megorashim) et Juifs locaux (Toshavim). Tensions et enrichissement mutuel. Les Juifs jouent un rôle diplomatique (ambassadeurs au Maroc).',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_au_Maroc',i:2},
{y:1700,t:'Juifs ottomans — Millet et prospérité',d:'Les Juifs de l\'Empire ottoman (Balkans, Anatolie, Levant) sous le système de millet (autonomie communautaire). Le Hakham Bachi de Constantinople reconnu officiellement. Salonique, Istanbul, Smyrne, Jérusalem : centres actifs.',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Millet_(Empire_ottoman)',i:2},
{y:1840,t:'Alliance Israélite — Modernisation des Séfarades',d:'L\'AIU (1860) ouvre ses premières écoles à Tétouan (1862) puis dans tout le monde séfarade. Modernisation rapide : français, sciences, rupture avec le judaïsme traditionnel local. Réseau de 183 écoles en 1914.',tr:'j_seph',w:'https://fr.wikipedia.org/wiki/Alliance_israélite_universelle',i:2},
// ══════════════════════════════════════════════════════════
// JUDAÏSME ASHKÉNAZE & HASSIDISME (j_ashk) — 1096–1900
// ══════════════════════════════════════════════════════════
{y:1096,t:'Massacres rhénans — Martyrologie ashkénaze',d:'Les croisés du Rhin massacrent les communautés juives de Speyer, Worms, Mayence, Cologne (1096). Des milliers de morts, certains se suicident pour éviter le baptême (Kiddoush Hashem). La littérature du martyre ashkénaze naît. Chroniques de Rabbi Eliezer bar Nathan.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Massacre_de_Juifs_lors_de_la_première_croisade',i:3},
{y:1040,t:'RACHI — Commentateur universel',d:'Shlomo Yitzhaki (Rachi, 1040-1105), né à Troyes. Son commentaire de la Bible et du Talmud est le plus lu de la littérature rabbinique. Langue claire, pédagogique. Fondateur de l\'exégèse ashkénaze. Étudié dans toutes les yeshivot depuis 900 ans.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Rachi',i:3},
{y:1100,t:'Tossafistes — Disciples de Rachi',d:'Les Tossafistes (Ba\'alei HaTossafot) : petits-fils et élèves de Rachi (Rabbenu Tam, Ri le Vieux). Commentent le Talmud de façon dialectique dans les yeshivot de France et d\'Allemagne (XIIe-XIIIe s). Fondent la méthode talmudique ashkénaze.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Tossafistes',i:2},
{y:1150,t:'Hassidisme allemand (Hassidei Ashkenaz)',d:'Mouvement mystique et ascétique en Rhénanie (XIIe-XIIIe s). Rabbi Yehoudah HeHassid, Sefer Hassidim. Piété intérieure, conscience morale. Précurseur du hassidisme polonais du XVIIIe s.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Hassidei_Ashkenaz',i:2},
{y:1520,t:'Moïse Isserles — Halakha ashkénaze',d:'Rabbi Moïse Isserles (Rema, 1520-1572), de Cracovie. Ajoute la Mappah au Shulhan Aroukh de Caro (1569) : intègre les coutumes ashkénazes. "Caro a dressé la table, Isserles l\'a recouverte". Ensemble ils définissent la halakha mondiale.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Moïse_Isserles',i:3},
{y:1648,t:'Khmelnitski — Catastrophe de l\'Ukraine juive',d:'Massacres de Khmelnitski (1648-1649) : des centaines de communautés ukrainiennes dévastées. Exode vers l\'Ouest. Traumatisme fondateur qui favorise le messianisme de Sabbataï Tsevi (1665).',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Massacres_de_Khmelnitski',i:3},
{y:1700,t:'Baal Shem Tov — Révolution hassidique',d:'Le BeSHT (1700-1760) bouleverse l\'ashkénazisme. Contre l\'élitisme talmudique froid. Pour la joie, la danse, le récit, l\'amour de D. accessible à tous. Ses disciples forment les grandes dynasties. La Pologne, l\'Ukraine et la Galicie deviennent hassidiques.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Baal_Shem_Tov',i:3},
{y:1745,t:'Rabbi Shneur Zalman — Chabad-Loubavitch',d:'Shneur Zalman de Liadi (1745-1812). Tanya (1797) : synthèse mystique et intellectuelle. Fondateur du Chabad. Arrêté et libéré par les Russes (1798, 1800). Le Chabad est aujourd\'hui le mouvement hassidique le plus actif dans le monde.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Shneur_Zalman_de_Liadi',i:3},
{y:1760,t:'Dov Baer de Mezeritch — Grand Maggid',d:'Dov Baer (mort 1772), successeur du BeSHT. Systématise le hassidisme. Forme les grandes dynasties : Chabad (Shneur Zalman), Karlin, Bratslav, Rizhyn... Son académie à Mezeritch transforme le mouvement.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Dov_Baer_de_Mezeritch',i:2},
{y:1772,t:'Nahman de Bratslav',d:'Nahman de Bratslav (1772-1810), arrière-petit-fils du BeSHT. Ses contes hassidiques (Sipourei Maassiyot) : chefs-d\'œuvre mystiques. Bratslav = seule grande dynastie hassidique sans successeur (les "Morts", "Totes Hassidim").',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Nahman_de_Bratslav',i:3},
{y:1803,t:'Yeshiva de Volozhin — Modèle litvaïn',d:'Rabbi Hayyim de Volozhin (disciple du GRA) fonde la grande yeshiva de Volozhin (1803). Étude intensive du Talmud, autonomie institutionnelle. Matrice de l\'orthodoxie litvaïne (Mitnagdim). Fermée par la Russie tsariste (1892). Modèle copié mondialement.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Yeshiva_de_Volozhin',i:3},
{y:1810,t:'Mouvement Musar — Éthique talmudique',d:'Rabbi Israël Salanter (1810-1883) fonde le mouvement Musar dans les yeshivot litvaïnes. L\'étude ne suffit pas : travail du caractère moral (tikoun hamiddot). Révolution pédagogique dans le monde des yeshivot. Grandes yeshivot de Musar : Kelm, Slabodka, Novaradok.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Mouvement_Musar',i:2},
{y:1880,t:'Bund — Mouvement ouvrier juif',d:'L\'Allgemeiner Yidisher Arbeter Bund (Bund), fondé à Vilna (1897). Socialisme laïque + identité nationale yiddish (non sioniste). Concurrent du sionisme pour les masses juives d\'Europe de l\'Est. "Doïkayt" : ici, là où on est.',tr:'j_ashk',w:'https://fr.wikipedia.org/wiki/Bund',i:3},
// ══════════════════════════════════════════════════════════
// MOUVEMENTS MODERNES (j_mod) — 1780–1900
// ══════════════════════════════════════════════════════════
{y:1782,t:'Haskalah — Lumières juives',d:'Le mouvement Haskalah, initié par Mendelssohn et ses maskils, prône la modernisation : éducation séculière, langues nationales, intégration civique. Centres à Berlin, Königsberg, Vienne, Galicie, puis Russie (Odessa, Vilna).',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Haskalah',i:3},
{y:1820,t:'Hatam Sofer — Résistance à tout changement',d:'Moses Sofer (Chatam Sofer, 1762-1839). "Hadash assur min HaTorah" (tout nouveau est interdit). Fondateur de l\'orthodoxie hongroise ultra-conservatrice. Ses réponses (Teshuvot) définissent la frontière entre Orthodoxie et Réforme.',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Hatam_Sofer',i:3},
{y:1818,t:'Réforme de Hambourg — Synagogue réformée',d:'Synagogue réformée de Hamburg (1818) : orgue, prières en allemand, sermon. Abraham Geiger théorise. Synodes de Brunswick (1844), Frankfurt (1845). Plateforme de Pittsburgh (1885) aux USA. Judaïsme réformé mondial.',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:3},
{y:1845,t:'Judaïsme positif-historique — Précurseur massorti',d:'Zacharias Frankel quitte la conférence de Frankfurt (1845). Fonde le "judaïsme positif-historique" : halakha normative mais méthode historique. Séminaire de Breslau (1854). Ancêtre du mouvement Massorti/Conservateur américain.',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Zacharias_Frankel',i:2},
{y:1875,t:'Hebrew Union College — Réforme américaine',d:'Isaac Mayer Wise fonde l\'UAHC et le HUC à Cincinnati (1875). La Réforme américaine est plus radicale que l\'allemande : prières en anglais, port de la kippa optionnel, lois alimentaires supprimées. Pittsburgh Platform (1885).',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Isaac_Mayer_Wise',i:2},
{y:1896,t:'HERZL — L\'État Juif (Der Judenstaat)',d:'Theodor Herzl publie Der Judenstaat (1896). "Les Juifs sont un peuple, un seul peuple." Seul un État résoudra l\'antisémitisme. Le sionisme politique est né. Congrès de Bâle (1897). "Si vous le voulez, ce n\'est pas un rêve."',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/L%27État_juif',i:3},
{y:1897,t:'Bund — Alternative socialiste au Sionisme',d:'Le Bund (fondé à Vilna, 1897) et le Sionisme (Bâle, 1897) naissent la même année. Deux visions opposées de l\'avenir juif : diaspora yiddish socialiste vs État juif en Palestine. Débat structurant du XXe s.',tr:'j_mod',w:'https://fr.wikipedia.org/wiki/Bund',i:2},
// ══════════════════════════════════════════════════════════
// EMPIRE OTTOMAN (ottoman) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1520,t:'Soliman le Magnifique — Apogée ottoman',d:'Soliman Ier (1520-1566). Apogée de l\'Empire ottoman : prise de Rhodes (1522), siège de Vienne (1529), victoire de Mohács (1526). Reconstruit les murailles de Jérusalem. Législation (Kanuni). Les Juifs séfarades prospèrent.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Soliman_le_Magnifique',i:3},
{y:1571,t:'Bataille de Lépante — Fin de l\'expansion en Méditerranée',d:'La flotte ottomane détruite par la Sainte Ligue à Lépante (7 oct. 1571). Don Juan d\'Autriche vainqueur. Cervantes blessé. Fin de l\'expansion ottomane en Méditerranée occidentale. Tournant de l\'histoire méditerranéenne.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Bataille_de_Lépante',i:3},
{y:1683,t:'Siège de Vienne (2e) — Reflux ottoman',d:'Kara Mustafa assiège Vienne (juillet-sept. 1683). Jan Sobieski de Pologne sauve la ville (12 sept). Début du reflux ottoman. Traité de Karlowitz (1699) : perte de la Hongrie. Les Juifs de l\'Empire suivent les destins changeants.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Siège_de_Vienne_(1683)',i:3},
{y:1700,t:'Juifs ottomans — Salonique, Istanbul, Smyrne',d:'Les grandes communautés juives : Salonique (majorité juive), Istanbul (premier siège du Hakham Bachi), Smyrne (Izmir), Jérusalem, Safed. Langue : ladino. Commerce méditerranéen. Sous protection du millet.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Millet_(Empire_ottoman)',i:2},
{y:1774,t:'Traité de Küçük-Kaynarca — Début du déclin',d:'Traité de Küçük-Kaynarca (1774) avec la Russie. L\'Empire cède la Crimée. La Russie se pose en protectrice des chrétiens orthodoxes ottomans. Début de la "Question d\'Orient". L\'Empire malade de l\'Europe.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Traité_de_Küçük-Kaynarca',i:2},
{y:1839,t:'Tanzimat — Égalité des minorités',d:'Sultan Abdülmecid Ier publie l\'Édit de Gülhane (Tanzimat, 1839). Égalité de tous les sujets ottomans quelle que soit leur religion. Les Juifs ottomans — Séfarades, Karaïtes, Romaniotas — bénéficient de l\'égalité légale.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Tanzimat',i:3},
{y:1878,t:'Congrès de Berlin — Balkans réorganisés',d:'Le Congrès de Berlin (1878) réorganise les Balkans après la guerre russo-turque. Indépendance de la Bulgarie, Roumanie, Serbie. L\'Empire ottoman perd de nombreux territoires. Les communautés juives balkaniques changent de souveraineté.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Congrès_de_Berlin_(1878)',i:2},
{y:1882,t:'Première Aliya — Palestine ottomane',d:'La Première Aliya (1882-1903) : ~25 000 Juifs arrivent en Palestine ottomane (Bilou, puis immigrants russes). Rishon LeZion, Petah Tikva, Rosh Pina. Edmond de Rothschild finance. Tensions avec les fellahin arabes et les autorités ottomanes.',tr:'ottoman',w:'https://fr.wikipedia.org/wiki/Première_Aliyah',i:3},
// ══════════════════════════════════════════════════════════
// EUROPE DE L'OUEST (eu_west) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1517,t:'MARTIN LUTHER — Réforme protestante',d:'Les 95 Thèses de Luther (31 oct. 1517) brisent l\'unité catholique. Au début favorable aux Juifs ("Jésus était juif", 1523). Déçu de leur non-conversion, il écrit "Des Juifs et de leurs mensonges" (1543) — pamphlet virulent qui influence l\'antisémitisme moderne.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Martin_Luther',i:3},
{y:1543,t:'Copernic — Révolution héliocentrique',d:'Nicolas Copernic publie De revolutionibus (1543). Héliocentrisme. Révolution scientifique. David Gans (élève du Maharal de Prague) discute avec Brahe et Kepler. L\'astronomie hébraïque rejoint la science européenne.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Nicolas_Copernic',i:3},
{y:1572,t:'Massacre de la Saint-Barthélemy',d:'Charles IX et Catherine de Médicis ordonnent le massacre des Huguenots (24 août 1572). 5 000-30 000 protestants tués. Guerres de Religion françaises (1562-1598). Les Juifs de France observent — toujours absents après l\'expulsion de 1394.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Massacre_de_la_Saint-Barthélemy',i:3},
{y:1598,t:'Édit de Nantes — Tolérance protestante',d:'Henri IV signe l\'Édit de Nantes (1598). Liberté de culte pour les Huguenots. Modèle de tolérance. Sa révocation par Louis XIV (1685) chasse 300 000 Huguenots — dont beaucoup vers la Prusse et les Pays-Bas.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Édit_de_Nantes',i:3},
{y:1618,t:'Guerre de Trente Ans — Catastrophe européenne',d:'Guerre de Trente Ans (1618-1648) : conflit religieux qui dévaste l\'Allemagne (perd 30% de sa population). Paix de Westphalie (1648) : naissance du système des États-nations souverains. Sécularisation de la politique.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Guerre_de_Trente_Ans',i:3},
{y:1687,t:'Newton — Principia Mathematica',d:'Isaac Newton publie les Principia Mathematica (1687). Lois du mouvement, gravitation universelle. Révolution scientifique complète. Newton, lui-même lecteur intense de la Bible hébraïque, s\'intéresse à la chronologie biblique.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Philosophiae_Naturalis_Principia_Mathematica',i:3},
{y:1715,t:'Lumières françaises — Voltaire, Rousseau, Diderot',d:'La mort de Louis XIV (1715) ouvre l\'ère des Philosophes. Voltaire (antisémite malgré lui), Rousseau, Montesquieu, Diderot. L\'Encyclopédie (1751-1772). Les Lumières posent les bases de l\'émancipation mais aussi de l\'anticléricalisme.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Siècle_des_Lumières',i:3},
{y:1789,t:'RÉVOLUTION FRANÇAISE — Droits de l\'Homme',d:'Déclaration des droits de l\'Homme (1789). Abolition des privilèges (4 août). Émancipation des Juifs (1791). Napoléon codifie et exporte la Révolution. Modèle d\'émancipation pour les Juifs d\'Europe.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Révolution_française',i:3},
{y:1815,t:'Congrès de Vienne — Réaction conservatrice',d:'Le Congrès de Vienne (1814-1815) restaure l\'ordre monarchique. Les Juifs perdent certains droits acquis sous Napoléon (en Allemagne, Italie). Mais la graine de l\'émancipation est plantée. Metternich, Talleyrand, Tsar Alexandre Ier.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Congrès_de_Vienne',i:3},
{y:1848,t:'Printemps des Peuples',d:'Révolutions de 1848 en France, Allemagne, Autriche, Hongrie, Italie. Les Juifs obtiennent des droits civiques dans plusieurs pays. Gabriel Riesser, premier député juif au Parlement de Francfort. La réaction de 1849-1852 annule beaucoup d\'acquis.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Révolutions_de_1848',i:3},
{y:1871,t:'Unification allemande — Bismarck',d:'Bismarck fonde le Second Reich (18 jan. 1871). Émancipation complète des Juifs d\'Allemagne (1871). Communauté prospère. Mais antisémitisme politique émerge : Stoecker (1879), Treitschke "Les Juifs sont notre malheur". Précurseurs du nazisme.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Empire_allemand',i:3},
{y:1880,t:'Antisémitisme moderne — Un mot nouveau pour une vieille haine',d:'Wilhelm Marr invente le terme "antisémitisme" (1879) pour pseudoscientificiser le rejet des Juifs. Drumont en France (La France juive, 1886). Parti antisémite de Schönerer en Autriche (influence sur Hitler). L\'antisémitisme devient idéologie politique.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Antisémitisme',i:3},
// ══════════════════════════════════════════════════════════
// RÉFORME & EUROPE PROTESTANTE (eu_ref) — 1517–1900
// ══════════════════════════════════════════════════════════
{y:1517,t:'Luther — Débuts favorables aux Juifs',d:'Luther espère que sa réforme "biblique" convaincra les Juifs. "Jésus était juif" (1523). Déçu par leur refus, il écrit "Des Juifs et de leurs mensonges" (1543) : destruction des synagogues, expulsion, travaux forcés. Pamphlet lu par Goebbels.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Martin_Luther',i:3},
{y:1536,t:'Calvin — Réforme genevoise',d:'Jean Calvin publie l\'Institution de la Religion Chrétienne (1536). Prédestination. Gouverne Genève théocratiquement. Les Réformés (calvinistes) domineront les Pays-Bas, la France (Huguenots), l\'Écosse. Puritains aux États-Unis.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Jean_Calvin',i:3},
{y:1545,t:'Concile de Trente — Contre-Réforme',d:'Concile de Trente (1545-1563) : Contre-Réforme. Réaffirme les dogmes. Inquisition renforcée. Index des livres interdits. Brûlement du Talmud à Rome (1553). Impact négatif sur les Juifs d\'Italie et du Portugal.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Concile_de_Trente',i:3},
{y:1581,t:'Provinces-Unies — République de tolérance relative',d:'Les Pays-Bas indépendants (1581) adoptent une relative tolérance. Accueillent Juifs séfarades (après 1597), anabaptistes, arminiens. Amsterdam = grand centre intellectuel européen. Spinoza y vivra et écrira.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Provinces-Unies',i:3},
{y:1620,t:'Mayflower — Puritains et Ancien Testament',d:'Les Puritains du Mayflower (1620) s\'identifient aux Hébreux de l\'Exode. Nouvelle-Angleterre = Nouvelle Jérusalem. Cette culture biblique protestante favorisera ultérieurement la sympathie américaine pour le sionisme (Balfour).',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Mayflower',i:3},
{y:1648,t:'Cromwell et le retour des Juifs en Angleterre',d:'Oliver Cromwell autorise officieusement le retour des Juifs (1656) après la conférence de Whitehall. Menasseh ben Israel plaide leur cause. Les Juifs reviennent formellement sous Charles II (1664) après 366 ans d\'absence.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/Oliver_Cromwell',i:3},
{y:1738,t:'John Wesley — Méthodisme',d:'John Wesley (1703-1791) fonde le méthodisme (1738). Mouvement d\'évangélisation populaire en Angleterre. Sa lecture intense de l\'Ancien Testament nourrit l\'intérêt protestant pour le peuple d\'Israël et les prophéties.',tr:'eu_ref',w:'https://fr.wikipedia.org/wiki/John_Wesley',i:2},
// ══════════════════════════════════════════════════════════
// EUROPE DE L'EST (eu_east) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1505,t:'Statut de Piotrkow — Autonomie juive en Pologne',d:'Le statut de Piotrkow (1505) accorde aux Juifs de Pologne une large autonomie judiciaire et fiscale. Développement du Conseil des Quatre Pays (Va\'ad Arba\'ah Aratsot, 1580). La Pologne = centre du judaïsme mondial.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Pologne',i:2},
{y:1547,t:'Ivan le Terrible — Premier Tsar',d:'Ivan IV "le Terrible" se proclame Tsar (1547). Oprichnina : terreur d\'État. Conquête de Kazan. La Russie puissance émergente. Politique anti-juive : les Juifs refusés sur les terres russes.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Ivan_IV',i:3},
{y:1569,t:'Union de Lublin — Grande République juive',d:'L\'Union de Lublin (1569) crée la République des Deux Nations (Pologne + Lituanie). 1 million de km². ~500 000 Juifs. Capital du judaïsme ashkénaze avec ses kehilot, yeshivot, culture yiddish.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Union_de_Lublin',i:3},
{y:1648,t:'KHMELNITSKI — Catastrophe juive',d:'Bogdan Khmelnitski (1596-1657), hetman cosaque, révolte contre la Pologne. Les Juifs massacrés massivement (1648-1649). ~100 000-500 000 morts. Communautés entières anéanties. Traumatisme fondateur du judaïsme ashkénaze.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Massacres_de_Khmelnitski',i:3},
{y:1683,t:'Jan Sobieski sauve Vienne — Apogée polonais',d:'Jan III Sobieski sauve Vienne des Ottomans (12 sept. 1683). Apogée politique polonais. Mais déclin rapide : liberum veto paralyse l\'État. Russie, Prusse et Autriche préparent le dépeçage.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Jean_III_Sobieski',i:3},
{y:1696,t:'Pierre le Grand — Modernisation de la Russie',d:'Pierre le Grand (1682-1725) modernise la Russie à l\'occidentale. Saint-Pétersbourg fondée (1703). Victoire sur la Suède (Poltava, 1709). Russie puissance européenne majeure. Maintient l\'exclusion des Juifs.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Pierre_le_Grand',i:3},
{y:1772,t:'Partages de la Pologne — 1 million de Juifs sous domination russe',d:'Trois partages de la Pologne (1772, 1793, 1795) par Russie, Prusse, Autriche. La Pologne disparaît. Des centaines de milliers de Juifs passent sous domination russe. La Russie hérite de la plus grande communauté juive du monde.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Partages_de_la_Pologne',i:3},
{y:1791,t:'Zone de Résidence — Confinement juif en Russie',d:'Catherine II crée la Tcherta Osedlosti (1791). Les Juifs confinés dans les gouvernements occidentaux. En 1897, 5,2 millions de Juifs vivent en Russie dans cette zone. Pauvreté, discrimination, pogroms.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Zone_de_résidence',i:3},
{y:1812,t:'Napoléon et la Russie — Impact sur les Juifs',d:'La campagne de Russie de Napoléon (1812). Les Juifs de la Zone de Résidence : certains espèrent la libération napoléonienne, d\'autres restent loyaux au Tsar. Napoléon perd. Alexandre Ier triomphe. Aucun changement pour les Juifs.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Campagne_de_Russie',i:2},
{y:1863,t:'Insurrection polonaise de janvier — Juifs engagés',d:'L\'insurrection polonaise de janvier 1863 contre la Russie. Des Juifs combattent aux côtés des Polonais (Berek Joselewicz avait déjà combattu en 1794). Répression russe terrible. La Pologne maintient sa conscience nationale.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Insurrection_de_janvier',i:2},
{y:1881,t:'Pogroms — Vague anti-juive en Russie',d:'Après l\'assassinat d\'Alexandre II (1881), pogroms organisés dans le sud de la Russie. Odessa, Kiev, Elizavetgrad. Les Lois de Mai (1882) d\'Alexandre III aggravent les restrictions. Exode massif : 2 millions vers l\'Amérique, premières Aliyot vers la Palestine.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Pogroms_en_Russie',i:3},
{y:1897,t:'Vilna — Capitale de la culture juive ashkénaze',d:'Vilna ("Jérusalem de Lituanie") est à la fin du XIXe s. le centre de la culture juive : yeshivot, presse yiddish, Bund (fondé ici en 1897), YIVO (archives yiddish). Rencontre du traditionalisme et de la modernité.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Vilnius',i:2},
// ══════════════════════════════════════════════════════════
// MAGHREB (maghreb) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1492,t:'Juifs espagnols au Maghreb',d:'Après l\'expulsion de 1492, des dizaines de milliers de Juifs séfarades s\'installent au Maroc, en Algérie, en Tunisie. Tensions avec les Toshavim (Juifs locaux). Apportent ladino, traditions ibériques. Fès, Tétouan, Meknès, Tunis.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_au_Maroc',i:3},
{y:1549,t:'Saadiens au Maroc — Juifs diplomates',d:'Les Saadiens (1549-1659) emploient des Juifs comme diplomates et financiers. Samuel Pallache représente le sultan au Pays-Bas. Les Juifs du Maroc : courtiers entre Europe et monde islamique.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Saadiens',i:2},
{y:1672,t:'Moulay Ismaïl — Protecteur des Juifs',d:'Moulay Ismaïl (1672-1727), sultan alaouite. Les Tujjar al-Sultan (marchands du sultan) sont souvent juifs. Institution propre au Maroc. Fès et Meknès : mellah florissant.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Moulay_Ismaïl',i:2},
{y:1830,t:'Conquête française de l\'Algérie',d:'La France prend Alger (1830). Les Juifs d\'Algérie (~30 000) sont d\'abord méfiants. Le décret Crémieux (1870) leur accorde la citoyenneté française. Rupture avec les Arabes musulmans qui restent sujets. Tension identitaire persistante.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Histoire_de_l%27Algérie_française',i:3},
{y:1864,t:'Alliance Israélite — Écoles au Maghreb',d:'L\'AIU ouvre ses premières écoles au Maroc (Tétouan, 1862), puis Tunisie et Algérie. Modernisation des enfants juifs du Maghreb : français, sciences. Rupture générationnelle avec le judaïsme traditionnel maghrébin.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Alliance_israélite_universelle',i:2},
{y:1881,t:'Protectorat français en Tunisie',d:'La France établit son protectorat sur la Tunisie (1881). Les Juifs de Tunisie (~50 000) obtiennent progressivement des droits. La Hara (quartier juif de Tunis) prospère. L\'élite juive tunisienne adopte la culture française.',tr:'maghreb',w:'https://fr.wikipedia.org/wiki/Protectorat_français_de_Tunisie',i:2},
// ══════════════════════════════════════════════════════════
// INDE & ÉTHIOPIE (india)
// ══════════════════════════════════════════════════════════
{y:72,t:'Juifs de Cochin — Kerala',d:'Communauté juive du Kerala (Inde du Sud), présente depuis l\'Antiquité (commerçants). La plaque de cuivre de Joseph Rabban (XIe s.) : le Raja de Malabar accorde des concessions à la communauté juive. Synagogue de Paradesi (1568).',tr:'india',w:'https://fr.wikipedia.org/wiki/Juifs_de_Cochin',i:2},
{y:300,t:'Beta Israel — Juifs d\'Éthiopie',d:'Les Beta Israel ("Maison d\'Israël"), présents en Éthiopie depuis une date indéterminée. Pratiquent un judaïsme de l\'Ancien Testament (sans Talmud) : Orit (Torah), prêtres (Kesim), fêtes. Persécutions récurrentes par les empereurs chrétiens. Des dizaines de milliers.',tr:'india',w:'https://fr.wikipedia.org/wiki/Bêta_Israël',i:3},
{y:1000,t:'Empire d\'Aksoum — Beta Israel résistants',d:'L\'Empire aksumite (Éthiopie) chrétien depuis le IVe s. La reine Beta Israel Yodit/Gudit dévaste les églises (~960). Les Beta Israel maintiennent leur identité dans les montagnes du Gondar malgré persécutions. Leur isolement les préserve paradoxalement.',tr:'india',w:'https://fr.wikipedia.org/wiki/Bêta_Israël',i:2},
{y:1568,t:'Synagogue de Paradesi — Cochin',d:'La synagogue de Paradesi à Cochin (1568), la plus ancienne synagogue en activité du Commonwealth. Les Juifs "blancs" (séfarades et européens) y prient. Les Juifs "noirs" (Malabari) ont leur propre synagogue. Relations complexes entre ces deux groupes.',tr:'india',w:'https://fr.wikipedia.org/wiki/Synagogue_de_Paradesi',i:2},
{y:1800,t:'David Sassoon — Juifs de Bagdad à Bombay',d:'David Sassoon (1792-1864), marchand juif de Bagdad, s\'installe à Bombay (1832). Crée un empire commercial (Sassoon & Sons). Aide les Bene Israel à s\'intégrer au judaïsme normatif. "Rothschild de l\'Orient". Construit synagogues et écoles.',tr:'india',w:'https://fr.wikipedia.org/wiki/David_Sassoon',i:2},
{y:1862,t:'Beta Israel — Missionnaires et crise',d:'Missionnaires anglicans tentent de convertir les Beta Israel d\'Éthiopie. Quelques milliers deviennent "Falashmura" (convertis). La majorité maintient son identité juive malgré l\'isolement et les pressions. Joseph Halévy (1867) et Jacques Faitlovitch (1904) les "redécouvrent".',tr:'india',w:'https://fr.wikipedia.org/wiki/Bêta_Israël',i:2},
// ══════════════════════════════════════════════════════════
// AMÉRIQUES (americas) — 1492–1900
// ══════════════════════════════════════════════════════════
{y:1492,t:'Colomb — Interprète juif converso',d:'Colomb part le 3 août 1492 (lendemain de l\'expulsion des Juifs d\'Espagne). Son interprète Luis de Torres (Jacob Halévi converti) est parmi les premiers à poser pied sur Cuba. Des Marranes participent aux premières expéditions en Amérique.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Christophe_Colomb',i:3},
{y:1530,t:'Inquisition en Amérique — Marranes persécutés',d:'L\'Inquisition suit les Marranes en Amérique : procès au Mexique (1528), Lima (1570), Carthagène. Des Marranes maintiennent des pratiques juives secrètes pendant des générations. Premiers "anousim" (forcés) américains.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Inquisition_au_Mexique',i:2},
{y:1636,t:'Synagogue Kahal Zur Israel — Recife (Brésil)',d:'Quand les Hollandais contrôlent Recife (1630-1654), les Juifs séfarades viennent d\'Amsterdam. Synagogue Kahal Zur Israel (1636) : la plus ancienne de l\'hémisphère occidental. À la reconquête portugaise (1654), fuient vers la Jamaïque, Barbade, et New York.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Synagogue_Kahal_Zur_Israel',i:3},
{y:1654,t:'Premiers Juifs à New York — Shearith Israel',d:'23 Juifs séfarades de Recife arrivent à Nouvelle Amsterdam (1654). Stuyvesant veut les expulser. La WIC protège. Congregation Shearith Israel (1655, la plus ancienne synagogue américaine encore active). Fondation de la communauté juive new-yorkaise.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Congregation_Shearith_Israel',i:3},
{y:1763,t:'Synagogue Touro — Newport, Rhode Island',d:'Synagogue Touro de Newport, Rhode Island (1763, la plus ancienne synagogue debout aux États-Unis). George Washington lui écrira une lettre fameuse (1790) : "le gouvernement des États-Unis ne sanctionne pas la tolérance, comme si c\'était la tolérance d\'une classe par une autre."',tr:'americas',w:'https://fr.wikipedia.org/wiki/Synagogue_Touro',i:2},
{y:1776,t:'Révolution américaine — Égalité religieuse',d:'Haym Salomon, financier juif polonais, finance l\'armée continentale. La Constitution américaine (1787) interdit tout test religieux pour les fonctions fédérales. Premier pays à garantir constitutionnellement l\'égalité civique des Juifs.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Haym_Salomon',i:3},
{y:1820,t:'Réforme juive en Amérique — Charleston',d:'Beth Elohim de Charleston (1824) : premières réformes liturgiques en Amérique (anglais, sermons). Isaac Mayer Wise arrive (1846). Hebrew Union College à Cincinnati (1875). L\'Amérique devient le laboratoire du judaïsme réformé.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:2},
{y:1880,t:'Grande immigration ashkénaze en Amérique',d:'Entre 1880 et 1924, 2 millions de Juifs d\'Europe de l\'Est arrivent aux États-Unis. Ellis Island. Lower East Side de Manhattan. Yiddish, syndicats (ILGWU), théâtre, presse yiddish. "Goldene Medina" (pays d\'or). New York = plus grande ville juive du monde.',tr:'americas',w:'https://fr.wikipedia.org/wiki/Immigration_juive_aux_États-Unis',i:3},

// ══════════════════════════════════════════════════════════
// SIONISME & MANDAT BRITANNIQUE (zionism) — 1897-1948
// ══════════════════════════════════════════════════════════
{y:1897,t:'Premier Congrès sioniste — Bâle',d:'Theodor Herzl réunit le 1er Congrès sioniste à Bâle (29-31 août 1897). Fondation de l\'Organisation sioniste mondiale. Programme de Bâle : établir en Palestine un foyer légalement assuré pour le peuple juif. Herzl écrit dans son journal : "À Bâle, j\'ai fondé l\'État juif."',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Premier_Congrès_sioniste',i:3},
{y:1901,t:'Fonds National Juif — Keren Kayemeth',d:'Le Fonds National Juif (KKL/JNF) fondé au 5e Congrès sioniste. Rachète des terres en Palestine. Finance le reboisement. Outil central de la colonisation sioniste.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Fonds_national_juif',i:2},
{y:1904,t:'Deuxième Aliya — Pionniers socialistes',d:'2e Aliya (1904-1914) : environ 35 000 Juifs, surtout de Russie post-pogroms. David Ben Gourion, Itzhak Ben-Zvi. Idéologie du travail hébreu. Fondation de Tel-Aviv (1909) et du premier kibboutz (Degania, 1910).',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Deuxième_Aliyah',i:3},
{y:1909,t:'Fondation de Tel-Aviv',d:'66 familles juives tirent au sort des parcelles de sable au nord de Jaffa (11 avril 1909). Tel-Aviv ("Colline du Printemps"). Première ville entièrement hébraïque moderne. Aura 400 000 habitants en 1948.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Tel_Aviv',i:3},
{y:1910,t:'Fondation de Degania — Premier Kibboutz',d:'Degania Aleph, première kvoutsa (1910). Au bord du lac de Tibériade. Modèle du kibboutz : propriété collective, égalité, travail agricole.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Degania_Aleph',i:2},
{y:1917,t:'DÉCLARATION BALFOUR',d:'Lord Balfour (2 nov. 1917) : "Le gouvernement de Sa Majesté envisage favorablement l\'établissement en Palestine d\'un foyer national pour le peuple juif." Acte fondateur du sionisme politique international.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Déclaration_Balfour',i:3},
{y:1920,t:'Mandat britannique sur la Palestine — SDN',d:'La SDN confie le Mandat sur la Palestine à la Grande-Bretagne (formalisé 1922). Le texte incorpore la Déclaration Balfour. Haj Amin al-Husseini nommé Grand Mufti de Jérusalem.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Mandat_britannique_en_Palestine',i:3},
{y:1921,t:'Haganah fondée',d:'La Haganah (Défense) fondée en 1920-21 pour protéger les colonies juives après les émeutes arabes. Organisation semi-clandestine sous le Mandat. Deviendra le noyau de Tsahal en 1948.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Haganah',i:3},
{y:1929,t:'Massacre d\'Hébron',d:'Émeutes arabes en Palestine (août 1929). Le 23 août, massacre de la communauté juive d\'Hébron : 67 Juifs tués, des centaines blessés. Fin de la présence juive à Hébron pour des décennies. Choc profond pour le mouvement sioniste.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Massacre_d%27Hébron_(1929)',i:3},
{y:1935,t:'Cinquième Aliya — Fuite de l\'Allemagne nazie',d:'5e Aliya (1929-1939) : environ 250 000 immigrants, dont 60 000 Juifs allemands fuyant Hitler après 1933. Architectes, médecins, musiciens, intellectuels. L\'aliya allemande transforme Tel-Aviv (architecture Bauhaus, Orchestre philharmonique).',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Cinquième_Aliyah',i:3},
{y:1936,t:'Grande Révolte arabe — 1936-1939',d:'Grève générale arabe puis insurrection armée contre le Mandat britannique et l\'immigration juive (1936-1939). Environ 500 Juifs tués. Les Britanniques répriment mais publient le Livre Blanc de 1939.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Grande_Révolte_arabe_(1936-1939)',i:3},
{y:1939,t:'Livre Blanc — Trahison britannique',d:'Le Livre Blanc MacDonald (17 mai 1939) : limitation à 75 000 immigrants juifs en 5 ans, veto arabe sur l\'immigration future. Perçu comme une trahison — juste avant la Shoah. Les portes fermées quand les Juifs en ont le plus besoin.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Livre_blanc_MacDonald',i:3},
{y:1945,t:'Aliyah Bet — Immigration clandestine',d:'Immigration clandestine de Survivants vers la Palestine malgré le blocus britannique (1945-1948). Environ 70 000 personnes sur des bateaux de fortune. Le SS Exodus (1947) : 4 500 Survivants refoulés — scandale mondial qui accélère le retrait britannique.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Aliyah_Bet',i:3},
{y:1947,t:'Plan de Partage de l\'ONU — Résolution 181',d:'L\'Assemblée générale de l\'ONU vote la résolution 181 (29 nov. 1947) : partage de la Palestine en un État juif et un État arabe. Les Juifs acceptent. Les Arabes refusent. Le lendemain, les premières attaques arabes commencent.',tr:'zionism',w:'https://fr.wikipedia.org/wiki/Résolution_181',i:3},

// ══════════════════════════════════════════════════════════
// SHOAH & ANTISÉMITISME (shoah)
// ══════════════════════════════════════════════════════════
{y:1903,t:'Protocoles des Sages de Sion — Faux antisémite',d:'Les Protocoles des Sages de Sion fabriqués par la police secrète russe (Okhrana) à partir d\'un roman de Joly. Diffusés mondialement, traduits en arabe. Hitler et Himmler les utilisent. Toujours diffusés aujourd\'hui.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Protocoles_des_Sages_de_Sion',i:3},
{y:1903,t:'Pogrom de Kichinev',d:'Pogrom de Kichinev (Bessarabie, avril 1903) : 47 Juifs tués, 600 blessés, 1500 maisons détruites. Organise par les autorités tsaristes. Déclenche une vague d\'émigration vers les USA et la Palestine.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Pogrom_de_Kichinev',i:3},
{y:1905,t:'Pogroms d\'Odessa — 1905',d:'Pogroms d\'Odessa (octobre 1905) après l\'échec de la révolution : environ 2 500 Juifs tués. Activisme du mouvement Cent-Noir. Accélère l\'émigration juive vers les USA et la Palestine.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Pogrom_d%27Odessa_(1905)',i:2},
{y:1919,t:'Pogroms ukrainiens — 1918-1921',d:'Pogroms dans l\'Ukraine en guerre civile (1918-1921). Les armées de Petlioura, Denikine et des bandes locales massacrent entre 100 000 et 200 000 Juifs. La plus grande vague de meurtres antisémites avant la Shoah.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Pogroms_en_Ukraine_(1918-1921)',i:3},
{y:1933,t:'Hitler au pouvoir — Lois antisémites',d:'Hitler nommé chancelier (30 jan. 1933). Lois de Nuremberg (1935) : les Juifs déchus de la citoyenneté allemande. Définition raciale du Juif. Boycott des commerces juifs (avril 1933). 500 000 Juifs en Allemagne.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Lois_de_Nuremberg',i:3},
{y:1938,t:'NUIT DE CRISTAL — Novembre 1938',d:'9-10 novembre 1938 : les SA et SS détruisent 7 500 commerces juifs, incendent 1 400 synagogues, tuent environ 100 Juifs, déportent 30 000 dans des camps. Tournant : les Juifs comprennent qu\'ils doivent fuir.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Nuit_de_Cristal',i:3},
{y:1941,t:'Einsatzgruppen — Shoah par balles',d:'Après l\'invasion de l\'URSS (22 juin 1941), les Einsatzgruppen suivent l\'armée. À Babi Yar (Kiev, 29-30 sept. 1941) : 33 771 Juifs abattus en 2 jours. 1,5 million de Juifs tués par balles à l\'Est en 1941-1942.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Babi_Yar',i:3},
{y:1942,t:'CONFÉRENCE DE WANNSEE — Solution finale',d:'Le 20 janvier 1942, 15 hauts fonctionnaires nazis se réunissent à Wannsee pour coordonner la Solution finale de la Question juive : extermination systématique de 11 millions de Juifs d\'Europe. Reinhard Heydrich préside.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Conférence_de_Wannsee',i:3},
{y:1942,t:'Camps d\'extermination — Opération Reinhard',d:'L\'Opération Reinhard (1942-1943) : les camps de Treblinka, Sobibor, Belzec. 1,7 million de Juifs gazés. Plus Auschwitz-Birkenau (1,1 million), Chelmno, Majdanek. Total : environ 6 millions de Juifs assassinés.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Opération_Reinhard',i:3},
{y:1943,t:'Révolte du Ghetto de Varsovie',d:'19 avril 1943 (veille de Pessah) : les combattants du ZOB (Mordechai Anielewicz) se soulèvent dans le Ghetto de Varsovie. Résistance 27 jours contre les SS. Symbole de la résistance juive. Anielewicz mort le 8 mai.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Révolte_du_ghetto_de_Varsovie',i:3},
{y:1944,t:'Déportation des Juifs hongrois',d:'Mars 1944 : Hitler occupe la Hongrie. Adolf Eichmann organise la déportation de 437 000 Juifs hongrois en 56 jours (mai-juillet 1944). Auschwitz à son paroxysme. Raoul Wallenberg sauve des dizaines de milliers.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Déportation_des_Juifs_de_Hongrie',i:3},
{y:1945,t:'Libération des camps — Bilan : 6 millions',d:'L\'armée soviétique libère Auschwitz (27 jan. 1945). Survivants : squelettes vivants. Bilan : 6 millions de Juifs — 1/3 du peuple juif mondial — assassinés. Fin du monde juif d\'Europe de l\'Est.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Libération_des_camps_de_concentration_nazis',i:3},
{y:1945,t:'Procès de Nuremberg',d:'Tribunal militaire international de Nuremberg (nov. 1945 - oct. 1946). 24 grands criminels de guerre nazis jugés. 12 condamnations à mort. Concept de "crime contre l\'humanité" créé. Fondement du droit international pénal.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Procès_de_Nuremberg',i:3},
{y:1960,t:'Procès Eichmann — Mémoire de la Shoah',d:'Adolf Eichmann, organisateur de la Solution finale, capturé en Argentine par le Mossad (mai 1960). Jugé à Jérusalem. Hannah Arendt couvre le procès ("la banalité du mal"). Condamné et pendu (1962). Premier procès qui impose la Shoah dans la conscience mondiale.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Procès_d%27Adolf_Eichmann',i:3},
{y:1985,t:'Shoah — Film de Claude Lanzmann',d:'Shoah de Claude Lanzmann (1985, 9h30) : documentaire unique. Témoignages de Survivants, bourreaux, témoins. Aucune image d\'archive. Révolution de la transmission de la mémoire.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Shoah_(film)',i:2},
{y:1993,t:'Schindler\'s List — Spielberg',d:'Schindler\'s List de Steven Spielberg (1993) : Hollywood porte la Shoah au grand public mondial. 7 Oscars. La Fondation Shoah fondée. Collecte des témoignages de survivants.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/La_Liste_de_Schindler',i:2},
{y:2000,t:'Antisémitisme renouvelé au XXIe siècle',d:'Regain de l\'antisémitisme en Europe après l\'an 2000. Attentat à la synagogue de Pittsburgh (2018, 11 morts). Affaire Ilan Halimi (France, 2006). Attaque de Halle (2019). Tendances inquiétantes.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Antisémitisme',i:2},
{y:2023,t:'7 Octobre 2023 — Hamas massacre 1200 Israéliens',d:'Le 7 octobre 2023, le Hamas lance la plus grande attaque terroriste contre des Juifs depuis la Shoah. 1 200 morts, 251 otages dont des nourrissons. Kibbutzim massacrés (Be\'eri, Kfar Aza). Festival Nova. Antisémitisme mondial en hausse.',tr:'shoah',w:'https://fr.wikipedia.org/wiki/Attaque_du_Hamas_contre_Israël_du_7_octobre_2023',i:3},

// ══════════════════════════════════════════════════════════
// ÉTAT D\'ISRAËL (israel)
// ══════════════════════════════════════════════════════════
{y:1948,t:'PROCLAMATION DE L\'ÉTAT D\'ISRAËL',d:'Ben Gourion lit la déclaration d\'indépendance (14 mai 1948). 11 minutes après, les USA reconnaissent l\'État. Aussitôt attaqué par 5 armées arabes. Fin du Mandat britannique.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Déclaration_d%27indépendance_d%27Israël',i:3},
{y:1948,t:'Guerre d\'Indépendance — 1948-1949',d:'Guerre d\'Indépendance (Milhemet HaAtsmaout) : Israël affronte Égypte, Jordanie, Syrie, Irak, Liban. Victoire israélienne malgré les pertes (6 000 morts = 1% de la population). Nakba arabe : 700 000 Arabes fuient ou sont expulsés.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_israélo-arabe_de_1948',i:3},
{y:1949,t:'Armistices de Rhodes — Frontières d\'Israël',d:'Armistices signés en 1949 avec l\'Égypte, la Jordanie, le Liban, la Syrie. Frontières de la "Ligne verte". Jérusalem divisée. La Cisjordanie sous Jordanie. Gaza sous Égypte.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Armistices_de_1949',i:2},
{y:1950,t:'Loi du Retour (Hok HaShvout)',d:'La Knesset vote la Loi du Retour (5 juillet 1950) : tout Juif a le droit d\'immigrer en Israël. Fondement identitaire de l\'État. Élargie en 1970 aux conjoints et enfants.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Loi_du_Retour',i:3},
{y:1950,t:'Opération Ezra & Néhémie — Juifs d\'Irak',d:'110 000 Juifs d\'Irak rapatriés en Israël (1950-1952). Dépouillés de leur nationalité et de leurs biens. Opérations aériennes. Fin d\'une présence juive en Irak vieille de 2600 ans.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Opération_Esdras_et_Néhémie',i:3},
{y:1951,t:'Opération Magic Carpet — Juifs du Yémen',d:'49 000 Juifs du Yémen rapatriés en Israël (1949-1950). Première fois que beaucoup voient un avion : "Ailes d\'aigle" comme la prophétie. Fin de la communauté yéménite.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Opération_Tapis_magique',i:2},
{y:1952,t:'Accord de réparations avec l\'Allemagne',d:'Accord Luxembourgeois (1952) : l\'Allemagne verse 3 milliards de marks à Israël en réparations pour la Shoah. Boycott par Menahem Begin et l\'Herout. Controversé mais capital pour l\'économie israélienne naissante.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Accords_de_Luxembourg',i:3},
{y:1956,t:'Crise de Suez — Campagne du Sinaï',d:'Nasser nationalise le Canal de Suez. Israël, France et Grande-Bretagne attaquent l\'Égypte (octobre 1956). Victoire militaire israélienne (Sinaï en 100h). Retraite forcée par USA et URSS. Chaîne TV, révélateur de la guerre froide.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Crise_de_Suez',i:3},
{y:1960,t:'Mossad capture Eichmann en Argentine',d:'Le Mossad enlève Adolf Eichmann à Buenos Aires (11 mai 1960). Jugé à Jérusalem. Premier procès qui impose la Shoah dans la conscience mondiale. Exécuté le 1er juin 1962.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Enlèvement_d%27Adolf_Eichmann',i:3},
{y:1967,t:'GUERRE DES SIX JOURS',d:'5-10 juin 1967 : Israël écrase les armées égyptienne, jordanienne et syrienne en 6 jours. Prend le Sinaï, Gaza, Cisjordanie, Jérusalem-Est et le Golan. Libération du Mur occidental. "Har HaBayit BéYadeinu" (le mont du Temple est dans nos mains).',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_des_Six_Jours',i:3},
{y:1967,t:'Libération du Mur occidental',d:'Le 7 juin 1967, les parachutistes israéliens atteignent le Mur occidental (Kotel). Le général Dayan déclare : "Nous avons uni Jérusalem." Scène de pleurs massifs. Jérusalem déclarée capitale éternelle d\'Israël.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Mur_occidental',i:3},
{y:1972,t:'Massacre des JO de Munich',d:'11 athlètes israéliens pris en otage et tués par le groupe terroriste Septembre Noir lors des JO de Munich (5-6 sept. 1972). Opération Colère de D. : le Mossad traque et élimine les responsables.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Prise_d%27otages_des_Jeux_olympiques_de_Munich',i:3},
{y:1973,t:'GUERRE DE KIPPOUR',d:'6 octobre 1973 (Yom Kippour) : attaque surprise simultanée de l\'Égypte (Sinaï) et de la Syrie (Golan). Premiers jours catastrophiques. Israël contre-attaque. Cessez-le-feu imposé. Traumatisme national profond. Chute de Golda Meir.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_du_Kippour',i:3},
{y:1976,t:'Opération Entebbe',d:'Commando israélien libère 103 otages juifs à l\'aéroport d\'Entebbe (Ouganda), 4 juillet 1976. Opération de 53 minutes. Seul mort israélien : le commandant Yoni Netanyahu (frère de Benyamin). Exploit mondial.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Opération_Entebbe',i:3},
{y:1977,t:'Sadate à Jérusalem — Paix avec l\'Égypte',d:'Anouar el-Sadate visite Jérusalem (19 nov. 1977). Premier chef d\'État arabe à reconnaître Israël. Accords de Camp David (1978). Traité de paix israélo-égyptien (1979). Sadate et Begin Prix Nobel de la Paix.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Visite_de_Sadate_à_Jérusalem',i:3},
{y:1982,t:'Guerre du Liban — Invasion',d:'Israël envahit le Liban (juin 1982) pour chasser l\'OLP. Siège de Beyrouth. Massacre de Sabra et Chatila (Phalangistes libanais, 800-3500 morts). Commission Kahan : responsabilité indirecte d\'Ariel Sharon.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_du_Liban_(1982)',i:3},
{y:1987,t:'Première Intifada — 1987-1993',d:'Soulèvement populaire palestinien (déc. 1987). Pierres contre soldats. Hamas fondé (1987, Ahmed Yassine). Accords d\'Oslo en réponse. 1 000 Palestiniens et 160 Israéliens tués.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Première_Intifada',i:3},
{y:1993,t:'Accords d\'Oslo — Rabin et Arafat',d:'Poignée de mains historique Rabin-Arafat sur la pelouse de la Maison-Blanche (13 sept. 1993). Reconnaissance mutuelle OLP-Israël. Création de l\'Autorité palestinienne. Prix Nobel de la Paix. Espoir déçu.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Accords_d%27Oslo',i:3},
{y:1994,t:'Paix israélo-jordanienne',d:'Traité de paix entre Israël et la Jordanie (26 oct. 1994). Deuxième traité de paix arabo-israélien. Roi Hussein et Rabin. Ouverture des frontières. Relations normalisées.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Traité_de_paix_israélo-jordanien',i:2},
{y:1995,t:'Assassination de Rabin',d:'Yitzhak Rabin assassiné par un extrémiste juif nationaliste, Yigal Amir, lors d\'un rassemblement pour la paix à Tel-Aviv (4 nov. 1995). Traumatisme national profond. Fin du processus d\'Oslo.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Assassinat_de_Yitzhak_Rabin',i:3},
{y:2000,t:'Deuxième Intifada — 2000-2005',d:'Visite d\'Ariel Sharon sur l\'esplanade des mosquées déclenche la deuxième Intifada (sept. 2000). Attentats-suicides massifs. Construction du mur de séparation. Plus de 1 000 Israéliens et 3 000 Palestiniens tués.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Deuxième_Intifada',i:3},
{y:2005,t:'Retrait de Gaza',d:'Ariel Sharon ordonne le retrait total de Gaza (août 2005) : 8 500 colons évacués de force. Hamas prend le contrôle de Gaza en 2007 après des combats avec le Fatah. Début du blocus.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Retrait_israélien_de_la_bande_de_Gaza',i:3},
{y:2006,t:'Guerre du Liban 2006 — Hezbollah',d:'Hezbollah enlève deux soldats israéliens. Israël répond par une guerre de 34 jours (juillet-août 2006). Résolution 1701 de l\'ONU. Résultat mitigé. Nasrallah renforcé dans les perceptions arabes.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_du_Liban_(2006)',i:2},
{y:2020,t:'Accords Abraham — Normalisation arabe',d:'Accords Abraham (août-sept. 2020) : normalisation des relations entre Israël, EAU, Bahreïn, Soudan et Maroc. Fin du consensus arabe de refus. Médiation américaine (Trump). Changement géopolitique majeur.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Accords_Abraham',i:3},
{y:2023,t:'Réforme judiciaire — Crise démocratique',d:'Le gouvernement Netanyahu propose une réforme judiciaire majeure (2023). Manifestations massives. Crise constitutionnelle. Puis le 7 octobre interrompt tout.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Réforme_judiciaire_israélienne_de_2023',i:2},
{y:2023,t:'Guerre de Gaza — Octobre 2023',d:'Suite au massacre du 7 octobre, Israël déclare la guerre au Hamas et envahit Gaza. Opération Épées de Fer. Débats mondiaux. Plus de 30 000 morts palestiniens selon Gaza. Otages en captivité.',tr:'israel',w:'https://fr.wikipedia.org/wiki/Guerre_de_Gaza_(2023)',i:3},

// ══════════════════════════════════════════════════════════
// JUDAÏSME CONTEMPORAIN (j_cont) — courants modernes
// ══════════════════════════════════════════════════════════
{y:1810,t:'Judaïsme Réformé — Seesen, Allemagne',d:'Israel Jacobson ouvre la première synagogue réformée à Seesen (1810). Suppression des prières en hébreu, introduction de l\'orgue, sermons en allemand. Fondation du mouvement réformé. Abraham Geiger en sera le théologien.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:3},
{y:1844,t:'Conférences rabbiniques réformées — Braunschweig',d:'Premières conférences rabbiniques réformées en Allemagne (1844-1846). Débats sur la langue de prière, le statut des femmes, le messianisme. Naissance de la théologie réformée systématique.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:2},
{y:1845,t:'Zacharias Frankel — Judaïsme Massorti (Positif-Historique)',d:'Zacharias Frankel quitte les conférences réformées sur la question de l\'hébreu. Fonde le mouvement positif-historique (futur judaïsme massorti/conservateur). Le judaïsme évolue mais reste lié à la tradition.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_conservateur',i:3},
{y:1851,t:'Samson Raphael Hirsch — Orthodoxie moderne',d:'Samson Raphael Hirsch, rabbin à Francfort, fonde la néo-orthodoxie : Torah im Derekh Eretz (Torah et culture laïque). Orthodoxie moderne qui accepte la modernité mais refuse les réformes liturgiques.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Samson_Raphael_Hirsch',i:3},
{y:1875,t:'Hebrew Union College — Cincinnati',d:'Isaac Mayer Wise fonde le Hebrew Union College à Cincinnati (1875). Première institution de formation rabbinique permanente en Amérique. Centre du judaïsme réformé américain.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Hebrew_Union_College',i:2},
{y:1885,t:'Plateforme de Pittsburgh — Judaïsme Réformé',d:'Les rabbins réformés américains adoptent la Plateforme de Pittsburgh (1885). Rejettent les lois alimentaires et cérémonielles. Le judaïsme est une religion, pas une nationalité. Position très libérale.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Plateforme_de_Pittsburgh',i:2},
{y:1886,t:'Jewish Theological Seminary — New York',d:'Fondation du Jewish Theological Seminary de New York (1886). Centre du judaïsme conservateur/massorti américain. Solomon Schechter le réorganise en 1902. Rabbin Louis Finkelstein.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Jewish_Theological_Seminary_of_America',i:2},
{y:1902,t:'Solomon Schechter — Judaïsme Conservateur',d:'Solomon Schechter réorganise le JTS (1902). Fondateur du mouvement conservateur américain. Découverte de la Geniza du Caire (1896). "Catholic Israel" : la pratique populaire comme norme halakhique.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Solomon_Schechter',i:2},
{y:1922,t:'Mordecai Kaplan — Judaïsme Reconstructionniste',d:'Mordecai Kaplan développe sa philosophie dans les années 1920 (livre en 1934). Le judaïsme est une civilisation, pas une religion. D. = puissance d\'accomplissement. Fondation du mouvement reconstructionniste.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_reconstructionniste',i:2},
{y:1935,t:'Agudath Israël — Orthodoxie haredim',d:'Agudath Israël comme mouvement politique ultra-orthodoxe (fondé 1912 en Europe). Opposition au sionisme laïc. Primauté de la Torah dans la vie juive. Grands rabbins (Guédolei HaTorah) comme autorité.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Agoudath_Israël',i:2},
{y:1937,t:'Plateforme de Columbus — Réforme modérée',d:'Les rabbins réformés adoptent la Plateforme de Columbus (1937). Plus d\'ouverture à la tradition et à l\'hébreu. Influence de l\'immigration sioniste et de la montée du nazisme.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:1},
{y:1948,t:'Rav Kook et le Sionisme Religieux',d:'Abraham Isaac Kook (mort 1935) avait théologisé le sionisme comme rédemption divine. Après 1948, son fils Tsvi Yehuda Kook développe le Sionisme Religieux (Merkaz HaRav). Après 1967, mouvement des colons.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Avraham_Yitzhak_Kook',i:3},
{y:1950,t:'Rav Ovadia Yossef — Judaïsme séfarade orthodoxe',d:'Ovadia Yossef (1920-2013) : autorité halakhique suprême des Juifs séfarades. Grand Rabbin d\'Israël (1973-1983). Fonde le parti Shas (1984). Révolution halakhique : rend les psqot accessibles aux séfarades.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Ovadia_Yossef',i:3},
{y:1972,t:'Ordination des femmes rabbins — Réforme',d:'Sally Priesand devient la première femme rabbin aux USA (Hebrew Union College, 1972). Révolution dans le judaïsme réformé. Le mouvement massorti suit en 1985 avec Amy Eilberg.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Sally_Priesand',i:3},
{y:1983,t:'Patrilinéarité — Judaïsme Réformé',d:'Le mouvement réformé américain adopte la résolution sur la patrilinéarité (1983) : est juif celui né d\'un père ou d\'une mère juive. Rupture avec la halakha traditionnelle. Controversée.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Patrilinéarité',i:2},
{y:1990,t:'Enquête NJPS — Crise démographique juive américaine',d:'L\'enquête NJPS de 1990 révèle un taux d\'intermariage de 52% aux USA. Crise identitaire. Débats sur l\'avenir du judaïsme américain. Réponses diverses : outreach, éducation juive.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Judaïsme_aux_États-Unis',i:2},
{y:2000,t:'Renouveau juif — Renewal Movement',d:'Mouvement de renouveau juif (Jewish Renewal) : Zalman Schachter-Shalomi. Intégration de spiritualités diverses, féminisme, écologie. Cherche à revitaliser la pratique juive pour le XXIe siècle.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Renewal_(mouvement_juif)',i:1},
{y:2006,t:'Bnei Anousim — Retour des Marranes',d:'Mouvement croissant de descendants de Marranes qui redécouvrent leur identité juive. Surtout en Espagne, Portugal, Amérique latine, USA. Questions halakhiques complexes sur leur statut.',tr:'j_cont',w:'https://fr.wikipedia.org/wiki/Marranes',i:2},

// ══════════════════════════════════════════════════════════
// PERSONNALITÉS JUIVES SÉCULIÈRES (j_sec) — XIXe-XXIe s.
// ══════════════════════════════════════════════════════════
{y:1818,t:'Karl Marx — né 1818',d:'Karl Marx (1818-1883), fils d\'un avocat juif converti au christianisme. Philosophe, économiste, révolutionnaire. Le Capital (1867). Manifeste Communiste (1848). Sa pensée façonne le XXe siècle. Lui-même antisémite dans certains textes.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Karl_Marx',i:3},
{y:1856,t:'Sigmund Freud — né 1856',d:'Sigmund Freud (1856-1939), médecin viennois. Fondateur de la psychanalyse. L\'interprétation des rêves (1900). L\'inconscient, le moi, le ça, le surmoi. Juif non pratiquant mais profondément identifié comme juif. Meurt à Londres après l\'Anschluss.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Sigmund_Freud',i:3},
{y:1860,t:'Theodor Herzl — né 1860',d:'Theodor Herzl (1860-1904), journaliste viennois. L\'Affaire Dreyfus le convainc de la nécessité d\'un État juif. "L\'État juif" (Der Judenstaat, 1896). Fonde le mouvement sioniste. Visionnaire et tragique : mort à 44 ans.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Theodor_Herzl',i:3},
{y:1874,t:'Chaim Weizmann — né 1874',d:'Chaim Weizmann (1874-1952), chimiste et sioniste. Négocie la Déclaration Balfour (1917). Premier président d\'Israël (1948-1952). Synthèse unique : scientifique mondial et leader national.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Chaïm_Weizmann',i:2},
{y:1879,t:'Albert Einstein — né 1879',d:'Albert Einstein (1879-1955), physicien de génie. Relativité restreinte (1905) et générale (1915). Prix Nobel de Physique 1921. Citoyen suisse, allemand, américain. Quitte l\'Allemagne dès 1933. Refuse la présidence d\'Israël (1952).',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Albert_Einstein',i:3},
{y:1889,t:'Charlie Chaplin — né 1889',d:'Charlie Chaplin (1889-1977), acteur et réalisateur. Peut-être de descendance juive maternelle. "Le Dictateur" (1940) : parodie d\'Hitler. Génie comique du muet. Banni des USA en 1952 pour sympathies communistes présumées.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Charlie_Chaplin',i:2},
{y:1898,t:'David Ben Gourion — né 1898',d:'David Ben Gourion (1886-1973), fondateur et premier Premier ministre d\'Israël. Déclare l\'indépendance (1948). Dirige les deux premières décennies de l\'État. Architecte du pays.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/David_Ben_Gourion',i:3},
{y:1906,t:'Hannah Arendt — née 1906',d:'Hannah Arendt (1906-1975), philosophe politique. Fuir le nazisme. "Les Origines du totalitarisme" (1951). "La Condition de l\'homme moderne". "Eichmann à Jérusalem" (1963) : la banalité du mal. Figure intellectuelle du XXe siècle.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Hannah_Arendt',i:3},
{y:1908,t:'Claude Lévi-Strauss — né 1908',d:'Claude Lévi-Strauss (1908-2009), anthropologue. Fondateur du structuralisme en anthropologie. "Tristes Tropiques" (1955). "La Pensée sauvage" (1962). Membre de l\'Académie française. Centenaire en 2008.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Claude_Lévi-Strauss',i:2},
{y:1911,t:'Marc Chagall — né 1887',d:'Marc Chagall (1887-1985), peintre biélorusse-français. Scènes de la vie juive de Vitebsk. Fenêtres de la cathédrale de Metz, de l\'ONU, de l\'Opéra de Paris. Mélange folklore juif et avant-garde. Centenaire de sa naissance.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Marc_Chagall',i:2},
{y:1916,t:'Franz Kafka — œuvre publiée',d:'Franz Kafka (1883-1924), écrivain praguois de langue allemande. Le Procès, La Métamorphose, Le Château. Juif assimilé angoissé. Son œuvre publiée surtout après sa mort. Le terme "kafkaïen" entre dans toutes les langues.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Franz_Kafka',i:3},
{y:1922,t:'Marcel Proust — À la Recherche du Temps Perdu',d:'Marcel Proust (1871-1922), romancier français. À la Recherche du Temps Perdu (1913-1927). Mère juive, père catholique. L\'Affaire Dreyfus dans son œuvre. Révolution du roman moderne. Prix Goncourt 1919.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Marcel_Proust',i:3},
{y:1930,t:'Walter Benjamin — Philosophe de la modernité',d:'Walter Benjamin (1892-1940), philosophe et critique berlinois. "L\'Œuvre d\'art à l\'ère de sa reproductibilité technique" (1935). Marxiste et kabbaliste. Suicide à la frontière espagnole en 1940 pour fuir les nazis.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Walter_Benjamin',i:2},
{y:1938,t:'Primo Levi — Si c\'est un homme',d:'Primo Levi (1919-1987), chimiste et écrivain turinois. Survivant d\'Auschwitz. "Si c\'est un homme" (1947), "La Trêve", "Le Système périodique". Témoin majeur de la Shoah. Sa mort en 1987 interroge.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Primo_Levi',i:3},
{y:1944,t:'Simone Weil — Philosophe',d:'Simone Weil (1909-1943), philosophe et mystique. Née juive, convert spirituellement au christianisme. "L\'Enracinement", "La Pesanteur et la Grâce". Résistante. Meurt de tuberculose aggravée par le refus de manger plus que les Français rationnés.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Simone_Weil',i:2},
{y:1946,t:'Elie Wiesel — La Nuit',d:'Elie Wiesel (1928-2016), survivant d\'Auschwitz et écrivain. "La Nuit" (1958) : témoignage fondamental. Prix Nobel de la Paix 1986. "Messager de paix". Contre l\'indifférence : "L\'opposé de l\'amour n\'est pas la haine, c\'est l\'indifférence."',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Elie_Wiesel',i:3},
{y:1948,t:'Golda Meir — Ministre, Premier ministre',d:'Golda Meir (1898-1978), née à Kiev, émigrée en Palestine. Première femme Premier ministre d\'Israël (1969-1974). Dirige Israël pendant la Guerre du Kippour (1973). "La Grand-mère d\'Israël."',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Golda_Meir',i:3},
{y:1952,t:'Noam Chomsky — Linguistique et Politique',d:'Noam Chomsky (né 1928), linguiste et intellectuel américain. Révolution en linguistique (grammaire générative, 1957). Critique majeur de la politique étrangère américaine et de l\'interventionnisme israélien.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Noam_Chomsky',i:2},
{y:1960,t:'Stanley Kubrick — Réalisateur',d:'Stanley Kubrick (1928-1999), réalisateur américain. Spartacus (1960), Dr Strangelove (1964), 2001 L\'Odyssée de l\'espace (1968), Shining (1980), Eyes Wide Shut (1999). L\'un des plus grands cinéastes du XXe siècle.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Stanley_Kubrick',i:2},
{y:1965,t:'Bob Dylan — folk, rock, Nobel',d:'Bob Dylan (né Robert Zimmerman, 1941), chanteur-compositeur américain. Blowin\' in the Wind (1963). Converti au christianisme évangélique (1979), puis retour au judaïsme. Prix Nobel de Littérature 2016.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Bob_Dylan',i:3},
{y:1969,t:'Leonard Cohen — Poète et chanteur',d:'Leonard Cohen (1934-2016), poète et chanteur québécois. Suzanne (1966), Hallelujah (1984). Profondément influencé par la Torah et la kabbale, aussi par le bouddhisme zen. Figure universelle.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Leonard_Cohen',i:2},
{y:1975,t:'Steven Spielberg — Réalisateur',d:'Steven Spielberg (né 1946), réalisateur américain. Jaws (1975), E.T., Indiana Jones, Schindler\'s List (1993, Shoah), Saving Private Ryan. Fonde la Fondation Shoah (USC Shoah Foundation). Le plus grand box-office de l\'histoire.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Steven_Spielberg',i:2},
{y:1977,t:'Amos Oz — Écrivain israélien',d:'Amos Oz (1939-2018), écrivain israélien de langue hébraïque. Mon Michaël (1968), Une histoire d\'amour et de ténèbres (2002). Co-fondateur de Peace Now. Voix de la gauche israélienne.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Amos_Oz',i:2},
{y:1994,t:'George Soros — Philanthropie et finance',d:'George Soros (né 1930), financier américano-hongrois. Survivant de l\'Occupation nazie. Open Society Foundations. Théorie de la réflexivité. Cible de théories conspirationnistes antisémites.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/George_Soros',i:2},
{y:1998,t:'Larry Page et Sergey Brin — Google',d:'Larry Page et Sergey Brin (juif russe émigré) fondent Google en 1998. Révolution de la recherche sur internet. Alphabet. Changent le monde de l\'information.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Google',i:2},
{y:2004,t:'Mark Zuckerberg — Facebook',d:'Mark Zuckerberg (né 1984), fils d\'un dentiste juif américain. Fonde Facebook à Harvard (2004). 3 milliards d\'utilisateurs. Meta. Révolution des réseaux sociaux.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Mark_Zuckerberg',i:2},

{y:1908,t:'Révolution des Jeunes Turcs',d:'La révolution des Jeunes Turcs (1908) renverse le sultan Abdülhamid II. Constitution rétablie. Empire ottoman libéralisé. Les Juifs et autres minorités espèrent. Mais nationalisme turc croissant.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Révolution_des_Jeunes-Turcs',i:2},
{y:1916,t:'Accord Sykes-Picot',d:'Accord secret franco-britannique (mai 1916) divisant le Proche-Orient en zones d\'influence. Création des futurs états arabes. Contradictions avec les promesses à Husseyn et Balfour. Légèreté historique aux conséquences durables.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Accords_Sykes-Picot',i:3},
{y:1916,t:'Grande Révolte arabe',d:'Le Chérif Hussein de La Mecque se révolte contre les Ottomans avec l\'appui britannique (1916). Lawrence d\'Arabie. Promesses britanniques d\'un grand État arabe. Non tenues après-guerre.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Grande_Révolte_arabe',i:2},
{y:1922,t:'Création des États arabes modernes',d:'Après la WWI et les mandats de la SDN : Irak (1920), Transjordanie (1921), Syrie et Liban (1920). Frontières artificielles. Royaumes et républiques fragiles. Minorités diverses (juives, chrétiennes, kurdes) sous domination arabe.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Proche-Orient',i:2},
{y:1928,t:'Fondation des Frères Musulmans',d:'Hassan al-Banna fonde les Frères Musulmans en Égypte (1928). Islam politique modernisé. Réseau mondial. Influence sur le Hamas (1987), le FIS, et les islamismes contemporains.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Frères_musulmans',i:3},
{y:1932,t:'Fondation du Royaume d\'Arabie Saoudite',d:'Ibn Saoud unifie le Hedjaz et le Najd (1932). Arabisme wahhabite. Découverte du pétrole (1938). Alliance avec les USA (1945). Financement de l\'islamisme mondial.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Arabie_Saoudite',i:3},
{y:1948,t:'Nakba — Exode palestinien',d:'La Nakba (catastrophe) : 700 000 Arabes palestiniens fuient ou sont expulsés pendant la Guerre d\'Indépendance israélienne. 400 villages détruits. Réfugiés dans les pays arabes voisins. Problème non résolu.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Nakba',i:3},
{y:1952,t:'Révolution des Officiers Libres — Égypte',d:'Les Officiers Libres renversent le roi Farouk (juil. 1952). Naguib puis Nasser au pouvoir. Nassérisme = nationalisme arabe + socialisme. Modèle pour tout le Moyen-Orient.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Révolution_égyptienne_de_1952',i:3},
{y:1956,t:'Nasser nationalise le Canal de Suez',d:'Nasser nationalise le Canal de Suez (26 juillet 1956). Crise de Suez. Défaite diplomatique britannique et française. Nasser devient le héros du nationalisme arabe.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Nasser',i:3},
{y:1964,t:'Fondation de l\'OLP — Arafat',d:'Organisation de Libération de la Palestine fondée (1964). Charte palestinienne. Yasser Arafat prend la tête du Fatah puis de l\'OLP. Résistance palestinienne internationalisée.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Organisation_de_libération_de_la_Palestine',i:3},
{y:1979,t:'Révolution islamique iranienne',d:'Ayatollah Khomeini renverse le Shah (février 1979). République islamique d\'Iran. Rhétorique anti-israélienne systématique. Soutien au Hezbollah. Changement géopolitique majeur au Moyen-Orient.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Révolution_iranienne',i:3},
{y:1987,t:'Hamas fondé — Ahmed Yassine',d:'Hamas (Mouvement de Résistance Islamique) fondé au début de la Première Intifada (décembre 1987) par le cheikh Ahmed Yassine. Branche palestinienne des Frères Musulmans. Charte : destruction d\'Israël.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Hamas',i:3},
{y:2003,t:'Guerre d\'Irak — Fin de Saddam',d:'Invasion de l\'Irak par les USA et alliés (mars 2003). Saddam Hussein renversé. Chaos post-invasion. Émergence d\'Al-Qaïda en Irak. Fin de l\'État baasiste. Nouveau contexte géopolitique régional.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Guerre_d%27Irak',i:3},
{y:2011,t:'Printemps Arabe',d:'Vague révolutionnaire dans le monde arabe (2010-2012). Tunisie, Égypte, Libye, Syrie, Yémen. Espoirs démocratiques déçus. Guerre civile syrienne (500 000 morts). Montée des islamismes. Chaos régional.',tr:'mideast',w:'https://fr.wikipedia.org/wiki/Printemps_arabe',i:3},

{y:1905,t:'Révolution de 1905 en Russie',d:'Révolution ratée de 1905. Dimanche sanglant. Pogroms en Russie. Les Juifs massivement impliqués dans les partis révolutionnaires (Bund, Social-Démocratie). Réforme avortée. Tsar conserve le pouvoir.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Révolution_russe_de_1905',i:2},
{y:1917,t:'RÉVOLUTION BOLCHEVIQUE — Octobre 1917',d:'Lénine et les bolcheviks prennent le pouvoir à Petrograd (25 oct. 1917). Nombreux Juifs dans la direction bolchevique (Trotski, Zinoviev, Kamenev, Sverdlov). Abolition de la Zone de résidence. Mais aussi début de nouvelles persécutions.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Révolution_d%27Octobre',i:3},
{y:1920,t:'Bund et Poale Sion — Mouvements ouvriers juifs',d:'Le Bund (mouvement ouvrier juif yiddishiste) et Poale Sion (sionistes socialistes) rivalisent pour l\'âme des masses juives d\'Europe de l\'Est. Le Bund défend l\'autonomie culturelle en Diaspora.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Bund_(organisation)',i:2},
{y:1928,t:'Birobidjan — Région juive soviétique',d:'Staline crée la Région autonome juive de Birobidjan en Sibérie (1928). Alternative soviétique à la Palestine. Yiddish langue officielle. Échec relatif : peu de Juifs s\'y installent. Toujours existante.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Oblast_autonome_juif',i:2},
{y:1936,t:'Procès de Moscou — Purges staliniennes',d:'Procès de Moscou (1936-1938) : Staline élimine Zinoviev, Kamenev et d\'autres leaders dont beaucoup de Juifs. Grande Terreur. 750 000 exécutés. Fin de la direction bolchevique juive.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Procès_de_Moscou',i:3},
{y:1948,t:'Assassinat de Mikhoels — Campagne anticosmopolite',d:'Solomon Mikhoels, grand acteur yiddish soviétique, assassiné sur ordre de Staline (1948). Campagne anticosmopolite (= antisémite) 1948-1953. Dissolution du Comité antifasciste juif.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Solomon_Mikhoels',i:3},
{y:1953,t:'Complot des médecins — Mort de Staline',d:'Janvier 1953 : Staline accuse des médecins juifs de comploter pour empoisonner la direction soviétique. Crainte d\'une déportation massive des Juifs soviétiques. Mort de Staline (5 mars 1953) met fin au complot.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Complot_des_Blouses_blanches',i:3},
{y:1967,t:'Juifs soviétiques — Mouvement des Refuzniks',d:'Après la guerre de 1967 et la fierté israélienne, les Juifs soviétiques veulent émigrer. Les refuzniks : ceux dont la demande d\'émigration est refusée. Mouvement de solidarité mondial. Natan Sharansky.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Refuznik',i:3},
{y:1991,t:'Chute de l\'URSS — Grande Aliya russe',d:'Effondrement de l\'URSS (1991). Un million de Juifs soviétiques émigrent en Israël (1990-1999). Grande Aliya russe transforme Israël : scientifiques, musiciens, ingénieurs. Révolution démographique.',tr:'ussr',w:'https://fr.wikipedia.org/wiki/Aliyah_de_l%27URSS',i:3},
