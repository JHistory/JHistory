{y:-390,t:'Les Gaulois saccagent Rome',d:'Les Sénons de Brennus défont les Romains à l\'Allia. "Vae victis !" (Malheur aux vaincus !). Seul le Capitole résiste (oies sacrées de Junon). Rome payé une rançon. Trauma fondateur.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Sac_de_Rome_par_les_Gaulois',i:2},
{y:-264,t:'Première Guerre punique — Rome vs Carthage',d:'Rome vs Carthage pour la Sicile. Rome construit sa première grande flotte (à partir d\'un navire carthaginois capturé). Victoire romaine (241). Sicile = première province romaine.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Premi%C3%A8re_Guerre_punique',i:2},
{y:-218,t:'Hannibal Barca — Traverse les Alpes',d:'Hannibal (Carthage) traverse les Alpes avec éléphants. Écrase Rome à la Trébie, au Trasimène, à Cannes (216 : 70 000 Romains tués). Reste 15 ans en Italie sans prendre Rome. Génie militaire absolu.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Hannibal_Barca',i:3},
{y:-202,t:'Bataille de Zama — Fin de Carthage puissante',d:'Scipion l\'Africain bat Hannibal à Zama (Afrique du Nord). Fin de la Deuxième Guerre punique. Carthage soumise. Rome domine l\'Occident méditerranéen.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Bataille_de_Zama',i:3},
{y:-146,t:'"Carthago delenda est" — Rome détruit Carthage',d:'"Ceterum censeo Carthaginem esse delendam" (Caton l\'Ancien, répété obsessionnellement). Troisième Guerre Punique. Carthage détruite, sol labouré et salé (légende). 50 000 Carthaginois vendus comme esclaves.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Siège_de_Carthage_(149-146_av._J.-C.)',i:3},
{y:-133,t:'Tiberius Gracchus — Réforme agraire',d:'Tribun de la plèbe. Loi agraire pour redistribuer les terres publiques aux pauvres (contre les latifundia des riches). Tué avec ses partisans par des sénateurs conservateurs. Première violence politique à Rome.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Tiberius_Gracchus',i:2},
{y:-121,t:'Caius Gracchus — Tué par le Sénat',d:'Frère de Tiberius. Réformes sociales plus radicales. Premier usage du sénatus-consulte ultime (état d\'exception). Tué avec 3 000 partisans. Rome entre dans une période de crise institutionnelle.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Caius_Gracchus',i:2},
{y:-107,t:'Marius — Réforme militaire révolutionnaire',d:'Consul 7 fois (record). Armée de métier remplace la levée citoyenne. Légions professionnelles dédiées à leur général. Bat Jugurtha, Cimbres, Teutons. Rival de Sylla. Première marche sur Rome.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Marius_(général_romain)',i:2},
{y:-82,t:'Dictature de Sylla — Proscriptions',d:'Sylla marche sur Rome avec ses légions (premier précédent). Dictature (82-79 AEC). Proscriptions : liste des ennemis à tuer, biens confisqués. Réforme conservatrice. Démissionne librement — unique dans l\'histoire.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Sylla',i:2},
{y:-73,t:'Spartacus — Grande révolte d\'esclaves',d:'Spartacus gladiateur thrace mène la plus grande révolte d\'esclaves de l\'Antiquité. 70 000-120 000 hommes, 3 ans. Bat plusieurs armées romaines. Finalement écrasé par Crassus. 6 000 crucifiés sur la Via Appia.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Spartacus',i:3},
{y:-63,t:'Cicéron consul — Conjuration de Catilina',d:'Marcus Tullius Cicero, le plus grand orateur romain. Démasque la conjuration de Catilina. "O tempora, o mores !" Philosophe, juriste, écrivain (De Republica, De Officiis). Exécuté par Antoine en 43.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Cic%C3%A9ron',i:2},
{y:-60,t:'Premier Triumvirat — César, Pompée, Crassus',d:'Alliance informelle entre Jules César, Pompée le Grand et Crassus. Domine la politique romaine. César part en Gaule. Pompée en Espagne. Mort de Crassus à Carrhes (53). Rupture inévitable.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Premier_triumvirat',i:3},
{y:-58,t:'Jules César conquiert la Gaule',d:'César conquiert la Gaule (58-50). Commentarii de Bello Gallico. Franchit le Rhin, débarque en Bretagne. Alesia (52) : défaite de Vercingétorix. Popularité immense. Armée personnellement dévouée.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Jules_César',i:3},
{y:-49,t:'César franchit le Rubicon — Guerre civile',d:'"Alea iacta est" — le dé est jeté. César entre en Italie avec la XIIIe légion, défiant le Sénat. Pompée fuit en Grèce. Guerre civile. Prise du pouvoir. "Le Rubicon" = point de non-retour.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Franchissement_du_Rubicon',i:3},
{y:-44,t:'ASSASSINAT DE CÉSAR — Ides de Mars',d:'"Et tu, Brute ?" Jules César assassiné le 15 mars 44 AEC au Sénat (théâtre de Pompée). 23 coups de poignard. Brutus et Cassius chefs des conjurés. Rome plonge dans la guerre civile. Transforme César en martyr.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Assassinat_de_Jules_César',i:3},
{y:-43,t:'Second Triumvirat — Mort de Cicéron',d:'Antoine, Octave et Lépide forment le Second Triumvirat (légal). Proscriptions : Cicéron exécuté sur ordre d\'Antoine. Brutus et Cassius battus à Philippes (42). Partage de l\'empire.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Second_triumvirat',i:2},
{y:-31,t:'Bataille d\'Actium — Fin de la République',d:'Octave (future Auguste) écrase Marc Antoine et Cléopâtre à Actium (Grèce). Antoine et Cléopâtre fuient en Égypte et se suicident. Octave maître du monde romain. Fin de la République.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Bataille_d%27Actium',i:3},
{y:-27,t:'AUGUSTE — Fondation de l\'Empire romain',d:'Octave reçoit le titre d\'Auguste (31 jan. 27 AEC). Premier imperator. "Pax Augusta" (Pax romana). Réformes militaires, administratives (provinces). Mécène (Virgile, Horace, Ovide). Judée vassal sous son règne.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Auguste_(empereur_romain)',i:3},
{y:-19,t:'Virgile — Énéide',d:'Publius Vergilius Maro compose l\'Énéide, épopée nationale reliant Rome à Troie via Énée. "Arma virumque cano." Œuvre commandée par Auguste. Fondatrice de la culture latine et de l\'identité romaine.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Virgile',i:2},
{y:-4,t:'Mort d\'Hérode — Judée tributaire romaine',d:'À la mort d\'Hérode, Auguste divise le royaume entre ses trois fils. Archélaüs (Judée/Samarie) sera déposé en 6 EC, Judée annexée comme province. Rome et Judée : relation de plus en plus tendue.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Judée_(province_romaine)',i:2},

// ══════════════════════════════════════════════════════════
// PÉRIODE 0–1000 EC — JUDAÏSME (j_main)
// ══════════════════════════════════════════════════════════
{y:6,t:'Judée — Province romaine directe',d:'Archélaüs, fils d\'Hérode, déposé par Auguste. La Judée devient province romaine administrée par des préfets résidant à Césarée Maritima. Les Juifs gardent leur loi mais perdent toute autonomie politique. Tensions fiscales et religieuses croissantes.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Judée_(province_romaine)',i:2},
{y:30,t:'Crucifixion de Jésus — Fracture judéo-chrétienne',d:'Yeshoua de Nazareth est crucifié sous Ponce Pilate. Ses disciples (dont Pierre, puis Paul) le proclament Messie et Fils de dieu. Naissance du mouvement judéo-chrétien, d\'abord secte juive (Nazaréens). La rupture avec le judaïsme rabbinique sera progressive mais irréversible.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/J%C3%A9sus_de_Nazareth',i:3},
{y:50,t:'Paul de Tarse — Épîtres et rupture Loi/Foi',d:'Shaoul de Tarse (Paul), Pharisien converti, diffuse le christianisme dans tout le bassin méditerranéen. "La justification par la foi, non par les œuvres de la Loi." Polémique structurante avec le judaïsme : la séparation institutionnelle s\'amorce.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Paul_de_Tarse',i:2},
{y:66,t:'Grande Révolte juive contre Rome (66–73)',d:'Révolte armée généralisée contre l\'occupation romaine. Prise de Massada, massacre de la garnison romaine. Rome envoie Vespasien puis Titus. Jérusalem assiégée. Division interne des factions juives (Sicaires, Zélotes, Pharisiens). Tournant irréversible de l\'histoire juive.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Grande_r%C3%A9volte_juive',i:3},
{y:70,t:'DESTRUCTION DU SECOND TEMPLE — 9 Av 70',d:'Titus assiège puis prend Jérusalem après 5 mois. Le Temple est incendié le 9 Av — même date que le Premier Temple. Environ 1 100 000 morts et 97 000 déportés selon Josèphe. La Menorah emportée à Rome (Arc de Titus). Fin du culte sacrificiel. Le judaïsme rabbinique doit se réinventer.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Destruction_du_Temple_de_J%C3%A9rusalem',i:3},
{y:70,t:'Johanan ben Zakkaï fonde l\'académie de Yavné',d:'Selon la tradition, Raban Yohanan ben Zakkaï se fait sortir clandestinement de Jérusalem assiégée, rencontre Vespasien et lui prédit qu\'il deviendra Empereur, puis demande : "Donne-moi Yavné et ses sages." Fondation du judaïsme rabbinique post-Temple.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Johanan_ben_Zakka%C3%AF',i:3},
{y:73,t:'Chute de Massada — 960 martyrs',d:'La forteresse de Massada sur la mer Morte, tenue par les Sicaires d\'Éléazar ben Yaïr, résiste 3 ans. À l\'assaut final des Romains, 960 défenseurs choisissent la mort collective. "Massada ne tombera plus !" — symbole national israélien.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Massada',i:3},
{y:90,t:'Synode de Yavné — Canon hébraïque',d:'L\'académie de Yavné débat et statue sur le canon des Écritures hébraïques (Tanakh). Certains livres disputés (Ben Sira, Qohéleth) sont examinés. Le Birkat HaMinim (formule contre les hérétiques/min) est ajouté à l\'Amidah. Institutionnalisation du judaïsme pharisien-rabbinique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Concile_de_Jamnia',i:3},
{y:115,t:'Révolte de la Diaspora — Guerre de Kitos (115–117)',d:'Les Juifs d\'Alexandrie, de Cyrénaïque, de Chypre et de Mésopotamie se soulèvent simultanément. Massacres réciproques d\'une violence extrême. Lusius Quietus (Kitos) réprime. La grande communauté juive d\'Égypte est pratiquement anéantie.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Guerre_de_Kitos',i:3},
{y:132,t:'RÉVOLTE DE BAR KOKHBA (132–135)',d:'Shimon bar Kokhba ("Fils d\'Étoile"), proclamé Messie par Rabbi Akiva, libère Jérusalem 3 ans. La révolte engage 580 000 hommes selon les sources romaines. Répression de Hadrien : 50 forteresses rasées, 985 villages détruits. Tournant définitif : la Judée devient Syria Palaestina.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/R%C3%A9volte_de_Bar_Kokhba',i:3},
{y:135,t:'Aelia Capitolina — Jérusalem interdite aux Juifs',d:'Hadrien reconstruit Jérusalem en colonie romaine "Aelia Capitolina", interdit aux Juifs d\'y entrer sous peine de mort (sauf le 9 Av). Le nom de la province passe de "Judaea" à "Syria Palaestina" — pour effacer tout lien avec le peuple juif.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Aelia_Capitolina',i:3},
{y:200,t:'LA MISHNA — Rédaction par Rabbi Juda HaNassi',d:'Rabbi Yehoudah HaNassi codifie la Torah orale en 6 ordres (Sédarim) et 63 traités. "S\'il n\'était pas né, la Torah aurait été oubliée d\'Israël." La Mishna devient le texte normatif du judaïsme rabbinique et la base du Talmud.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Mishna',i:3},
{y:219,t:'Rav fonde l\'académie de Soura en Babylonie',d:'Abba Arikha "Rav" retourne de Palestine en Babylonie et fonde l\'académie de Soura. Avec Shmuel à Néhardée puis Pumbedita, la Babylonie devient le centre du judaïsme mondial. Il formule : "Dina de-Malkhuta Dina" (la loi de l\'État est la loi).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Rav_(rabbin)',i:3},
{y:313,t:'Christianisation de l\'Empire — Statut juif en péril',d:'L\'Édit de Milan légalise le christianisme. Le statut des Juifs change progressivement : communautés reconnues mais discriminées. Conciles anti-juifs (Nicée 325, Elvire etc.). Judéité comme "religio licita" inférieure. Début des restrictions légales chrétiennes.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/%C3%89dit_de_Milan',i:2},
{y:351,t:'Révolte de Gallus — Dernière rébellion juive en Palestine',d:'Sous le César Gallus (fils de Constantin), les Juifs de Galilée se révoltent. Sepphoris, Tibériade et Lydda impliquées. Répression brutale. Dernier soulèvement armé juif en Palestine avant des siècles.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Gallus_Caesar',i:1},
{y:361,t:'Julien l\'Apostat offre de reconstruire le Temple',d:'L\'Emp. Julien, hostile au christianisme, autorise les Juifs à reconstruire le Temple de Jérusalem. Les travaux commencent mais sont abandonnés (tremblement de terre et flammes selon les sources). Mort de Julien (363) met fin définitivement au projet.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Julien_(empereur)',i:2},
{y:385,t:'Talmud de Jérusalem (Yerushalmi) achevé',d:'Le Talmud de Jérusalem est complété à Tibériade, probablement sous pressions des autorités chrétiennes. Moins exhaustif que le Talmud de Babylone (Bavli). Rédigé en araméen occidental. Autorité plus faible mais étudié séparément depuis toujours.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Talmud_de_J%C3%A9rusalem',i:3},
{y:415,t:'Cyrille d\'Alexandrie expulse les Juifs',d:'Cyrille, évêque d\'Alexandrie, après des troubles communautaires, expulse la grande communauté juive présente depuis 700 ans. Pillage des synagogues. Fin d\'une des plus grandes communautés de la Diaspora antique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Cyrille_d%27Alexandrie',i:2},
{y:425,t:'Suppression du Patriarcat de Palestine',d:'L\'Emp. Théodose II supprime le patriarcat juif de Palestine. Gamliel VI est le dernier Nassi. La Babylonie devient définitivement le centre de gravité du judaïsme mondial. Fin de l\'autorité centralisée en Terre d\'Israël.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Patriarche_(juda%C3%AFsme)',i:2},
{y:499,t:'Clôture du TALMUD BAVLI — Rav Ashi & Ravina',d:'Rav Ashi et Ravina II achèvent la rédaction du Talmud de Babylone : 2711 pages (daf), 37 traités. Monument encyclopédique du judaïsme rabbinique, étudié depuis 1500 ans sans interruption (Daf Yomi). Fondement absolu de la loi juive.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Talmud',i:3},
{y:520,t:'Royaume himyarite juif — Youssouf Dhu Nuwas',d:'Le roi himyarite (Yémen actuel) Youssouf Dhu Nuwas se convertit au judaïsme et persécute les chrétiens de Najran. Détruit par l\'invasion éthiopienne chrétienne d\'Abraha (525). Dernier souverain juif d\'un État indépendant.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Youssouf_As%27ar_Yath%27ar',i:2},
{y:614,t:'Alliance juive avec les Perses à Jérusalem',d:'Les Juifs de Palestine s\'allient aux Sassanides de Khosro II. Jérusalem conquise. Les Juifs y administrent brièvement la ville (3 ans). Espoir messianique intense. Répression byzantine à la reconquête d\'Héraclius (629).',tr:'j_main',w:'https://fr.wikipedia.org/wiki/R%C3%A9volte_juive_contre_H%C3%A9raclius',i:2},
{y:622,t:'Mahomet et les tribus juives de Médine',d:'Mahomet établit la "Constitution de Médine" incluant les tribus juives (Banu Qaynuqa, Banu Nadir, Banu Qurayza). Relations d\'abord cordiales. Refus des tribus de reconnaître Mahomet comme prophète → ruptures successives et violentes.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Relations_entre_Mahomet_et_les_Juifs',i:3},
{y:627,t:'Massacre des Banu Qurayza',d:'Après la bataille du Fossé, Mahomet accuse les Banu Qurayza de trahison. Les hommes (600–900) sont exécutés, femmes et enfants réduits en esclavage. Fin des communautés juives de Médine. Événement controversé dans l\'historiographie moderne.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Banu_Qurayzah',i:3},
{y:638,t:'Omar permet aux Juifs de revenir à Jérusalem',d:'Le calife Omar ibn al-Khattab prend Jérusalem pacifiquement (Pacte d\'Omar avec Sophrone). Il autorise les Juifs — bannis depuis 135 et à nouveau depuis 629 — à s\'y réinstaller. Début d\'une ère nouvelle pour le judaïsme sous Islam.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Conquête_de_la_Palestine_par_les_Arabes',i:3},
{y:650,t:'Statut de Dhimmi — Juifs sous Islam',d:'Le statut de dhimmi (protégé) est codifié : liberté de culte et autonomie communautaire, mais impôt spécial (jizya), restrictions vestimentaires et professionnelles. Statut ambigu — protection garantie mais infériorité institutionnalisée.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Dhimmi',i:2},
{y:657,t:'Période des Gueonim — Académies de Babylonie',d:'Les Gueonim ("Éminences") dirigent les académies de Soura et Pumbedita. Répondent aux questions halakhiques (Responsa / She\'elot u-Teshuvot) envoyées du monde entier. Autorité incontestée pendant ~400 ans. Unification du judaïsme diasporique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Gaon',i:2},
{y:711,t:'Conquête arabe d\'Espagne — Essor des Juifs séfarades',d:'Les Juifs hispano-wisigoths, soumis à des persécutions croissantes, accueillent parfois les conquérants arabes. Début d\'une période de relative floraison pour les Juifs d\'al-Andalus. Naissance de la civilisation séfarade médiévale.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_musulmane_de_l%27Hispanie',i:3},
{y:767,t:'Anan ben David — Fondation du Karaïsme',d:'Anan ben David, candidat malheureux au Gaonnat de Babylonie, fonde un mouvement rival : les Karaïtes (B\'nei Miqra — "Fils de l\'Écriture"). Rejet total de la Torah orale et du Talmud : seule l\'Écriture fait autorité. Schisme majeur du judaïsme médiéval.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Kara%C3%AFsme',i:3},
{y:882,t:'Naissance de Saadia Gaon',d:'Saadia ben Yossef naît à Dilaz (Fayyum, Égypte). Il deviendra Gaon de Soura (928–942). Premier grand philosophe juif médiéval : Emounot ve-Deot (Croyances et Opinions). Traduction arabe de la Bible (Tafsir). Combat décisif contre les Karaïtes.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Saadia_Gaon',i:3},
{y:900,t:'Premières communautés ashkénazes en Rhénanie',d:'Des Juifs s\'établissent dans les villes rhénanes (Worms, Mayence, Spire) — le "ShUM". Favorisé par les Carolingiens qui accordent des chartes de protection. Berceau de la civilisation ashkénaze : langue yiddish, traditions, liturgie propre.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Ashk%C3%A9nazes',i:2},
{y:928,t:'Saadia Gaon — Gaon de Soura',d:'Saadia, né en Égypte, nommé Gaon de Soura (rupture du précédent babylonien). Grand conflit avec l\'Exilarque David ben Zakkaï. Figure du judaïsme rationnel : Emounot ve-Deot, première philosophie juive médiévale systématique. Mort en 942.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Saadia_Gaon',i:3},
{y:960,t:'Rabbenu Guershom — "Lumière de la Diaspora"',d:'Rabbi Guershom ben Yehouda (Maor HaGola), né à Metz, s\'installe à Mayence. Promulgue les takkanot fondamentaux de l\'ashkénazisme : interdiction de la polygamie, interdiction de répudier une femme sans son consentement, réintégration des apostats repentants.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Gershom_ben_Judah',i:3},
{y:975,t:'Hisdaï ibn Shaprout — Mécène de Cordoue',d:'Hisdaï ibn Shaprout (915–970+), médecin et diplomate à la cour du Calife de Cordoue Abd al-Rahman III. Finance les savants juifs, correspond avec le roi des Khazars. Fondateur de l\'âge d\'or séfarade — poésie hébraïque, philosophie, grammaire.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Hasdai_ibn_Shaprut',i:2},
{y:1000,t:'Début de l\'Âge d\'or juif en al-Andalus',d:'Samuel ibn Nagrela (Ha-Naguid, 993–1055), vizir et général du royaume de Grenade, poète et talmudiste. Ibn Gabirol, Judah Halevi en germe. Cordoue, Grenade, Tolède : centres de la culture séfarade. Apogée du judaïsme médiéval ibérique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/%C3%82ge_d%27or_juif',i:3},

// PROPHÈTES & SAGES (j_fig) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:-20,t:'Philon d\'Alexandrie — Philosophe judéo-hellénistique',d:'Philo Judaeus (~20 AEC – 50 EC). Interprétation allégorique de la Bible via Platon. Logos divin. "L\'âme est une étrangère dans le corps." Influence majeure sur les Pères de l\'Église et la théologie chrétienne. Peu étudié par les rabbins.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Philon_d%27Alexandrie',i:3},
{y:37,t:'Flavius Josèphe — Historien de la Judée',d:'Yossef ben Mattityahou (37–100). Commandant juif en Galilée, prisonnier de Vespasien. Rédige Guerre juive, Antiquités judaïques, Contre Apion. Source historique irremplaçable sur le Second Temple et la destruction de Jérusalem.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Flavius_Jos%C3%A8phe',i:3},
{y:50,t:'Rabbi Akiva — "Colonne du monde"',d:'Analphabète jusqu\'à 40 ans, devient le plus grand sage talmudique. "Aime ton prochain comme toi-même — grande règle de la Torah." Soutient Bar Kokhba comme Messie. Martyrisé par les Romains : récite le Shema Yisrael en expirant. Une des plus grandes figures du judaïsme.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Aqiba_ben_Joseph',i:3},
{y:70,t:'Rabbi Ishmael — 13 règles herméneutiques',d:'Tanna de la 2e génération. Formule les 13 règles d\'interprétation biblique (Baraïta de Rabbi Yishmael). Rivalité/complémentarité avec Rabbi Akiva. "La Torah parle le langage des hommes" — oppose l\'interprétation littérale à l\'allégorique.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Ishmael_ben_Elisha',i:2},
{y:80,t:'Rabbi Meir — Sage central du Talmud',d:'Élève de Rabbi Akiva et de l\'apostat Élisha ben Abuya (Acher). Sa femme Beruria est l\'une des rares femmes citées dans le Talmud pour sa sagesse. Ses opinions sont si centrales que "dont on ne connaît pas l\'auteur" = Rabbi Meir.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Meir',i:2},
{y:100,t:'Rabbi Shimon bar Yochai — Mystique et Zohar',d:'Tanna. Se cache 12 ans dans une grotte avec son fils (fuite romaine). Associé par la tradition au Zohar (rédigé en réalité au XIIIe s. par Moïse de Léon). Lag BaOmer commémore sa mort. Père symbolique de la mystique juive.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Simon_bar_Yochai',i:3},
{y:135,t:'Rabbi Juda HaNassi — Rédacteur de la Mishna',d:'"Rabbi" par excellence. Patriarche de Judée (~135–217). Ami de l\'Emp. Marc Aurèle selon la tradition. Rédige et organise la Mishna vers 200 EC. "De Moïse à Rabbi, jamais Torah et grandeur ne furent aussi réunies en un seul homme."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Judah_ha-Nasi',i:3},
{y:175,t:'Rav (Abba Arikha) — Père du judaïsme babylonien',d:'Disciple de Rabbi Juda HaNassi, retourne en Babylonie et fonde l\'académie de Soura (219). Très grande stature physique (surnommé "Rav" = le Grand). Organise la vie juive babylonienne. Auteur de la prière Alenou LeShabeah.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rav_(rabbin)',i:3},
{y:180,t:'Shmuel de Néhardée — Astronome et juriste',d:'"Samuel" : grand astronome (maîtrise du calendrier lunaire) et médecin. Gouverne l\'académie de Néhardée. "Les voies du ciel me sont aussi familières que les rues de Néhardée." Principe : Dina de-Malkhuta Dina. Mort en 257.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Samuel_de_N%C3%A9hard%C3%A9e',i:2},
{y:220,t:'Rabbi Yohanan bar Nafha — Fondateur du Yerushalmi',d:'Grande figure des Amoraïm palestiniens (~180–279). Fonde l\'académie de Tibériade. Gouverne la compilation du Talmud Yerushalmi. Réputé d\'une beauté extraordinaire ("reflet de la splendeur d\'Adam"). Débat permanent avec Resh Laqish.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Yohanan_bar_Nafha',i:2},
{y:280,t:'Abaye et Rava — Le Grand Débat talmudique',d:'Abaye (280–338) et Rava (299–352) de Pumbedita. Leur débat permanent (Havayot d\'Abaye ve-Rava) structure le cœur du Talmud Bavli. En désaccord, la loi suit Rava (sauf 6 cas — "YAL KGaM"). La plupart des questions du Talmud passent par leur prisme.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Abaye',i:2},
{y:352,t:'Rav Ashi — Architecte du Talmud Bavli',d:'Rav Ashi (~352–427) dirige l\'académie de Soura 60 ans. Commence la compilation systématique du Talmud de Babylone. Son travail posthumément continué par Ravina II. "De Moïse à Rabbi Juda HaNassi... jusqu\'à Rav Ashi, jamais Torah et grandeur ne furent réunies."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Rav_Ashi',i:3},
{y:580,t:'Rabbi Shimon ben Laqish (Resh Laqish)',d:'Amoraïm palestinien (~200–275). Ancien gladiateur converti au judaïsme par Rabbi Yohanan (son beau-frère). Débats légendaires avec R. Yohanan. Courage physique et intellectuel. "Un homme d\'une force herculéenne et d\'une sagesse équivalente."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Shimon_ben_Lakish',i:1},
{y:882,t:'Saadia ben Yossef HaGaon',d:'Né au Fayyum (Égypte), 882. Gaon de Soura (928–942). Emounot ve-Deot (Croyances et Opinions, 933) : première philosophie juive médiévale systématique. Traduit la Bible en arabe. Combat les Karaïtes. Fondateur du judaïsme rationnel médiéval.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Saadia_Gaon',i:3},
{y:960,t:'Rabbenu Guershom — Maor HaGola',d:'Né à Metz (~960), mort à Mayence (1028). "Lumière de l\'Exil." Ses takkanot révolutionnent le droit familial ashkénaze : monogamie, interdiction de répudier la femme sans son accord, réintégration des apostats repentants. Fondement spirituel de l\'ashkénazisme.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Gershom_ben_Judah',i:3},

// ══════════════════════════════════════════════════════════
// SECTES & COURANTS JUIFS (j_sects) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:70,t:'Disparition des Sadducéens, Esséniens, Zélotes',d:'La destruction du Temple et l\'échec de la révolte effacent les sectes liées au Temple (Sadducéens), à la pureté apocalyptique (Esséniens — manuscrits de la mer Morte) et à la résistance armée (Zélotes, Sicaires). Seuls les Pharisiens survivent et donnent naissance au judaïsme rabbinique.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Juda%C3%AFsme_du_Second_Temple',i:3},
{y:90,t:'Naissance du Christianisme comme religion distincte',d:'Après 70, la séparation entre le groupe judéo-chrétien et le judaïsme rabbinique s\'accélère. Le Birkat HaMinim à Yavné et l\'excommunication progressive des judéo-chrétiens des synagogues institutionnalisent la rupture.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/S%C3%A9paration_du_christianisme_et_du_juda%C3%AFsme',i:3},
{y:100,t:'Birkat HaMinim — Malédiction des hérétiques',d:'L\'académie de Yavné ajoute la "Birkat HaMinim" à l\'Amidah quotidienne. Vise les judéo-chrétiens (min = hérétiques) et autres dissidents. "Que les apostats n\'aient pas d\'espoir." Marque symbolique de la rupture judaïsme-christianisme.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Birkat_HaMinim',i:2},
{y:130,t:'Ébionites et Nazoréens — Judéo-chrétiens',d:'Les judéo-chrétiens maintiennent les pratiques juives (circoncision, Shabbat) tout en croyant en Jésus comme Messie. Ébionites = "les pauvres". Rejetés par le judaïsme rabbinique et par le christianisme paulinien. Disparaissent progressivement au Ve s.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Jud%C3%A9o-christianisme',i:2},
{y:300,t:'Mysticisme de la Merkabah — Hekhalot',d:'Courant mystique fondé sur la vision du Char divin d\'Ézéchiel (Merkabah). Littérature des Palais célestes (Hekhalot). Shi\'ur Qomah. Ascension des cieux par les "yordei merkavah". Ancêtre direct de la Kabbale médiévale.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Mysticisme_de_la_Merkabah',i:2},
{y:500,t:'Savoraïm — Transmetteurs du Talmud',d:'Les Savoraïm ("ceux qui réfléchissent/transmettent") succèdent aux Amoraïm après la clôture du Talmud. Ils transmettent et éclairent sans modifier. Période de consolidation (500–650). Lien entre l\'ère talmudique et celle des Gueonim.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Savoraim',i:1},
{y:767,t:'Karaïtes — Retour au texte biblique seul',d:'Fondés par Anan ben David (~767), les Karaïtes rejettent la Torah orale (Talmud) : "Scrutez soigneusement l\'Écriture et ne vous appuyez pas sur mon opinion." Présents en Palestine, Babylonie, Byzance, Égypte. Leur apogée intellectuel : IXe–Xe s.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Kara%C3%AFsme',i:3},
{y:860,t:'Polémique Rabbanites vs Karaïtes',d:'Saadia Gaon mène la lutte intellectuelle contre les Karaïtes au Xe s. Grands savants karaïtes : al-Qirqisani, Benjamin al-Nahawendi. Les Karaïtes présents jusqu\'à aujourd\'hui (Crimée, Israël, États-Unis). Débat fondateur sur l\'autorité de la tradition orale.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Kara%C3%AFsme',i:2},
{y:900,t:'Samaritains — Communauté survivante',d:'Les Samaritains continuent d\'exister malgré les persécutions byzantines et arabes, autour du mont Garizim (Naplouse). Leur Pentateuque samaritain est conservé. Leur liturgie propre, leurs prêtres, leur calendrier. Communauté de ~800 personnes au XXIe s.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Samaritains',i:1},

// ══════════════════════════════════════════════════════════
// DIASPORA & COMMUNAUTÉS (j_diap) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:38,t:'Pogrom d\'Alexandrie — Premier de l\'Histoire',d:'Flaccus, préfet d\'Égypte, laisse les Grecs attaquer les Juifs d\'Alexandrie. Synagogues profanées, quartier juif pillé. Philon d\'Alexandrie mène une ambassade à Caligula (Legatio ad Gaium). Caligula meurt avant de statuer. Premier pogrom documenté.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Pogrom_d%27Alexandrie_(38)',i:2},
{y:70,t:'Grande Dispersion — Diaspora définitive',d:'Après la destruction et l\'exil de 97 000 esclaves juifs, les communautés diasporiques (Babylonie, Égypte, Rome, Alexandrie, Antioche, Gaule) deviennent le cadre permanent de la vie juive. La diaspora n\'est plus attente du retour mais mode de vie.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Diaspora_juive',i:3},
{y:220,t:'Exilarque (Reish Galuta) — Chef des Juifs de Babylonie',d:'L\'Exilarque, descendant de la maison de David, gouverne les communautés juives de l\'Empire parthe puis sassanide. Reçu à la cour comme un prince. Institution qui durera jusqu\'au XIe s. avec un faste considérable.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Exilarque',i:2},
{y:380,t:'Juifs en Hispanie — Avant les Wisigoths',d:'Les Juifs sont présents en Hispanie depuis l\'époque romaine (synagogue de Minorque, III Concile d\'Elvira anti-juif). Avec les Wisigoths ariens (415) : d\'abord tolérés. Mais après la conversion de Récarède au catholicisme (589) : persécutions croissantes.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Espagne',i:1},
{y:500,t:'Radhanites — Marchands juifs du monde entier',d:'Les Radhanites, marchands juifs basés à Lugdunum (Lyon) et Babylonie, contrôlent les routes commerciales entre l\'Europe chrétienne et l\'Orient islamique. Importent épices, soie, fourrures. Actifs du VIIIe au XIe s. Pont entre deux mondes coupés par la religion.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Radhanites',i:2},
{y:589,t:'Persécutions wisigothes d\'Espagne',d:'Le roi Récarède se convertit au catholicisme (589). Le IIIe Concile de Tolède initie une politique anti-juive : conversions forcées, esclaves chrétiens interdits. Sous Sisebert (612) : 90 000 Juifs forcés au baptême. Début d\'une spirale persécutrice.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Espagne',i:2},
{y:700,t:'Juifs d\'Italie méridionale — Oria, Bari, Otrante',d:'Les communautés juives d\'Italie du Sud sont actives aux IXe–Xe s. Ahimaaz ben Paltiel chronique la communauté d\'Oria. Poètes liturgiques (payytanim). Pont entre le monde oriental (Babylonie, Byzance) et l\'Occident latin naissant.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Italie',i:1},
{y:740,t:'Conversion des Khazars au judaïsme',d:'Le khan Bulan des Khazars et ses nobles adoptent le judaïsme. Unique État turcique à avoir adopté le judaïsme. Correspond avec Hisdaï ibn Shaprout de Cordoue. Judah Halevi en fera le cadre de son dialogue philosophique (Kuzari).',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Khazars',i:3},
{y:800,t:'Juifs de Rhénanie — Protection carolingienne',d:'Charlemagne accorde des privilèges aux marchands juifs du réseau Radhanite. Isaac le Juif accompagne l\'ambassade auprès d\'Harun al-Rashid. Les Juifs de Worms, Mayence, Spire bénéficient de chartes impériales. Base de la future Ashkénazim.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Ashk%C3%A9nazes',i:2},
{y:900,t:'Gueonim — Autorité mondiale',d:'Les Gueonim de Soura et Pumbedita répondent aux questions halakhiques envoyées depuis l\'Espagne, le Maghreb, l\'Italie, la Provence. Leurs Responsa (She\'elot u-Teshuvot) unifient les pratiques du judaïsme mondial malgré la dispersion.',tr:'j_diap',w:'https://fr.wikipedia.org/wiki/Gaon',i:2},

// ══════════════════════════════════════════════════════════
// LEVANT & PROCHE-ORIENT (levant) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:26,t:'Ponce Pilate — Préfet de Judée (26–36)',d:'Procurateur romain notoirement provocateur (boucliers aux effigies, utilisation du Trésor du Temple pour l\'aqueduc). Condamne Jésus sous pression des autorités du Temple. Rappelé à Rome pour avoir massacré des Samaritains.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Ponce_Pilate',i:2},
{y:70,t:'Siège de Jérusalem par Titus (70)',d:'Siège de 5 mois. Famine terrible. Titus prend la ville : le Temple brûle le 9 Av. Arch de Titus à Rome : la Menorah portée en triomphe. La ville et ses murs rasés. Judée transformée en province militarisée.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Si%C3%A8ge_de_J%C3%A9rusalem_(70)',i:3},
{y:132,t:'Bar Kokhba libère Jérusalem (3 ans)',d:'Shimon bar Kokhba reprend Jérusalem. Des monnaies "Année 1 de la Rédemption d\'Israël" sont frappées. Hadrien envoie son meilleur général Julius Severus depuis la Bretagne. Siège final : Bethar (135). Fin de la présence juive autonome en Palestine.',tr:'levant',w:'https://fr.wikipedia.org/wiki/R%C3%A9volte_de_Bar_Kokhba',i:3},
{y:313,t:'Christianisation progressive de la Palestine',d:'Depuis l\'Édit de Milan, la Palestine se christianise rapidement. Hélène (mère de Constantin) découvre la Vraie Croix. Construction du Saint-Sépulcre (335) et de la Nativité (Bethléem). Jérusalem redevient centre religieux — mais chrétien.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Christianisme_en_Palestine',i:2},
{y:390,t:'Patriarcat de Jérusalem — Cinquième siège chrétien',d:'Jérusalem devient l\'un des cinq patriarcats de la chrétienté (avec Rome, Constantinople, Alexandrie, Antioche). Pèlerinages massifs. Monastères en Judée (Saint-Sabas, 483). La Palestine = Terre Sainte chrétienne par excellence.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Patriarcat_de_J%C3%A9rusalem',i:2},
{y:614,t:'Invasion perse sassanide de la Palestine',d:'Khosro II envoie Shahrbaraz. Jérusalem tombe (614). La Vraie Croix emportée à Ctésiphon. Les Juifs (alliés des Perses) administrent brièvement la ville. Massacres des chrétiens. Héraclius reconquiert en 628.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Guerre_byzantine-sassanide_de_602-628',i:2},
{y:638,t:'Omar conquiert Jérusalem — Ère islamique',d:'Le calife Omar entre à Jérusalem à dos de chameau, en manteau rapiécé, refusant de prier dans le Saint-Sépulcre pour ne pas le transformer en mosquée. Pacte d\'Omar avec le Patriarche Sophrone. Autorisation pour les Juifs de revenir.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_de_la_Palestine_par_les_Arabes',i:3},
{y:691,t:'Dôme du Rocher construit sur l\'Esplanade',d:'Abd al-Malik (calife omeyyade) construit le Dôme du Rocher (Qubbat al-Sakhra) sur le rocher de l\'Akedah / Ascension de Mahomet. Architecture byzantine. Inscriptions anti-trinitaires. Monument islamique emblématique. Construction sur le site du Temple.',tr:'levant',w:'https://fr.wikipedia.org/wiki/D%C3%B4me_du_Rocher',i:3},
{y:705,t:'Mosquée al-Aqsa — Troisième lieu saint de l\'Islam',d:'Walid Ier complète la Mosquée al-Aqsa ("la plus lointaine") sur l\'Esplanade du Temple. Jérusalem = al-Quds (la Sainte) pour les musulmans. Esplanade divisée entre la Mosquée et le Dôme du Rocher.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Mosquée_Al-Aqsa',i:2},
{y:750,t:'Palestine sous les Abbassides',d:'La révolution abbasside transfère le pouvoir de Damas à Bagdad. La Palestine province de l\'empire. Communautés chrétiennes, juives et musulmanes coexistent. Les Juifs — minorité dhimmi — sont présents à Jérusalem, Tibériade et Ramla.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Califat_abbasside',i:1},
{y:969,t:'Palestine sous les Fatimides',d:'Les Fatimides (chiites ismaïliens d\'Égypte) prennent la Palestine. Instabilité politique. Juifs parfois mieux traités (vizirs juifs). Routes commerciales méditerranéennes sous leur contrôle. Prémices des tensions qui mèneront aux Croisades.',tr:'levant',w:'https://fr.wikipedia.org/wiki/Califat_fatimide',i:1},

// ══════════════════════════════════════════════════════════
// MÉSOPOTAMIE & PERSE / ISLAM ORIENTAL (meso) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:224,t:'Empire sassanide — Ardashir Ier fonde la Perse zoroastrienne',d:'Ardashir Ier renverse les Parthes Arsacides. Empire sassanide : Perse zoroastrienne, Ctésiphon capitale. Les académies juives de Babylonie (Soura, Pumbedita) vivent sous domination sassanide 400 ans — période productive du Talmud Bavli.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Ardachir_Ier',i:3},
{y:260,t:'Shapur Ier — Capture Valérien, protège les Juifs',d:'Shapur Ier bat et capture l\'Emp. romain Valérien à Édesse (unique capture d\'un Emp. romain). Relations cordiales avec les Juifs (Shmuel et Shapur). L\'Empire sassanide est la grande puissance orientale face à Rome.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Ch%C3%A2pour_Ier',i:3},
{y:484,t:'Mar Zutra II — Micro-principauté juive en Perse',d:'Sous le règne difficile de Péroz Ier, l\'Exilarque Mar Zutra II organise une brève révolte et crée une principauté juive autonome (496–502) avant d\'être capturé et exécuté. Dernier acte de résistance armée juive en Babylonie.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Mar_Zutra_II',i:1},
{y:531,t:'Khosro Ier Anushirvan — Âge d\'or sassanide',d:'"Le juste" (Anushirvan). Réformes fiscales et administratives. Accueille les philosophes néo-platoniciens chassés d\'Athènes (529). Traduit Platon et Aristote en pehlevi. Les académies juives de Soura et Pumbedita prospèrent. Le Talmud s\'achève.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Khosro_Ier',i:3},
{y:637,t:'Conquête arabe de la Perse — Fin des Sassanides',d:'Batailles de al-Qadisiyya (636) et Nihavend (642). L\'Empire sassanide s\'effondre. Yazdegard III fuit jusqu\'au Khorasan. Les Juifs de Babylonie passent sous domination arabe. Le Talmud Bavli est déjà rédigé : le judaïsme survit à la transition.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_de_la_Perse_par_les_Arabes',i:3},
{y:762,t:'Fondation de Bagdad — Cœur du monde islamique',d:'Le calife abbasside Al-Mansur fonde Madinat al-Salam ("Ville de la Paix" = Bagdad) sur le Tigre. Devient la plus grande ville du monde (~1 million d\'hab. au IXe s.). Les Gueonim juifs y ont accès à la cour. Commerce mondial florissant.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Fondation_de_Bagdad',i:3},
{y:830,t:'Maison de la Sagesse — Bayt al-Hikma',d:'Al-Mamun finance la Maison de la Sagesse à Bagdad. Traductions massives du grec, syriaque, persan en arabe. Al-Kindi, Al-Khawarizmi (algèbre, algorithme), Thabit ibn Qurra. Savants juifs et chrétiens nestoriens y collaborent.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Maison_de_la_sagesse',i:3},
{y:945,t:'Bouyides prennent Bagdad — Déclin abbasside',d:'Les Bouyides (chiites, Perses) s\'emparent de Bagdad (945) et contrôlent les califes abbassides devenus figuratifs. Fragmentation politique. Les académies de Soura (fermée 942) et Pumbedita perdent de leur rayonnement. Centre du judaïsme se déplace vers l\'Espagne.',tr:'meso',w:'https://fr.wikipedia.org/wiki/Bouyides',i:2},

// ══════════════════════════════════════════════════════════
// ÉGYPTE (egypt) — 0–1000 EC
// ══════════════════════════════════════════════════════════
{y:38,t:'Pogrom d\'Alexandrie — Flaccus et Caligula',d:'Le préfet Flaccus laisse les Grecs attaquer les Juifs. Philon mène une ambassade à Caligula (Legatio ad Gaium). La grande synagogue d\'Alexandrie — une des merveilles du monde — profanée. Premier pogrom documenté de l\'histoire.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Pogrom_d%27Alexandrie_(38)',i:2},
{y:115,t:'Révolte et anéantissement des Juifs d\'Égypte',d:'La Guerre de Kitos (115–117) : soulèvement des Juifs d\'Alexandrie et de Cyrénaïque. Répression de Lusius Quietus. La grande communauté juive d\'Alexandrie est pratiquement anéantie. La synagogue monumentale détruite. Fin d\'une présence juive de 700 ans.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Guerre_de_Kitos',i:3},
{y:200,t:'École catéchétique d\'Alexandrie — Synthèse chr.-grec',d:'Clément d\'Alexandrie puis Origène : synthèse christianisme-philosophie grecque. Influence directe de Philon d\'Alexandrie. Alexandrie rivale de Rome pour la théologie chrétienne. La Septante y a été traduite, l\'exégèse allégorique y est née.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/%C3%89cole_cat%C3%A9ch%C3%A9tique_d%27Alexandrie',i:2},
{y:391,t:'Destruction du Sérapéum — Fin du paganisme',d:'L\'Emp. Théodose ordonne la fermeture des temples. L\'évêque Théophile détruit le Sérapéum d\'Alexandrie. La bibliothèque annexée subit des pertes. Fin visible du paganisme antique en Égypte.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/S%C3%A9rap%C3%A9um_d%27Alexandrie',i:2},
{y:415,t:'Meurtre d\'Hypatie — Fin de l\'Antiquité philosophique',d:'Hypatie, mathématicienne et philosophe néo-platonicienne, est lynchée par une foule chrétienne à Alexandrie. Symbole de la fin de la philosophie antique. Cyrille d\'Alexandrie — impliqué ou non — expulse simultanément les Juifs.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Hypatie',i:3},
{y:451,t:'Concile de Chalcédoine — Schisme copte',d:'"Parfait en divinité et parfait en humanité." Les Coptes (Égypte) refusent Chalcédoine (monophysisme). Schisme de l\'Église d\'Alexandrie avec Rome et Constantinople. Naissance de l\'Église copte orthodoxe — encore vivante aujourd\'hui.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Concile_de_Chalc%C3%A9doine',i:3},
{y:641,t:'Conquête arabe de l\'Égypte — Amr ibn al-As',d:'Amr ibn al-As conquiert l\'Égypte en 2 ans. Alexandrie capitule (642). Les Coptes — persécutés par Byzance sur Chalcédoine — accueillent parfois les Arabes. Fondation de Fustat (proto-Le Caire). Arabisation progressive. Juifs = dhimmis.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_musulmane_de_l%27%C3%89gypte',i:3},
{y:969,t:'Fatimides fondent Le Caire (al-Qahira)',d:'Le général Jawhar al-Siqilli conquiert l\'Égypte pour les Fatimides chiites. Fonde al-Qahira (Le Caire) en 969. Al-Azhar fondée (970). Les Fatimides parfois favorables aux Juifs (vizirs juifs). Geniza du Caire commence à accumuler ses documents.',tr:'egypt',w:'https://fr.wikipedia.org/wiki/Fatimides',i:3},

// ══════════════════════════════════════════════════════════
// ROME — Suite (0–476)
// ══════════════════════════════════════════════════════════
{y:37,t:'Caligula — Folie impériale et crise juive',d:'Gaius Caligula (37–41). Exige d\'être adoré comme dieu. Ordonne de placer sa statue dans le Temple de Jérusalem (Hérode Agrippa l\'en dissuade). Pogrom d\'Alexandrie (38) sous Flaccus. Assassiné par sa propre garde prétorienne.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Caligula',i:2},
{y:54,t:'Néron — Incendie de Rome et premiers martyrs chrétiens',d:'Néron (54–68). Artiste et despote. Incendie de Rome (64) : Christians accusés — premiers martyrs (Pierre, Paul exécutés à Rome). Révolte juive éclate (66). Vespasien envoyé en Judée. Suicide de Néron en 68.',tr:'rome',w:'https://fr.wikipedia.org/wiki/N%C3%A9ron',i:2},
{y:96,t:'Cinq "Bons Empereurs" — Apogée de Rome (96–180)',d:'Nerva, Trajan, Hadrien, Antonin le Pieux, Marc Aurèle. Gibbon : "l\'époque la plus heureuse de l\'histoire de l\'humanité." Pax Romana. Mais : Bar Kokhba sous Hadrien ; Marc Aurèle philosophe (Méditations stoïciennes).',tr:'rome',w:'https://fr.wikipedia.org/wiki/Cinq_Bons_Empereurs',i:3},
{y:212,t:'Édit de Caracalla — Citoyenneté romaine universelle',d:'Caracalla accorde la citoyenneté romaine à tous les hommes libres de l\'Empire. Les Juifs deviennent formellement citoyens romains — mais avec des restrictions croissantes liées à la montée du christianisme.',tr:'rome',w:'https://fr.wikipedia.org/wiki/%C3%89dit_de_Caracalla',i:2},
{y:284,t:'Dioclétien — Tétrarchie et grande persécution',d:'Dioclétien stabilise l\'Empire après 50 ans de crise. Divise l\'administration (Tétrarchie). Grande persécution des chrétiens (303). Abdication volontaire (305). Dernière grande tentative de maintenir le paganisme comme religion d\'État.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Diocl%C3%A9tien',i:2},
{y:313,t:'ÉDIT DE MILAN — Constantin légalise le christianisme',d:'Constantin et Licinius accordent la liberté de culte à tous. Fin des persécutions des chrétiens. Début de la christianisation de l\'Empire. Tournant capital pour le judaïsme : le christianisme deviendra la religion d\'État (380), infériorisant le judaïsme.',tr:'rome',w:'https://fr.wikipedia.org/wiki/%C3%89dit_de_Milan',i:3},
{y:380,t:'Édit de Thessalonique — Christianisme religion d\'État',d:'Théodose Ier fait du christianisme nicéen la seule religion officielle. Paganisme interdit (380–391). Temples fermés. Jeux Olympiques abolis (394). Les Juifs : tolérés mais officiellement infériorisés. Synagogues protégées en théorie, souvent attaquées en pratique.',tr:'rome',w:'https://fr.wikipedia.org/wiki/%C3%89dit_de_Thessalonique',i:3},
{y:395,t:'Partage définitif de l\'Empire romain',d:'À la mort de Théodose, l\'Empire est partagé entre Arcadius (Orient) et Honorius (Occident). Division définitive. La Palestine reste à l\'Orient (futur Empire byzantin). L\'Occident s\'effondre progressivement sous les pressions barbares.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Partage_de_l%27Empire_romain_(395)',i:3},
{y:410,t:'Sac de Rome par Alaric — Traumatisme de l\'Antiquité',d:'Alaric Ier, roi des Wisigoths, saccage Rome — première fois depuis 800 ans. Onde de choc dans l\'Empire chrétien. Saint Augustin écrit "La Cité de dieu" en réponse. L\'Empire d\'Occident entre en agonie.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Sac_de_Rome_(410)',i:3},
{y:476,t:'CHUTE DE L\'EMPIRE ROMAIN D\'OCCIDENT',d:'Odoacre dépose Romulus Augustule (476). Date conventionnelle de la fin de l\'Antiquité et du début du Moyen Âge. L\'Emp. d\'Orient (Byzance) survit 1000 ans de plus. L\'Occident latin entre dans l\'ère des royaumes germaniques.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Chute_de_l%27Empire_romain_d%27Occident',i:3},

// ══════════════════════════════════════════════════════════
// EMPIRE BYZANTIN & CHRÉTIENTÉ (byzance) — nouvelle piste
// ══════════════════════════════════════════════════════════
{y:313,t:'Constantin — Fondation de l\'Empire chrétien',d:'Constantin légalise le christianisme (Édit de Milan, 313). Transfère la capitale à Constantinople (Nova Roma, 330). Convoque le Concile de Nicée (325). Premier Emp. baptisé (sur son lit de mort). Fondation de l\'Empire byzantin chrétien.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Constantin_Ier_(empereur_romain)',i:3},
{y:325,t:'Concile de Nicée — Credo chrétien',d:'Premier Concile œcuménique, convoqué par Constantin. Condamne l\'arianisme. Établit le Credo de Nicée. La date de Pâques fixée indépendamment de la Pâque juive. Premier de nombreux canons anti-juifs conciliaires.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Premier_concile_de_Nic%C3%A9e',i:3},
{y:330,t:'Constantinople — Nouvelle Rome inaugurée',d:'Constantin inaugure Constantinople le 11 mai 330. Hippodrome, Sénat, forums. Enceinte de Théodose (413). Havre de culture grecque christianisée. Capitale ininterrompue pendant 1000 ans. Centre du monde byzantin.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Constantinople',i:3},
{y:380,t:'Théodose — Christianisme religion officielle',d:'"Nous voulons que tous les peuples pratiquent la religion transmise par l\'Apôtre Pierre." Paganisme criminalisé. Temples fermés. Jeux olympiques abolis (394). Hérésies pourchassées. Les Juifs : tolérés mais officiellement infériorisés.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Th%C3%A9odose_Ier',i:3},
{y:431,t:'Concile d\'Éphèse — Marie "Mère de dieu"',d:'"Theotokos" (Mère de dieu) : Marie est ainsi désignée. Nestorius condamné. Les Nestoriens s\'exilent vers la Perse (écoles de Nisibe), la Chine (christianisme nestorien en Asie centrale). Premier grand schisme post-Nicée.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Concile_d%27%C3%89ph%C3%A8se',i:2},
{y:451,t:'Concile de Chalcédoine — Double nature du Christ',d:'"Parfait en divinité et parfait en humanité, une seule personne." Chalcédoine définit les deux natures. Les Coptes, Arméniens, Éthiopiens (monophysites) refusent. Grand schisme de l\'Orient chrétien. Byzance perd l\'Égypte religieusement.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Concile_de_Chalc%C3%A9doine',i:3},
{y:527,t:'Justinien Ier — Apogée de Byzance',d:'Justinien Ier (527–565) : Corpus Juris Civilis (fondement du droit occidental). Reconquête de l\'Afrique du Nord (533), Italie (536), S. Espagne. Sainte-Sophie (537). Lois anti-juives (Novella 146 interdisant la Mishna en synagogue). Théodora, impératrice puissante.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Justinien_Ier',i:3},
{y:537,t:'Hagia Sophia inaugurée — "J\'ai surpassé Salomon !"',d:'Sainte-Sophie construite en 5 ans et 10 mois. Dôme de 55m de hauteur. Révolution architecturale. Plus grande église du monde pendant 1000 ans. Justinien aurait déclaré : "Salomon, je t\'ai vaincu !" — référence directe au Temple.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Sainte-Sophie_de_Constantinople',i:3},
{y:610,t:'Héraclius — Sauve Byzance de la Perse et de l\'Islam',d:'Héraclius (610–641) : reorganise l\'Empire, bat les Perses (628), récupère la Vraie Croix. Mais l\'Islam surgit et emporte Palestine (638), Syrie, Égypte (641). L\'Empire perd ses provinces les plus riches. Byzance se replie sur l\'Anatolie.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/H%C3%A9raclius',i:3},
{y:717,t:'Léon III — Arrête le siège arabe de Constantinople',d:'Léon III (717–741) résiste au grand siège arabe de Constantinople (717–718) avec le feu grégeois. Victoire cruciale pour la survie de Byzance. Mais déclenche la querelle iconoclaste (726) qui divise l\'Empire.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/L%C3%A9on_III_(empereur_byzantin)',i:3},
{y:726,t:'Querelle iconoclaste (726–843)',d:'Léon III ordonne la destruction des icônes. Les iconophiles (dont le pape) s\'y opposent. Deux périodes d\'iconoclasme. Résolu par l\'Impératrice Théodora : "Triomphe de l\'Orthodoxie" (843). Rupture croissante Rome-Constantinople.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Querelle_des_images',i:3},
{y:843,t:'Triomphe de l\'Orthodoxie — Fin de l\'iconoclasme',d:'L\'Impératrice Théodora rétablit le culte des icônes (1er dimanche de Carême = "Triomphe de l\'Orthodoxie", encore célébré). L\'Église byzantine avec ses icônes est définitivement établie. Identité orthodoxe cristallisée.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Triomphe_de_l%27Orthodoxie',i:2},
{y:863,t:'Cyrille et Méthode — Alphabet slave, christianisation',d:'Constantin (Cyrille) et Méthode, envoyés en Moravie. Inventent l\'alphabet glagolitique (→ cyrillique). Traduisent Bible et liturgie en slavon. Christianisation des Slaves d\'Orient. Impact sur 250 millions de personnes jusqu\'à aujourd\'hui.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Cyrille_et_M%C3%A9thode',i:3},
{y:867,t:'Schisme de Photios — Prélude au Grand Schisme',d:'Le patriarche Photios et le pape Nicolas Ier s\'excommunient mutuellement ("schisme de 863"). Question de la Bulgarie et du Filioque. Préfigure le Grand Schisme de 1054. Tensions structurelles Rome-Constantinople.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Photios_de_Constantinople',i:2},
{y:960,t:'Macédoniens — Apogée byzantin médiéval',d:'Nicéphore II Phocas (960–969) reprend la Crète et la Cilicie. Jean Ier Tzimiskès et Basile II "Bulgaroctone" (976–1025) étendent l\'Empire. L\'Empire byzantin à son maximum médiéval. Contacts étroits avec les communautés juives de Grèce.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Nic%C3%A9phore_II_Phocas',i:2},
{y:988,t:'Baptême de Vladimir — Russie orthodoxe',d:'Vladimir Ier de Kiev choisit le christianisme byzantin après consultation d\'émissaires (Islam, judaïsme khazar, catholicisme latin, orthodoxie). "On ne peut oublier la beauté" de Sainte-Sophie. Baptême de la Rus\'. Mariage avec Anne de Byzance.',tr:'byzance',w:'https://fr.wikipedia.org/wiki/Vladimir_Ier_de_Kiev',i:3},

// ══════════════════════════════════════════════════════════
// ISLAM & CALIFATS (islam) — nouvelle piste
// ══════════════════════════════════════════════════════════
{y:570,t:'Naissance de Mahomet à La Mecque',d:'Muhammad ibn Abdallah naît à La Mecque dans la tribu Quraysh (vers 570). Orphelin recueilli par son grand-père puis son oncle Abu Talib. Marchand. Épouse la riche veuve Khadidja. Médite dans la grotte de Hira.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Mahomet',i:3},
{y:610,t:'Première révélation — "Iqra !" (Lis !)',d:'Mahomet reçoit la première révélation dans la grotte de Hira (Ramadan 610). L\'ange Jibril (Gabriel) : "Iqra !" (Lis !). Khadidja, première croyante. Puis Ali, Abu Bakr, Zayd. Début de la prédication à La Mecque — rejetée par les Quraysh.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Mahomet',i:3},
{y:622,t:'HÉGIRE — An 1 du calendrier islamique',d:'Mahomet quitte La Mecque pour Yathrib (Médine) avec ses fidèles. L\'Hégire (Hijra = émigration) marque le début du calendrier islamique (1er Muharram An 1). Mahomet devient chef politique et religieux de Médine. Constitution de Médine.',tr:'islam',w:'https://fr.wikipedia.org/wiki/H%C3%A9gire',i:3},
{y:624,t:'Bataille de Badr — Première victoire de l\'Islam',d:'313 musulmans battent 950 Mecquois à Badr. Victoire symbolique et théologique. La qibla (direction de prière) change de Jérusalem à La Mecque. Expulsion des Banu Qaynuqa (tribu juive). L\'Islam gagne sa légitimité politique.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Bataille_de_Badr',i:3},
{y:630,t:'Conquête de La Mecque — Amnistie générale',d:'Mahomet entre dans La Mecque avec 10 000 hommes. Amnistie générale. Idoles de la Kaaba détruites. La Mecque islamique. Les tribus arabes se soumettent en masse (Hajjat al-Wada = Pèlerinage d\'AD., 632).',tr:'islam',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_de_La_Mecque',i:3},
{y:632,t:'Mort de Mahomet — Premier Califat',d:'Mahomet meurt à Médine (8 juin 632) sans désignation claire. Abu Bakr élu premier calife. Guerres de Ridda (apostasie). Début des grandes conquêtes. Compilation du Coran initiée par Zayd ibn Thabit.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Mahomet',i:3},
{y:634,t:'Omar ibn al-Khattab — Grandes conquêtes islamiques',d:'Omar (634–644), 2e calife. "Commandeur des croyants." Conquête : Syrie (636), Palestine (638), Égypte (641), Perse (637). Administration efficace. Codification du statut dhimmi. Jérusalem conquise pacifiquement.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Omar_ibn_al-Khatt%C3%A2b',i:3},
{y:644,t:'Compilation du Coran — Othmân',d:'Le calife Othmân ordonne la compilation officielle du Coran. Les recueils précédents brûlés. Version standard établie et envoyée dans toutes les provinces. Othmân assassiné (656) — début de la fitna.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Coran',i:3},
{y:656,t:'Première Fitna — Naissance du schisme sunnite/chiite',d:'Assassination d\'Othmân. Ali ibn Abi Talib (cousin/gendre de Mahomet), 4e calife. Révolte de Muawiya (gouverneur de Syrie). Bataille du Chameau (656), Siffin (657). Assassinat d\'Ali (661). La division sunnites/chiites prend racine.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Premi%C3%A8re_Fitna',i:3},
{y:661,t:'Califat omeyyade — Damas, arabisation de l\'Empire',d:'Muawiya Ier fonde le califat omeyyade (661–750), capitale Damas. Hérédité dynastique. Arabisation de l\'administration (685, Abd al-Malik). Premières pièces de monnaie islamiques. Expansion : Espagne (711), Asie centrale, Inde.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Omeyyades',i:3},
{y:680,t:'Karbala — Martyre de Hussein — Fondement du chiisme',d:'Hussein ibn Ali refuse de prêter allégeance à Yazid. Massacre de Karbala (10 Muharram 61 AH / 10 oct. 680). Hussein et 72 compagnons tués. Zaynab bint Ali témoigne. Ashura = deuil annuel chiite. Fondement théologique du chiisme.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Bataille_de_Karbala',i:3},
{y:711,t:'Conquête de l\'Espagne — Tariq ibn Ziyad',d:'"Tariq, où fuiras-tu ? La mer est derrière toi, l\'ennemi devant." Gibraltar = Jebel al-Tariq. L\'Espagne wisigothique conquise en 7 ans. Al-Andalus fondée. Les Juifs — libérés des persécutions wisigothes — accueillent les conquérants.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Conqu%C3%AAte_musulmane_de_l%27Hispanie',i:3},
{y:732,t:'Bataille de Poitiers — Limite occidentale de l\'Islam',d:'Abd al-Rahman al-Ghafiqi envahit la Gaule. Charles Martel l\'arrête à Poitiers/Tours (oct. 732). "Victoire décisive" qui arrête l\'expansion islamique en Europe occidentale. L\'Islam ne dépassera plus les Pyrénées en permanence.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Bataille_de_Poitiers_(732)',i:3},
{y:750,t:'Révolution abbasside — Fin des Omeyyades',d:'Les Abbassides renversent les Omeyyades (bataille du Grand Zab, 750). Massacre des princes omeyyades. Seul Abd al-Rahman Ier s\'échappe en Espagne (émirat de Cordoue). Capitale déplacée de Damas à Bagdad (762).',tr:'islam',w:'https://fr.wikipedia.org/wiki/R%C3%A9volution_abbasside',i:3},
{y:786,t:'Harun al-Rashid — Zénith de la civilisation islamique',d:'Harun al-Rashid (786–809), calife des Mille et Une Nuits. Apogée du Califat abbasside. Commerce mondial. Échanges avec Charlemagne (éléphant Abul-Abbas). Bagdad = plus grande ville du monde. Maison de la Sagesse en gestation.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Harun_al-Rachid',i:3},
{y:820,t:'Al-Khawarizmi — Algèbre et algorithme',d:'Muhammad al-Khawarizmi : "Kitab al-Mukhtasar fi Hisab al-Jabr" → naissance de l\'algèbre (al-jabr). Systématise les chiffres indo-arabes en Occident. "Algorithm" = latinisation de son nom. Révolution mathématique mondiale.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Al-Khwarizmi',i:3},
{y:909,t:'Califat fatimide — Chiisme ismaïlien rival',d:'Les Fatimides (descendants de Fatima et Ali selon eux) fondent un califat rival en Ifriqiya (909), puis prennent l\'Égypte (969) et fondent Le Caire. Al-Azhar fondée (970). Concurrencent les Abbassides sunnites.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Califat_fatimide',i:2},
{y:980,t:'Avicenne (Ibn Sina) — Canon de la médecine',d:'Ibn Sina / Avicenne (980–1037). "Prince des médecins." Canon de la Médecine (Qanun) : manuel médical pendant 600 ans en Europe. Âme, existence, philosophie (influence sur Thomas d\'Aquin via Maïmonide). Encyclopédiste universel.',tr:'islam',w:'https://fr.wikipedia.org/wiki/Avicenne',i:3},

// EUROPE DE L'OUEST & FRANCS (eu_west) — nouvelle piste
// ══════════════════════════════════════════════════════════
{y:410,t:'Sac de Rome par Alaric — Traumatisme occidental',d:'Alaric Ier, roi des Wisigoths, saccage Rome 3 jours. Onde de choc. Réfugiés à Carthage où saint Augustin écrit "La Cité de dieu" Les Wisigoths s\'installent en Gaule puis en Espagne (415).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Sac_de_Rome_(410)',i:3},
{y:430,t:'Saint Augustin — Fondateur de la théologie occidentale',d:'Augustin d\'Hippone (354–430) : "La Cité de dieu", Confessions. Théologie du péché originel, de la grâce, de la prédestination. Doctrine des Juifs comme "témoins" (humiliés mais préservés). Influence fondatrice sur le Moyen Âge occidental.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Augustin_d%27Hippone',i:3},
{y:451,t:'Bataille des Champs Catalauniques — Attila repoussé',d:'Aetius et les Wisigoths repoussent Attila près de Troyes. L\'Occident survit aux Huns. Attila envahit l\'Italie (452) mais recule. Mort en 453. L\'Empire des Huns se désintègre. L\'Europe occidentale prend sa forme.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Bataille_des_Champs_Catalauniques',i:3},
{y:476,t:'Chute de Rome d\'Occident — Odoacre',d:'Odoacre (général hérule) dépose Romulus Augustule. Fin conventionnelle de l\'Antiquité / début du Moyen Âge. Les Juifs passent sous domination des royaumes germaniques (ostrogoths, wisigoths, francs).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Odoacre',i:3},
{y:481,t:'Clovis Ier — Fondation du Royaume franc',d:'Clovis (481–511), roi des Francs Saliens. Unifie les tribus franques. Bat les Romains à Soissons (486), les Alamans, les Wisigoths (507). Épouse Clotilde la chrétienne. Baptême vers 496. Fondation de la France.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Clovis_Ier',i:3},
{y:496,t:'Baptême de Clovis — Naissance de la France chrétienne',d:'Remi de Reims baptise Clovis : "Courbe la tête, fier Sicambre ; adore ce que tu as brûlé." Les Francs : premiers Germains à embrasser le catholicisme (non l\'arianisme). Alliance Francs-papauté : fondatrice de l\'Europe médiévale. Décrets sur les Juifs.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Bapt%C3%AAme_de_Clovis',i:3},
{y:529,t:'Règle de Saint-Benoît — Naissance du monachisme occidental',d:'Benoît de Nursie rédige sa Règle au Mont-Cassin. "Ora et Labora." Fond du monachisme occidental. Monastères = centres de culture, de copie de manuscrits, de conservation du savoir antique et juif (via les commentaires bibliques).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/R%C3%A8gle_de_saint_Beno%C3%AEt',i:3},
{y:590,t:'Grégoire le Grand — Premier pape médiéval',d:'Grégoire Ier (590–604). Réforme liturgique (chant grégorien). Évangélise l\'Angleterre. Politique juive ambivalente : "protège mais humilie" (Sicut Judaeis) — interdit conversions forcées mais exclut les Juifs des fonctions publiques.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Gr%C3%A9goire_Ier',i:3},
{y:629,t:'Dagobert Ier — Expulsion des Juifs du Royaume franc',d:'Dagobert Ier (629–639) unit le Royaume franc. À la demande de l\'Emp. Héraclius (réciprocité contre les Juifs de Palestine), expulse ou force au baptême les Juifs de son royaume. Premiers décrets anti-juifs en France.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Dagobert_Ier',i:2},
{y:732,t:'Charles Martel — Victoire de Poitiers',d:'Charles Martel (Marteau), maire du palais franc, arrête l\'expansion islamique à Poitiers (oct. 732). Sa victoire le rend maître des Francs. Son fils Pépin III sera roi. Son petit-fils : Charlemagne. Tournant pour l\'identité de l\'Europe occidentale.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Charles_Martel',i:3},
{y:754,t:'Pépin III et la papauté — Don de Pépin',d:'Pépin III, premier roi carolingien (avec accord papal). En retour du soutien papal à sa légitimité, donne des terres au pape (Don de Pépin) : fondation des États pontificaux. Alliance franc-papauté = base de l\'Europe médiévale.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/P%C3%A9pin_le_Bref',i:2},
{y:768,t:'Charlemagne — Emp. de l\'Occident chrétien',d:'Charlemagne (768–814) : empire de l\'Elbe aux Pyrénées. Protège les Juifs (marchands utiles, Isaac le Juif ambassadeur chez Harun). Renaissance carolingienne : écoles, scriptorium. Capitulaires. Couronné Emp. par le pape Léon III (800).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Charlemagne',i:3},
{y:800,t:'Couronnement de Charlemagne (25 déc. 800)',d:'Le pape Léon III couronne Charlemagne "Empereur des Romains" à Rome (Noël 800). L\'idée d\'Empire chrétien d\'Occident ressuscite face à Byzance. L\'Europe occidentale a son propre pôle de civilisation. Byzance proteste.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Couronnement_de_Charlemagne',i:3},
{y:843,t:'Traité de Verdun — Naissance de la France et de l\'Allemagne',d:'Les petits-fils de Charlemagne partagent l\'Empire : Charles le Chauve (France), Louis le Germanique (Germanie), Lothaire (Lotharingie + titre Emp.). Origine des nations françaises et allemandes. Juifs dans les trois royaumes.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Trait%C3%A9_de_Verdun',i:3},
{y:878,t:'Alfred le Grand — Résistance aux Vikings et renaissance',d:'Alfred le Grand (849–899), roi du Wessex. Bat les Danois à Ethandun. Traité de Wedmore. Renaissance culturelle : traduit Bède, Boèce, Grégoire en vieil anglais. Fondateur de l\'Angleterre. Premiers Juifs documentés en Angleterre (avant la conquête normande).',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Alfred_le_Grand',i:2},
{y:910,t:'Abbaye de Cluny — Réforme monastique',d:'L\'abbaye de Cluny fondée par Guillaume Ier d\'Aquitaine. Indépendante des pouvoirs locaux, sous autorité directe du pape. Modèle de réforme monastique. Réseau de 1000 monastères au XIe s. Influence sur les croisades et la politique envers les Juifs.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Abbaye_de_Cluny',i:2},
{y:962,t:'Otto Ier — Saint Empire Romain Germanique',d:'Otto Ier couronné Emp. par le pape Jean XII (2 fév. 962). Fondation du Saint Empire Romain Germanique. L\'Allemagne = cœur de l\'Empire chrétien d\'Occident. Les Juifs des villes rhénanes bénéficient d\'une relative protection impériale.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Othon_Ier_(empereur)',i:3},
{y:987,t:'Hugues Capet — Fondation de la dynastie capétienne',d:'Hugues Capet élu roi de France (987). Fondation de la dynastie capétienne (→1792 directement). L\'identité française s\'affirme. Les Juifs de France : présents à Paris, en Champagne, en Provence.',tr:'eu_west',w:'https://fr.wikipedia.org/wiki/Hugues_Capet',i:2},

// ══════════════════════════════════════════════════════════
// EUROPE DE L'EST & KHAZARS (eu_east) — nouvelle piste
// ══════════════════════════════════════════════════════════
{y:370,t:'Huns arrivent en Europe — Grande Migration',d:'Les Huns (Asie centrale) chassent les Goths de leurs terres. Les Wisigoths demandent l\'asile à Rome (376). Début des Grandes Migrations (Völkerwanderung) qui transforment l\'Europe. L\'instabilité profite parfois aux communautés juives marginalisées.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Huns',i:3},
{y:433,t:'Attila — "Fléau de dieu"',d:'Attila (433–453), roi des Huns. Empire de la Caspienne au Rhin. Extorque tributs à l\'Empire d\'Orient. Dévaste la Gaule (451) et l\'Italie (452). Pape Léon Ier l\'arrête selon la tradition. Mort en 453 : son empire se désintègre.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Attila',i:3},
{y:500,t:'Slaves — Grande expansion en Europe de l\'Est',d:'Les Slaves se répandent dans les Balkans, la Pologne, la Russie du Ve au VIIe s. Populations agricoles en contact avec les communautés juives. Ils accueilleront plus tard des Juifs fuyant les persécutions occidentales.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Slaves',i:2},
{y:560,t:'Empire des Avars en Europe centrale',d:'Les Avars (peuple nomade d\'Asie) s\'établissent en Pannonie (Hongrie). Subjuguent les Slaves. Menacent Constantinople. Charlemagne les écrase (796). En contact avec les communautés juives de la plaine danubienne.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Avars_(Europe)',i:1},
{y:681,t:'Premier Empire bulgare fondé',d:'Khan Asparuh fonde le Premier Empire bulgare, reconnu par Byzance (traité 681). Bulgares puis Slaves. Boris Ier se convertit au christianisme (864) : enjeu de rivalité entre Rome et Constantinople pour son âme.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Premier_empire_bulgare',i:2},
{y:700,t:'Empire khazar — Puissance de la steppe',d:'Les Khazars (Turciques) contrôlent les steppes entre mer Caspienne et mer Noire. Partenaires commerciaux de Byzance et des Arabes. Bloquent la route des Arabes vers l\'Europe orientale (victoire 737). Leur conversion au judaïsme en fera un cas unique.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Khazars',i:3},
{y:740,t:'CONVERSION DES KHAZARS AU JUDAÏSME',d:'Le khan Bulan et ses nobles adoptent le judaïsme. Unique cas dans l\'histoire d\'une grande puissance étatique non sémitique adoptant le judaïsme. Correspond avec Hisdaï ibn Shaprout de Cordoue. Judah Halevi en fera le cadre du Kuzari (XIIe s.).',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Khazars#Conversion_au_juda%C3%AFsme',i:3},
{y:800,t:'Rus\' varègue — Naissance de la Russie',d:'Les Varègues (Vikings de Scandinavie) s\'établissent le long des fleuves russes (Dniepr, Volga). Commerce Scandinavie-Byzance via Constantinople. Rurik à Novgorod (862). Début de l\'État russe. Itinéraire "des Varègues aux Grecs."',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Var%C3%A8gues',i:3},
{y:863,t:'Cyrille et Méthode — Alphabet slave',d:'Cyrille et Méthode, missionnaires de Byzance, inventent l\'alphabet (glagolitique → cyrillique) pour la Moravie. Traduisent la Bible en slavon. Christianisent les Slaves orientaux. Alphabet cyrillique = 250 millions de locuteurs aujourd\'hui.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Cyrille_et_M%C3%A9thode',i:3},
{y:882,t:'Kiev — Capitale de la Rus\'',d:'Oleg de Novgorod prend Kiev (882) et en fait la capitale. "Mère des villes russes." Commerce avec Byzance. Les Juifs de Kiev attestés dès le Xe s. (lettre de la communauté juive de Kiev, v. 930 — document de la Geniza du Caire).',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Rus_de_Kiev',i:3},
{y:965,t:'Sviatoslav détruit l\'Empire khazar',d:'Sviatoslav Ier de Kiev rase la capitale khazare Itil et défait l\'Empire (965). Fin du dernier État de tradition juive en Eurasie. Impact sur les communautés juives de la région. Les Khazars dispersés se fondent dans les populations environnantes.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Sviatoslav_Ier_de_Kiev',i:2},
{y:988,t:'Vladimir de Kiev — Baptême de la Russie',d:'Vladimir Ier choisit le christianisme byzantin. "On ne peut oublier la beauté" de Sainte-Sophie. Baptême collectif dans le Dniepr. Mariage avec Anne de Byzance. Naissance de la Russie orthodoxe. Le judaïsme khazar avait été candidat — refusé.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Vladimir_Ier_de_Kiev',i:3},
{y:1000,t:'Christianisation de la Pologne et Hongrie',d:'Mieszko Ier de Pologne (baptisé 966), Étienne Ier de Hongrie (couronné 1000). Les deux pays entrent dans la chrétienté latine. L\'Europe de l\'Est intègrée. Premières communautés juives en Pologne documentées au XIe s.',tr:'eu_east',w:'https://fr.wikipedia.org/wiki/Histoire_de_la_Pologne',i:2},

// ══════════════════════════════════════════════════════════
// ROME — EMPIRE (0–476 EC) [suite de la piste rome]
// ══════════════════════════════════════════════════════════
{y:14,t:'Auguste meurt — Tibère lui succède',d:'Auguste meurt à Nola. Tibère lui succède comme second Empereur. Début de la dynastie julio-claudienne. Son règne (14–37) voit la montée des tensions en Judée sous Ponce Pilate.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Tibère',i:2},
{y:37,t:'Caligula — Folie impériale et crise juive',d:'Caius Julius Caesar Germanicus ("Caligula", 37-41). Règne despotique. Exige que sa statue soit érigée dans le Temple de Jérusalem — crise majeure évitée par sa mort. Philon le rencontre lors de l\'ambassade d\'Alexandrie.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Caligula',i:3},
{y:41,t:'Claude — Protège les Juifs, puis les expulse de Rome',d:'Claude (41-54). D\'abord favorable aux Juifs (rétablit leurs droits à Alexandrie). Puis (49) expulse les Juifs de Rome — Suétone mentionne des troubles autour de "Chrestus" (= Christos ?). Aquila et Priscille partent pour Corinthe (Actes 18).',tr:'rome',w:'https://fr.wikipedia.org/wiki/Claude_(empereur_romain)',i:2},
{y:54,t:'Néron — Incendie de Rome et persécution chrétienne',d:'Néron (54-68). Grand incendie de Rome (64). Chrétiens désignés coupables. Mort de Pierre et Paul à Rome selon la tradition. Mauvaise gestion de la Judée déclenche la révolte de 66. Suétone, Tacite et Pline en font la chronique.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Néron',i:3},
{y:69,t:'Année des Quatre Empereurs — Vespasien triomphe',d:'Galba, Othon, Vitellius puis Vespasien se succèdent en une année. Guerre civile. Vespasien, commandant en Judée, devient Emp. Fonde la dynastie flavienne. Confie la Judée à Titus.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Année_des_quatre_empereurs',i:2},
{y:79,t:'Éruption du Vésuve — Pompéi ensevelie',d:'Le Vésuve entre en éruption le 24 août 79. Pompéi et Herculanum disparaissent. Pline l\'Ancien périt. Des inscriptions en hébreu et araméen ont été retrouvées à Pompéi, témoignant de la présence juive dans la Campanie romaine.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Éruption_du_Vésuve_en_79',i:2},
{y:96,t:'Nerva — Réforme du Fiscus Judaicus',d:'Domitien (81-96) avait instauré des vérifications humiliantes du "Fiscus Judaicus" (impôt sur les Juifs depuis 70). Nerva (96-98) supprime les contrôles abusifs. Frappe une monnaie commémorant l\'abolition de l\'impôt injuste.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Fiscus_Judaicus',i:1},
{y:98,t:'Trajan — Empire romain à son extension maximale',d:'Trajan (98-117) porte Rome à son extension maximale : Dacie (101-102), Arabie (106), Mésopotamie (114-117). L\'expansion en Mésopotamie exaspère les Juifs de la diaspora → Guerre de Kitos (115-117). Colonne Trajane érigée à Rome.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Trajan',i:3},
{y:117,t:'Hadrien — Hellénisme et politique anti-juive',d:'Hadrien (117-138). Renonce aux conquêtes de Trajan. Grand bâtisseur (Panthéon, Villa Adriana). Interdit la circoncision (~128) → déclencheur de la révolte de Bar Kokhba (132). Reconstruit Jérusalem en Aelia Capitolina. Nomme la province Syria Palaestina.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Hadrien',i:3},
{y:161,t:'Marc Aurèle — Philosophe-Roi stoïcien',d:'"Méditations" : œuvre philosophique stoïcienne écrite en grec. Pestes de Marc Aurèle (165-180). Guerres marcomanes. Réputé ami de Rabbi Juda HaNassi selon la tradition talmudique (un dialogue légendaire entre eux).',tr:'rome',w:'https://fr.wikipedia.org/wiki/Marc_Aurèle',i:3},
{y:193,t:'Septime Sévère — Fondateur d\'une nouvelle Rome',d:'Septime Sévère (193-211), premier Emp. d\'origine africaine (Libye). Favorable aux Juifs au début. Interdit les conversions au judaïsme et au christianisme (Édit de 202). Ses fils Caracalla et Géta se disputeront l\'Empire.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Septime_Sévère',i:2},
{y:212,t:'Édit de Caracalla — Citoyenneté universelle',d:'Caracalla accorde la citoyenneté romaine à tous les habitants libres de l\'Empire (Constitutio Antoniniana). Les Juifs deviennent tous citoyens romains — tout en étant dispensés du culte impérial. Transformation profonde du rapport Juifs-Rome.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Édit_de_Caracalla',i:3},
{y:235,t:'Crise du IIIe siècle — 50 ans d\'anarchie militaire',d:'De 235 à 284, l\'Empire connaît ~50 empereurs. Invasions germaniques et perses. Valérien capturé par Shapur Ier (260) — unique capture d\'un Emp. romain. Divisions (Empire de Palmyre, Empire des Gaules). Économie en déroute. Les Juifs de Babylonie relativement protégés.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Crise_du_IIIe_siècle',i:3},
{y:284,t:'Dioclétien — Tétrarchie et grande persécution',d:'Dioclétien (284-305). Réforme administrative radicale : la Tétrarchie (4 co-empereurs). Édit du Maximum des prix (301). Grande Persécution des chrétiens (303-311). Abdique librement. Les Juifs relativement épargnés.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Dioclétien',i:3},
{y:313,t:'Constantin — Édit de Milan — Christianisation de Rome',d:'Constantin et Licinius signent l\'Édit de Milan : liberté de culte pour tous. Constantin se convertit (baptisé 337). Début de la christianisation de l\'Empire. Changement décisif du statut des Juifs : bientôt une minorité tolérée-discriminée.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Constantin_Ier_(empereur_romain)',i:3},
{y:325,t:'Concile de Nicée — Définition du christianisme officiel',d:'1er Concile œcuménique convoqué par Constantin. Arianisme condamné. Credo de Nicée. La date de Pâques est fixée indépendamment du calendrier juif — rupture symbolique volontaire. Fondation de la théologie trinitaire d\'État.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Premier_concile_de_Nicée',i:3},
{y:380,t:'Édit de Thessalonique — Christianisme religion d\'État',d:'Théodose Ier fait du christianisme nicéen la religion officielle de l\'Empire. Les autres cultes = hérésie punissable. Les Juifs = minorité tolérée mais institutionnellement inférieure. Fermeture des temples païens.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Édit_de_Thessalonique',i:3},
{y:395,t:'Division définitive de l\'Empire romain',d:'À la mort de Théodose Ier, l\'Empire est définitivement divisé entre Arcadius (Orient, Constantinople) et Honorius (Occident). Deux destins divergents : Byzance durera 1 058 ans, Rome d\'Occident 80 ans.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Division_de_l%27Empire_romain',i:3},
{y:438,t:'Code Théodosien — Marginalisation légale des Juifs',d:'Théodose II compile le Code Théodosien. Discriminations anti-juives codifiées : interdiction de construire de nouvelles synagogues, d\'exercer des charges publiques, de posséder des esclaves chrétiens. Matrice du statut juif médiéval pendant 1 000 ans.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Code_théodosien',i:2},
{y:455,t:'Sac de Rome par les Vandales',d:'Geiseric, roi des Vandales, saccage Rome 14 jours. Le pape Léon Ier négocie l\'épargnement des personnes. Les trésors du Temple (via Titus, puis Carthage vandale) auraient disparu pour toujours.',tr:'rome',w:'https://fr.wikipedia.org/wiki/Sac_de_Rome_(455)',i:2},

// ══════════════════════════════════════════════════════════
// JUDAÏSME — Histoire générale (j_main) COMPLÉMENTS 0–1000
// ══════════════════════════════════════════════════════════
{y:17,t:'Judas de Galilée — Naissance des Zélotes',d:'"Pas d\'autre seigneur qu\'Hachem !" Judas de Gamala se révolte contre le recensement de Quirinius (6 EC). Fondateur du mouvement des Zélotes. Les Actes des Apôtres le mentionnent (5:37). Germe de la révolte de 66.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Judas_de_Galilée',i:2},
{y:40,t:'Philon conduit une ambassade à Caligula',d:'Après les pogroms d\'Alexandrie (38), Philon dirige une délégation juive à Rome. Caligula les reçoit avec mépris. Récit : "Legatio ad Gaium." Premier acte de diplomatie communautaire juive documenté en détail.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Philon_d%27Alexandrie',i:2},
{y:49,t:'Claude expulse les Juifs de Rome',d:'Suétone mentionne que Claude expulse les Juifs pour des troubles autour de "Chrestus." Aquila et Priscille fuient à Corinthe (Actes 18:2). Probablement un conflit entre Juifs et judéo-chrétiens sur la messianité de Jésus.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Expulsion_de_Rome_(49)',i:2},
{y:100,t:'Académie de Yavné — Réinvention du judaïsme',d:'Sous Raban Gamliel II, Yavné réorganise la vie juive : calendrier, Amidah (18 bénédictions), autorité halakhique centralisée. Le judaïsme se réinvente sans Temple, sans sacrifice, sans roi — Torah et prière comme substituts permanents.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Jabné',i:2},
