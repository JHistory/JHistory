{y:1819,t:'Pogroms Hep Hep — Réaction à l\'émancipation',d:'"Hep Hep !" — émeutes anti-juives en Allemagne (1819). Marchands juifs attaqués à Würzburg, Frankfurt, Hamburg. Réaction conservatrice à l\'émancipation napoléonienne. Montre la fragilité des droits acquis.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Émeutes_Hep_Hep',i:2},
{y:1840,t:'Affaire de Damas — Accusation de meurtre rituel',d:'À Damas, un moine capucin disparaît. Les Juifs accusés de meurtre rituel. Arrestations, tortures. Moses Montefiore et Adolphe Crémieux interviennent. Le sultan ottoman disculpe les Juifs. Révèle la persistance de l\'antisémitisme.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Affaire_de_Damas',i:3},
{y:1860,t:'Alliance Israélite Universelle fondée',d:'Adolphe Crémieux fonde l\'AIU (1860) à Paris. Première organisation juive mondiale. Réseau d\'écoles en Afrique du Nord, Levant, Empire ottoman. Diffuse le français et les valeurs des Lumières. 183 écoles en 1914.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Alliance_israélite_universelle',i:3},
{y:1871,t:'Émancipation des Juifs d\'Allemagne unifiée',d:'L\'unification allemande (1871) s\'accompagne de l\'émancipation complète des Juifs. Communauté prospère : banques, sciences (Helmholtz, Ehrlich), culture. Mais antisémitisme politique émerge : parti antisémite de Stoecker (1879), Treitschke ("Les Juifs sont notre malheur").',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Histoire_des_Juifs_en_Allemagne',i:2},
{y:1881,t:'Pogroms de Russie — Grande migration vers l\'Occident',d:'Après l\'assassinat d\'Alexandre II (1881), pogroms dans toute la Russie méridionale. Fuite massive : 2 millions vers l\'Amérique (1880-1924), premières Aliyot vers la Palestine. New York, Chicago, Buenos Aires : transformation du judaïsme mondial.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Pogroms_en_Russie',i:3},
{y:1894,t:'AFFAIRE DREYFUS — Antisémitisme républicain',d:'Alfred Dreyfus, capitaine juif, accusé à tort d\'espionnage (1894). Déporté à l\'Île du Diable. Zola : "J\'accuse !" (1898). Réhabilitation (1906). Herzl, journaliste présent à la dégradation, est traumatisé. L\'affaire est la matrice du sionisme politique.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Affaire_Dreyfus',i:3},
{y:1897,t:'PREMIER CONGRÈS SIONISTE — Bâle',d:'Theodor Herzl organise le Premier Congrès sioniste à Bâle (29-31 août 1897). Fondation de l\'Organisation sioniste mondiale. "Si vous le voulez, ce n\'est pas un rêve." Programme de Bâle : foyer national juif en Palestine. Acte fondateur de l\'État d\'Israël futur.',tr:'j_main',w:'https://fr.wikipedia.org/wiki/Premier_Congrès_sioniste',i:3},

// FIGURES JUIVES (j_fig) — 1500–1900
// ══════════════════════════════════════════════════════════
{y:1522,t:'Rabbi Moïse Cordovero — Kabbale de Safed',d:'Moïse Cordovero (1522-1570), disciple de Caro à Safed. Son Pardes Rimmonim (1548) est la première synthèse systématique de la kabbale médiévale. "Le Ramak." Maître d\'Isaac Louria. Figure centrale de la renaissance spirituelle de Safed.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Moïse_Cordovero',i:2},
{y:1534,t:'Isaac Louria (l\'Ari) — Kabbale lurianique',d:'Isaac Louria (1534-1572), "l\'Ari Hakadosh". Né en Egypte, mort à Safed à 38 ans. Révolutionne la kabbale : Tsimtsoum (contraction divine), Shevira (bris des vases), Tiqoun Olam (réparation du monde). Sa pensée domine la mystique juive depuis 450 ans.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Isaac_Louria',i:3},
{y:1543,t:'Hayyim Vital — Disciple de l\'Ari',d:'Hayyim Vital (1543-1620), principal disciple de Louria. Rédige et diffuse la kabbale lurianique (Ets Hayyim, Peri Ets Hayyim). Sa mise par écrit de l\'enseignement oral de l\'Ari est la source principale de la kabbale lurianique.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Hayyim_Vital',i:2},
{y:1520,t:'Maharal de Prague — Philosophie et Golem',d:'Judah Loew ben Bezalel (Maharal, ~1520-1609), grand rabbin de Prague sous Rodolphe II. Philosophie originale : essence d\'Israël, signification de la Torah. Reçu à la cour impériale. Tradition du Golem de Prague lui est attribuée.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Judah_Loew_ben_Bezalel',i:3},
{y:1510,t:'Gracia Mendes Nasi — Grande dame séfarade',d:'Gracia Mendes Nasi (1510-1569), financière marrane portugaise. Fuit l\'Inquisition via Anvers, Venise, jusqu\'à Constantinople. Son réseau financier protège des Marranes. Négocie avec Soliman le Magnifique pour les Juifs. Figure féminine majeure de l\'histoire juive.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Gracia_Mendes_Nasi',i:3},
{y:1632,t:'BARUCH SPINOZA — Père de la philosophie moderne',d:'Baruch Spinoza (1632-1677), né à Amsterdam dans une famille séfarade. Excommunié (herem) en 1656. Éthique (Deus sive Natura), Traité théologico-politique (critique biblique, liberté de pensée). Fonde la philosophie moderne, la critique historique de la Bible, le libéralisme politique.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Baruch_Spinoza',i:3},
{y:1626,t:'Sabbataï Tsevi — Faux Messie',d:'Sabbataï Tsevi (1626-1676), né à Smyrne. Personnalité bipolaire. Proclamé Messie par Nathan de Gaza (1665). Hystérie mondiale. Conversion à l\'Islam sous contrainte ottomane (1666). Ses partisans (Dönme) maintiennent un crypto-judaïsme en Turquie.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Sabbataï_Tsevi',i:3},
{y:1698,t:'Baal Shem Tov — Fondateur du Hassidisme',d:'Israël ben Eliezer (BeSHT, 1698-1760). Herboriste mystique de Podolie. "D. est présent en tout." La joie comme service divin. Les histoires (sipourim) comme enseignement. Révolution spirituelle accessible aux masses. Ses disciples forment les grandes dynasties hassidiques.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Baal_Shem_Tov',i:3},
{y:1720,t:'Gaon de Vilna — Le Grand Opposant',d:'Eliyahou ben Solomon Zalman (GRA, 1720-1797), "Gaon de Vilna". Génie talmudique absolu. Excommunie les hassidim (1772, 1781). Fonde les Mitnagdim (opposants). Commente l\'ensemble de la littérature rabbinique. Encourage l\'émigration en Palestine.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Gaon_de_Vilna',i:3},
{y:1745,t:'Shneur Zalman de Liadi — Chabad',d:'Shneur Zalman de Liadi (1745-1812), fondateur du Chabad (Habad). Tanya (1797) : chef-d\'œuvre de la pensée hassidique, synthèse mystique et intellectuelle. Arrêté puis libéré par les Russes. Fonde le hassidisme le plus intellectualisé.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Shneur_Zalman_de_Liadi',i:3},
{y:1772,t:'Nahman de Bratslav — Contes et mystique',d:'Nahman de Bratslav (1772-1810), arrière-petit-fils du BeSHT. Ses contes hassidiques (Sipourei Maassiyot) sont des chefs-d\'œuvre de la littérature mystique mondiale. "Na Nach Nachma Nachman Meuman." Mouvement vivant sans successeur désigné.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Nahman_de_Bratslav',i:3},
{y:1762,t:'Moïse Isserles (Rema) — Halakha ashkénaze',d:'Moïse Isserles de Cracovie (Rema, 1520-1572) ajoute la Mappah au Shulhan Aroukh de Caro (1569) : les coutumes ashkénazes. "Caro a dressé la table, Isserles l\'a recouverte." Ensemble ils définissent la halakha mondiale.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Moïse_Isserles',i:3},
{y:1810,t:'Abraham Geiger — Fondateur du Réforme',d:'Abraham Geiger (1810-1874), rabbin de Breslau et Frankfurt. Principal théologien du Réforme juive allemande. "La religion doit évoluer avec le temps." Modernise la liturgie, révise les pratiques. Savant orientaliste (Urschrift, 1857).',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Abraham_Geiger',i:3},
{y:1808,t:'Samson Raphael Hirsch — Orthodoxie moderne',d:'Samson Raphael Hirsch (1808-1888), grand rabbin de Frankfurt. "Torah im Derekh Eretz" : synthèse orthodoxie/culture allemande. Fonde la néo-orthodoxie face à la Réforme. Ses Dix-neuf Lettres (1836) fondent l\'orthodoxie moderne.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Samson_Raphael_Hirsch',i:3},
{y:1860,t:'Theodor Herzl — Fondateur du Sionisme politique',d:'Theodor Herzl (1860-1904), journaliste viennois. Traumatisé par l\'Affaire Dreyfus. L\'État juif (1896). Premier Congrès sioniste (Bâle, 1897). Rencontre le Kaiser Wilhelm II et le sultan Abdul Hamid II. Mort à 44 ans. "Si vous le voulez, ce n\'est pas un rêve."',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Theodor_Herzl',i:3},
{y:1856,t:'Eliezer Ben Yehoudah — Père de l\'hébreu moderne',d:'Eliezer Ben Yehoudah (1858-1922), né en Lituanie. S\'installe en Palestine (1881). Décide de ne parler qu\'en hébreu. Crée des milliers de néologismes. Son fils Ben-Zion est le premier enfant hébréophone natif depuis l\'Antiquité. Père de l\'hébreu moderne.',tr:'j_fig',w:'https://fr.wikipedia.org/wiki/Eliezer_Ben_Yehoudah',i:3},

// PERSONNALITÉS JUIVES SÉCULIÈRES (j_sec)
// ══════════════════════════════════════════════════════════
{y:1585,t:'Uriel da Costa — Précurseur de Spinoza',d:'Uriel da Costa (1585-1640), marrane portugais installé à Amsterdam. Rejette la Torah orale et l\'immortalité de l\'âme. Deux fois excommunié, deux fois réintégré avec humiliation publique (flagellation devant la congrégation). Se suicide. Sa vie inspire Spinoza.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Uriel_da_Costa',i:2},
{y:1632,t:'Spinoza — Philosophie radicale',d:'Baruch de Spinoza (1632-1677). Excommunié à 23 ans. Éthique (Deus sive Natura = D. = Nature). Traité théologico-politique (1670) : critique biblique historique, liberté de pensée. Fonde la philosophie moderne, la démocratie libérale. Influence : Hegel, Marx, Einstein.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Baruch_Spinoza',i:3},
{y:1797,t:'Heinrich Heine — Poète romantique',d:'Heinrich Heine (1797-1856), poète allemand d\'origine juive, converti au protestantisme. Lorelei, Deutschland ein Wintermärchen. Exilé à Paris. "Là où on brûle des livres, on finira par brûler des hommes" (1820). Ironie, lyrisme, critique sociale.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Heinrich_Heine',i:3},
{y:1809,t:'Felix Mendelssohn — Compositeur romantique',d:'Felix Mendelssohn-Bartholdy (1809-1847), petit-fils de Moses Mendelssohn. Baptisé protestant. Songe d\'une Nuit d\'Été, Symphonie Écossaise, oratorio Elias. Redécouvre Bach (Passion selon saint Matthieu, 1829). Chef d\'orchestre du Gewandhaus de Leipzig.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Felix_Mendelssohn',i:3},
{y:1818,t:'Karl Marx — Révolutionnaire',d:'Karl Marx (1818-1883), né à Trèves dans une famille juive convertie. Manifeste du Parti Communiste (1848), Le Capital (1867). Père du marxisme. Influence mondiale irréversible. Sa vision de "la Question Juive" (1844) reste controversée.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Karl_Marx',i:3},
{y:1812,t:'Heinrich Graetz — Historien du peuple juif',d:'Heinrich Graetz (1817-1891), historien allemand. Histoire des Juifs en 11 volumes (1853-1876). Première grande histoire moderne du peuple juif. Réveille la conscience nationale juive. Sa vision nationaliste influencera le sionisme.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Heinrich_Graetz',i:2},
{y:1858,t:'Émile Durkheim — Père de la sociologie',d:'Émile Durkheim (1858-1917), fils et petit-fils de rabbins alsaciens, laïque républicain. Le Suicide (1897), Les Formes élémentaires de la vie religieuse (1912). Fondateur de la sociologie moderne. Sa méthode objective transforme les sciences sociales.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Émile_Durkheim',i:3},
{y:1856,t:'Sigmund Freud — Père de la psychanalyse',d:'Sigmund Freud (1856-1939), né à Freiberg (Moravie). Crée la psychanalyse : inconscient, complexe d\'Œdipe, Interprétation des rêves (1900). "Je suis juif et je le resterai." Fuit Vienne en 1938. Moïse et le Monothéisme (1939) : controverse sur les origines du monothéisme.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Sigmund_Freud',i:3},
{y:1844,t:'Rosa Luxemburg — Révolutionnaire marxiste',d:'Rosa Luxemburg (1871-1919), née en Pologne russe dans une famille juive. Théoricienne marxiste, cofondatrice du KPD et de la Ligue Spartakiste. "La liberté c\'est toujours la liberté de celui qui pense autrement." Assassinée par les corps francs (1919).',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Rosa_Luxemburg',i:3},
{y:1859,t:'Sholem Aleichem — Père de la littérature yiddish',d:'Sholem Aleichem (Sholem Rabinovitch, 1859-1916). "Tevye le Laitier" (base de Fiddler on the Roof). "Twain juif". Voix de l\'humour tragique des shtetls d\'Europe de l\'Est. Yiddish = langue nationale des Ashkénazes.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Sholem_Aleichem',i:3},
{y:1850,t:'Camille Pissarro — Père de l\'impressionnisme',d:'Camille Pissarro (1830-1903), né aux Antilles dans une famille séfarade, peintre impressionniste. Un des fondateurs du mouvement impressionniste avec Monet et Renoir. Mentor de Cézanne et Gauguin. Unique artiste présent aux 8 expositions impressionnistes.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Camille_Pissarro',i:2},
{y:1838,t:'Adolphe Crémieux — Émancipateur',d:'Adolphe Crémieux (1796-1880), avocat et homme politique français. Défend les droits des Juifs à l\'intérieur et à l\'extérieur. Décret Crémieux (1870) : citoyenneté française pour les Juifs d\'Algérie. Fonde l\'Alliance Israélite Universelle (1860).',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Adolphe_Crémieux',i:3},
{y:1784,t:'Moses Montefiore — Philanthrope mondial',d:'Moses Montefiore (1784-1885), financier britannique séfarade. Intervient pour les Juifs dans le monde entier : Affaire de Damas (1840), Pogroms de Russie. Construit le premier quartier juif hors des murs de Jérusalem (Mishkenot Shaananim, 1860). Chevalier de la Reine Victoria.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Moses_Montefiore',i:3},
{y:1880,t:'Ahad Ha\'am — Sionisme culturel',d:'Asher Ginsberg dit Ahad Ha\'am (1856-1927), intellectuel d\'Odessa. Fonde le sionisme culturel : la Palestine doit être un "centre spirituel" juif, pas seulement un refuge. S\'oppose à Herzl sur la primauté de la culture sur la politique.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Ahad_Ha%27am',i:2},
{y:1862,t:'Leon Pinsker — Auto-émancipation',d:'Leon Pinsker (1821-1891), médecin d\'Odessa. Après le pogrom de 1881, publie Auto-Émancipation (1882). Les Juifs doivent s\'émanciper eux-mêmes. Fonde les Hovevei Zion (Amants de Sion). Précurseur direct d\'Herzl.',tr:'j_sec',w:'https://fr.wikipedia.org/wiki/Leon_Pinsker',i:2},

// ══════════════════════════════════════════════════════════
{y:1534,t:'École de Safed — Renaissance kabbalistique',d:'Safed devient dans la seconde moitié du XVIe s. le centre mondial de la kabbale. Louria, Caro, Cordovero : révolution spirituelle et juridique simultanée. Le Shulhan Aroukh et la kabbale lurianique naissent dans la même ville au même moment.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Safed',i:3},
{y:1665,t:'Sabbatéisme — Crise messianique mondiale',d:'Le mouvement de Sabbataï Tsevi (1665-1666) est la plus grande crise messianique juive. Sa conversion divise : les Dönme (crypto-juifs islamisés en Turquie), le Frankisme (Jacob Frank, 1726-1791, en Pologne), les croyants secrets. Influence durable sur Haskalah et Hassidisme.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Sabbatéisme',i:3},
{y:1700,t:'HASSIDISME — Révolution populaire mystique',d:'Mouvement né en Podolie avec le BeSHT (~1700). Réaction contre l\'élitisme talmudique. Joie, prière, tsaddik (guide spirituel). Dynasties : Chabad, Bratslav, Gour, Belz, Satmar, Vizhnitz, Karlin... Aujourd\'hui ~1,5 million de fidèles.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Hassidisme',i:3},
{y:1772,t:'Mitnagdim — Opposition talmudique au Hassidisme',d:'Le Gaon de Vilna excommunie les hassidim (1772, 1781). Les Mitnagdim : judaïsme centré sur l\'étude intensive du Talmud. Yeshivot de Volozhin, Mir, Slobodka. Conflit violent. Réconciliation au XIXe s. face à la Haskalah.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Mitnagdim',i:2},
{y:1726,t:'Frankisme — Dérive sabbatéenne',d:'Jacob Frank (1726-1791), de Pologne, se proclame successeur de Sabbataï Tsevi. Libertinisme rituel, antinomisme (transgression des lois). Convertit ses milliers de disciples au catholicisme (1759). Ses descendants se fondent dans la noblesse polonaise.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Jacob_Frank',i:2},
{y:1810,t:'Judaïsme Réformé — Hambourg 1818',d:'Réforme de la synagogue de Hambourg (1818) : prières en allemand, orgue, sermon en langue vernaculaire. Israel Jacobson, Abraham Geiger théorisent. Synodes de Brunswick (1844) et Frankfurt (1845). Fondement du mouvement Réforme mondial.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Judaïsme_réformé',i:3},
{y:1762,t:'Moïse Hatam Sofer — Orthodoxie intransigeante',d:'Moses Sofer (Chatam Sofer, 1762-1839), grand rabbin de Pressburg. "Hadash assur min HaTorah" (tout nouveau est interdit par la Torah). Résiste absolument à la Réforme. Fonde l\'orthodoxie hongroise ultra-conservatrice encore vivante.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Hatam_Sofer',i:3},
{y:1854,t:'Wissenschaft des Judentums — Science du Judaïsme',d:'Bewegung fondé par Leopold Zunz, Heinrich Graetz, Abraham Geiger. Étude historique et critique du judaïsme avec méthodes scientifiques. Révolutionne la compréhension de la littérature juive. Fonde les études judaïques académiques (Jewish studies).',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Wissenschaft_des_Judentums',i:2},
{y:1808,t:'Orthodoxie Néo-Orthodoxe — Torah im Derekh Eretz',d:'Samson Raphael Hirsch fonde la Israelitische Religionsgesellschaft à Frankfurt (1851). Torah et culture générale compatibles. Modèle pour l\'orthodoxie moderne mondiale — contre la Réforme ET l\'orthodoxie purement ghetto.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Néo-orthodoxie_(judaïsme)',i:2},
{y:1887,t:'Jewish Theological Seminary — Mouvement Massorti',d:'JTS fondé à New York (1886). Solomon Schechter en fait le centre du Conservative Judaism (Massorti). Halakha normative mais méthode historique critique. Entre orthodoxie et réforme. Devient le plus grand mouvement juif américain du XXe s.',tr:'j_sects',w:'https://fr.wikipedia.org/wiki/Judaïsme_conservateur',i:2},
